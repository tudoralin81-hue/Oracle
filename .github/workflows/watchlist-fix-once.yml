name: Watchlist Fix Once
on:
  push:
    branches: [ main ]
permissions:
  contents: write
jobs:
  fix-and-build:
    runs-on: ubuntu-latest
    env:
      ORACLE_KEYSTORE_BASE64: ${{ secrets.ORACLE_KEYSTORE_BASE64 }}
      ORACLE_KEYSTORE_PASSWORD: ${{ secrets.ORACLE_KEYSTORE_PASSWORD }}
      ORACLE_KEY_ALIAS: ${{ secrets.ORACLE_KEY_ALIAS }}
      ORACLE_KEY_PASSWORD: ${{ secrets.ORACLE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Fix Watchlist delete refresh
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/src/main/java/ro/alintudor/oracle/nativeui/OracleAnalysisModules.kt')
          s = p.read_text()
          old = '''    private fun renderWatchlist(items: List<String>) {
        host.addSectionLabel("WATCHLIST • TICKERE SALVATE")'''
          new = '''    private fun renderWatchlist(items: List<String>) {
        host.content.removeAllViews()
        host.addSectionLabel("WATCHLIST • TICKERE SALVATE")'''
          if old not in s:
              raise SystemExit('Expected Watchlist render block not found')
          p.write_text(s.replace(old, new, 1))
      - name: Commit source fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/ro/alintudor/oracle/nativeui/OracleAnalysisModules.kt
          git commit -m "fix: Watchlist delete refresh [skip ci]"
          git push
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android 16 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Prepare production signing key when configured
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$ORACLE_KEYSTORE_BASE64" ] && [ -n "$ORACLE_KEYSTORE_PASSWORD" ] && [ -n "$ORACLE_KEY_ALIAS" ] && [ -n "$ORACLE_KEY_PASSWORD" ]; then
            echo "$ORACLE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/oracle-release.jks"
            {
              echo "ORACLE_KEYSTORE_FILE=$RUNNER_TEMP/oracle-release.jks"
              echo "ORACLE_KEYSTORE_PASSWORD=$ORACLE_KEYSTORE_PASSWORD"
              echo "ORACLE_KEY_ALIAS=$ORACLE_KEY_ALIAS"
              echo "ORACLE_KEY_PASSWORD=$ORACLE_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
          fi
      - name: Build signed release APK
        run: gradle :app:assembleRelease --stacktrace
      - name: Verify release APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Oracle-Watchlist-Fix
          path: app/build/outputs/apk/release/*.apk
      - name: Remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/watchlist-fix-once.yml
          git commit -m "chore: remove one-shot Watchlist fix workflow [skip ci]"
          git push
