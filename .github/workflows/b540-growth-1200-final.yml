name: Oracle B541 Claude Exact Build
on:
  push:
    branches: [B541-CLAUDE-EXACT]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Claude Growth changes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/ro/alintudor/oracle/nativeui/OracleGrowthModule.kt')
          s=p.read_text(encoding='utf-8')
          old='import ro.alintudor.oracle.core.OracleGrowthRecommendation\n'
          assert old in s
          if 'import ro.alintudor.oracle.core.OracleLoaderQuotes' not in s:
              s=s.replace(old, old+'import ro.alintudor.oracle.core.OracleLoaderQuotes\n', 1)
          old='''    private val loaderQuotes = listOf(\n        "\\\"Price is what you pay; value is what you get.\\\"\\n— Benjamin Graham",\n        "\\\"Rule No. 1: Never lose money. Rule No. 2: Never forget Rule No. 1.\\\"\\n— Warren Buffett",\n        "\\\"The most important quality for an investor is temperament, not intellect.\\\"\\n— Warren Buffett",\n        "\\\"It's only when the tide goes out that you learn who's been swimming naked.\\\"\\n— Warren Buffett",\n        "\\\"In the short run, the market is a voting machine, but in the long run it is a weighing machine.\\\"\\n— Benjamin Graham",\n        "\\\"The intelligent investor is a realist who sells to optimists and buys from pessimists.\\\"\\n— Benjamin Graham",\n        "\\\"Invert, always invert.\\\"\\n— Charlie Munger",\n        "\\\"Behind every stock is a company. Find out what it's doing.\\\"\\n— Peter Lynch",\n        "\\\"The four most dangerous words in investing are: this time it's different.\\\"\\n— Sir John Templeton"\n    )\n'''
          if old in s:
              s=s.replace(old,'''    private val loaderQuotes = OracleLoaderQuotes.ALL\n''',1)
          old='''        val progressLabel = text("DATE ÎNCĂRCATE: 0 / ${initial.total}", 12f, Typeface.DEFAULT_BOLD, cyan, 0, 10).apply { gravity = Gravity.CENTER }\n'''
          if old in s:
              s=s.replace(old,'''        val progressLabel = text("DATE ÎNCĂRCATE: 0 / ${initial.total}", 12f, Typeface.DEFAULT_BOLD, cyan, 0, 6).apply { gravity = Gravity.CENTER }\n''',1)
          old='''        card.addView(progressLabel)\n        val progressBar = ProgressBar(host.root.context, null, android.R.attr.progressBarStyleHorizontal).apply {\n'''
          if old in s and 'val percentLabel = text("0%"' not in s:
              s=s.replace(old,'''        card.addView(progressLabel)\n        val percentLabel = text("0%", 12f, Typeface.DEFAULT_BOLD, green, 0, 8).apply { gravity = Gravity.CENTER }\n        card.addView(percentLabel)\n        val progressBar = ProgressBar(host.root.context, null, android.R.attr.progressBarStyleHorizontal).apply {\n''',1)
          old='''        val quoteLabel = text(loaderQuotes.first(), 10f, Typeface.DEFAULT, white, 0, 9).apply { gravity = Gravity.CENTER; setLineSpacing(0f, 1.1f) }\n'''
          if old in s:
              s=s.replace(old,'''        val quoteLabel = text(loaderQuotes.first(), 12f, Typeface.DEFAULT, orange, 0, 9).apply { gravity = Gravity.CENTER; setLineSpacing(0f, 1.15f) }\n''',1)
          old='''        host.content.addView(card, LinearLayout.LayoutParams(-1, host.dp(390)).apply { setMargins(0, 0, 0, host.dp(10)) })\n'''
          if old in s:
              s=s.replace(old,'''        host.content.addView(card, LinearLayout.LayoutParams(-1, host.dp(414)).apply { setMargins(0, 0, 0, host.dp(10)) })\n''',1)
          old='''                progressLabel.text = "DATE ÎNCĂRCATE: $shown / $total"\n'''
          if old in s and 'percentLabel.text = "${(shown * 100 / total)}%"' not in s:
              s=s.replace(old,'''                progressLabel.text = "DATE ÎNCĂRCATE: $shown / $total"\n                percentLabel.text = "${(shown * 100 / total)}%"\n''',1)
          old='''        header.addView(text("ULTIMELE RECOMANDĂRI", 15f, Typeface.DEFAULT_BOLD, cyan, 0, 0), LinearLayout.LayoutParams(0, -2, 1f))\n'''
          if old in s:
              s=s.replace(old,'''        header.addView(text("ULTIMELE RECOMANDĂRI", 15f, Typeface.DEFAULT_BOLD, cyan, 0, 0))\n\n        val arrow = TextView(host.root.context).apply {\n            text = "▼"\n            textSize = 17f\n            typeface = Typeface.DEFAULT_BOLD\n            gravity = Gravity.CENTER\n            setTextColor(cyan)\n            isClickable = true\n            isFocusable = true\n            contentDescription = "Extinde/restrânge ultimele recomandări"\n        }\n        header.addView(arrow, LinearLayout.LayoutParams(host.dp(34), host.dp(34)).apply { setMargins(host.dp(6), 0, 0, 0) })\n        header.addView(View(host.root.context), LinearLayout.LayoutParams(0, -2, 1f))\n''',1)
          old='''        header.addView(download, LinearLayout.LayoutParams(host.dp(94), host.dp(40)))\n\n        val arrow = TextView(host.root.context).apply {\n            text = "⌄"\n            textSize = 23f\n            typeface = Typeface.DEFAULT_BOLD\n            gravity = Gravity.CENTER\n            setTextColor(cyan)\n            setPadding(0, 0, 0, host.dp(2))\n            isClickable = true\n            isFocusable = true\n        }\n        header.addView(arrow, LinearLayout.LayoutParams(host.dp(38), host.dp(40)))\n'''
          if old in s:
              s=s.replace(old,'''        header.addView(download, LinearLayout.LayoutParams(host.dp(94), host.dp(40)))\n''',1)
          old='''        val rows = LinearLayout(host.root.context).apply { orientation = LinearLayout.VERTICAL }\n        card.addView(rows)\n\n        fun addPlaceholder() {\n            val row = historyRow(null)\n            rows.addView(row, LinearLayout.LayoutParams(-1, -2).apply { setMargins(0, host.dp(6), 0, 0) })\n        }\n        fun addEntry(item: OracleGrowthRecommendation) {\n            val row = historyRow(item)\n            rows.addView(row, LinearLayout.LayoutParams(-1, -2).apply { setMargins(0, host.dp(6), 0, 0) })\n        }\n\n        val visible = all.take(6)\n        visible.forEach { addEntry(it) }\n        repeat(maxOf(0, 6 - visible.size)) { addPlaceholder() }\n        val expandedRows = all.drop(6)\n        val expandedViews = expandedRows.map { item ->\n            val row = historyRow(item)\n            row.visibility = View.GONE\n            rows.addView(row, LinearLayout.LayoutParams(-1, -2).apply { setMargins(0, host.dp(6), 0, 0) })\n            row\n        }\n'''
          if old in s:
              s=s.replace(old,'''        val rows = LinearLayout(host.root.context).apply {\n            orientation = LinearLayout.VERTICAL\n            visibility = View.GONE\n        }\n        val visible = all.take(6)\n        visible.forEach { item ->\n            rows.addView(historyRow(item), LinearLayout.LayoutParams(-1, -2).apply { setMargins(0, host.dp(6), 0, 0) })\n        }\n        repeat(maxOf(0, 6 - visible.size)) {\n            rows.addView(historyRow(null), LinearLayout.LayoutParams(-1, -2).apply { setMargins(0, host.dp(6), 0, 0) })\n        }\n        card.addView(rows, LinearLayout.LayoutParams(-1, -2).apply { setMargins(0, host.dp(2), 0, 0) })\n\n''',1)
          old='''            arrow.text = if (expanded) "⌃" else "⌄"\n            expandedViews.forEach { it.visibility = if (expanded) View.VISIBLE else View.GONE }\n'''
          if old in s:
              s=s.replace(old,'''            arrow.text = if (expanded) "▲" else "▼"\n            rows.visibility = if (expanded) View.VISIBLE else View.GONE\n''',1)
          old='''        host.content.addView(text("BUILD B535 • GROWTH", 9f, Typeface.DEFAULT_BOLD, Color.rgb(125, 135, 155), host.dp(4), 8), LinearLayout.LayoutParams(-1, -2).apply { setMargins(0, 0, 0, host.dp(18)) })\n'''
          if old in s:
              s=s.replace(old,'''        host.content.addView(text("BUILD B541 • GROWTH", 9f, Typeface.DEFAULT_BOLD, Color.rgb(125, 135, 155), host.dp(4), 8), LinearLayout.LayoutParams(-1, -2).apply { setMargins(0, 0, 0, host.dp(18)) })\n''',1)
          p.write_text(s,encoding='utf-8')
          PY
          git diff --check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Verify Claude files and required changes
        run: |
          set -euo pipefail
          test "$(git hash-object app/build.gradle)" = "d022d396cbb8c7960a51190b38d36b4acaa228fc"
          test "$(git hash-object app/src/main/java/ro/alintudor/oracle/core/OracleLoaderQuotes.kt)" = "c9f6eff1a913d0c2362b4b62752537730c6d2e1b"
          test "$(git hash-object app/src/main/java/ro/alintudor/oracle/OracleMysticActivity.kt)" = "81eb83863a7f2a66ad897f189c18ea18c5a991ab"
          test "$(git hash-object app/src/main/java/ro/alintudor/oracle/OracleMysticStartView.kt)" = "05d6c3a6bda3e62c6e2f1b8175c6041d1b0db2fc"
          grep -q "versionCode 32" app/build.gradle
          grep -q "V6g-START-PREMIUM-B541" app/build.gradle
          grep -q "OracleLoaderQuotes.ALL" app/src/main/java/ro/alintudor/oracle/nativeui/OracleGrowthModule.kt
          grep -q 'percentLabel.text = "${shown}' app/src/main/java/ro/alintudor/oracle/nativeui/OracleGrowthModule.kt
          grep -q 'bootDurationMs = 5_000L' app/src/main/java/ro/alintudor/oracle/OracleMysticActivity.kt
          grep -q 'text = "▼"' app/src/main/java/ro/alintudor/oracle/nativeui/OracleGrowthModule.kt
          grep -q 'rows.visibility = if (expanded) View.VISIBLE else View.GONE' app/src/main/java/ro/alintudor/oracle/nativeui/OracleGrowthModule.kt
          echo "Growth blob: $(git hash-object app/src/main/java/ro/alintudor/oracle/nativeui/OracleGrowthModule.kt)"
      - name: Persist Growth result
        run: |
          set -euo pipefail
          git config user.name "tudoralin81-hue"
          git config user.email "tudor.alin81@gmail.com"
          git add app/src/main/java/ro/alintudor/oracle/nativeui/OracleGrowthModule.kt
          git diff --cached --quiet || git commit -m "B541: Claude Growth changes [skip ci]"
          git push origin HEAD:B541-CLAUDE-EXACT
      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Verify APK
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          BADGING="$($ANDROID_HOME/build-tools/36.0.0/aapt dump badging "$APK")"
          echo "$BADGING" | grep -q "versionCode='32'"
          echo "$BADGING" | grep -q "versionName='V6g-START-PREMIUM-B541'"
          sha256sum "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: Oracle-APK-B541-CLAUDE-EXACT
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
