name: Oracle B540 Growth 1200 Final
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore exact frozen B539 files
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin 3eb9b3284c24f94cf8126dd9916b615038664ae8
          for f in \
            app/src/main/java/ro/alintudor/oracle/OracleMysticStartView.kt \
            app/src/main/java/ro/alintudor/oracle/nativeui/OracleGrowthModule.kt \
            app/src/main/java/ro/alintudor/oracle/nativeui/OracleNewsModule.kt \
            app/src/main/java/ro/alintudor/oracle/nativeui/OraclePortfolioModule.kt \
            app/src/main/java/ro/alintudor/oracle/nativeui/OracleAlertsModule.kt \
            app/src/main/java/ro/alintudor/oracle/nativeui/OracleAnalysisModules.kt \
            app/src/main/java/ro/alintudor/oracle/core/OracleKnowledgeSync.kt; do
            git checkout 3eb9b3284c24f94cf8126dd9916b615038664ae8 -- "$f"
          done
          mkdir -p /tmp/oracle-freeze
          for f in \
            app/src/main/java/ro/alintudor/oracle/OracleMysticStartView.kt \
            app/src/main/java/ro/alintudor/oracle/nativeui/OracleGrowthModule.kt \
            app/src/main/java/ro/alintudor/oracle/nativeui/OracleNewsModule.kt \
            app/src/main/java/ro/alintudor/oracle/nativeui/OraclePortfolioModule.kt \
            app/src/main/java/ro/alintudor/oracle/nativeui/OracleAlertsModule.kt \
            app/src/main/java/ro/alintudor/oracle/nativeui/OracleAnalysisModules.kt \
            app/src/main/java/ro/alintudor/oracle/core/OracleKnowledgeSync.kt; do git hash-object "$f"; done > /tmp/oracle-freeze/before
      - name: Restore verified B539 Growth card implementation
        run: |
          set -euo pipefail
          python3 scripts/b538_growth_fix.py
          grep -q 'summaryViews.forEach { it.visibility = View.VISIBLE }' app/src/main/java/ro/alintudor/oracle/nativeui/OracleGrowthModule.kt
          grep -q 'olderViews.forEach { it.visibility = if (expanded) View.VISIBLE else View.GONE }' app/src/main/java/ro/alintudor/oracle/nativeui/OracleGrowthModule.kt
          grep -q 'var expanded = false' app/src/main/java/ro/alintudor/oracle/nativeui/OracleGrowthModule.kt
          git diff --check
      - name: Apply Growth 1200 performance patch only
        run: |
          set -euo pipefail
          python3 scripts/b540_growth_1200_build.py
          git diff --check
      - name: Set B540 identity
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('app/build.gradle');s=p.read_text(encoding='utf-8')
          s=re.sub(r'versionCode\s+\d+','versionCode 35',s,count=1)
          s=re.sub(r'versionName\s+[\'\"][^\'\"]*[\'\"]',"versionName 'V6g-GROWTH-B540'",s,count=1)
          p.write_text(s,encoding='utf-8')
          PY
          git diff --check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Verify APK and frozen modules
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          BADGING="$($ANDROID_HOME/build-tools/36.0.0/aapt dump badging "$APK")"
          echo "$BADGING" | grep -q "versionCode='35'"
          echo "$BADGING" | grep -q "versionName='V6g-GROWTH-B540'"
          for f in \
            app/src/main/java/ro/alintudor/oracle/OracleMysticStartView.kt \
            app/src/main/java/ro/alintudor/oracle/nativeui/OracleNewsModule.kt \
            app/src/main/java/ro/alintudor/oracle/nativeui/OraclePortfolioModule.kt \
            app/src/main/java/ro/alintudor/oracle/nativeui/OracleAlertsModule.kt \
            app/src/main/java/ro/alintudor/oracle/nativeui/OracleAnalysisModules.kt \
            app/src/main/java/ro/alintudor/oracle/core/OracleKnowledgeSync.kt; do git hash-object "$f"; done > /tmp/oracle-freeze/after
          cmp /tmp/oracle-freeze/before /tmp/oracle-freeze/after
          grep -q 'TARGET_UNIVERSE_SIZE=1200' app/src/main/java/ro/alintudor/oracle/core/OracleGrowthEngine.kt
          grep -q 'fetchDailyBatch' app/src/main/java/ro/alintudor/oracle/core/OracleGrowthEngine.kt
          sha256sum "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: Oracle-APK-B540-GROWTH-1200-FAST-FINAL
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
# B540 retry trigger: build only from the verified B539 base and Growth-only changes.
