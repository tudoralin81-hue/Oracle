name: Oracle B541 Claude Exact Build
on:
  push:
    branches: [B541-CLAUDE-EXACT]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Claude B541 diff exactly
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/ro/alintudor/oracle/nativeui/OracleGrowthModule.kt')
          s=p.read_text(encoding='utf-8')
          old='''        header.addView(text("ULTIMELE RECOMANDĂRI", 15f, Typeface.DEFAULT_BOLD, cyan, 0, 0), LinearLayout.LayoutParams(0, -2, 1f))\n'''
          new='''        header.addView(text("ULTIMELE RECOMANDĂRI", 15f, Typeface.DEFAULT_BOLD, cyan, 0, 0))\n\n        // Arrow sits right next to the title, not pushed to the far edge of the row.\n        val arrow = TextView(host.root.context).apply {\n            text = "▼"\n            textSize = 17f\n            typeface = Typeface.DEFAULT_BOLD\n            gravity = Gravity.CENTER\n            setTextColor(cyan)\n            isClickable = true\n            isFocusable = true\n            contentDescription = "Extinde/restrânge ultimele recomandări"\n        }\n        header.addView(arrow, LinearLayout.LayoutParams(host.dp(34), host.dp(34)).apply { setMargins(host.dp(6), 0, 0, 0) })\n\n        // Spacer pushes the PDF download control to the right edge.\n        header.addView(View(host.root.context), LinearLayout.LayoutParams(0, -2, 1f))\n'''
          assert old in s
          s=s.replace(old,new,1)
          old2='''        val arrow = TextView(host.root.context).apply {\n            text = "⌄"\n            textSize = 23f\n            typeface = Typeface.DEFAULT_BOLD\n            gravity = Gravity.CENTER\n            setTextColor(cyan)\n            setPadding(0, 0, 0, host.dp(2))\n            isClickable = true\n            isFocusable = true\n        }\n        header.addView(arrow, LinearLayout.LayoutParams(host.dp(38), host.dp(40)))\n'''
          assert old2 in s
          s=s.replace(old2,'',1)
          old3='''        val rows = LinearLayout(host.root.context).apply { orientation = LinearLayout.VERTICAL }\n        card.addView(rows)\n\n        fun addPlaceholder() {\n            val row = historyRow(null)\n            rows.addView(row, LinearLayout.LayoutParams(-1, -2).apply { setMargins(0, host.dp(6), 0, 0) })\n        }\n        fun addEntry(item: OracleGrowthRecommendation) {\n            val row = historyRow(item)\n            rows.addView(row, LinearLayout.LayoutParams(-1, -2).apply { setMargins(0, host.dp(6), 0, 0) })\n        }\n\n        val visible = all.take(6)\n        visible.forEach { addEntry(it) }\n        repeat(maxOf(0, 6 - visible.size)) { addPlaceholder() }\n        val expandedRows = all.drop(6)\n        val expandedViews = expandedRows.map { item ->\n            val row = historyRow(item)\n            row.visibility = View.GONE\n            rows.addView(row, LinearLayout.LayoutParams(-1, -2).apply { setMargins(0, host.dp(6), 0, 0) })\n            row\n        }\n'''
          new3='''        // Only the last 6 recommendations are ever shown here; the whole block\n        // starts collapsed and the arrow toggles the entire rows container.\n        val rows = LinearLayout(host.root.context).apply {\n            orientation = LinearLayout.VERTICAL\n            visibility = View.GONE\n        }\n        val visible = all.take(6)\n        visible.forEach { item ->\n            rows.addView(historyRow(item), LinearLayout.LayoutParams(-1, -2).apply { setMargins(0, host.dp(6), 0, 0) })\n        }\n        repeat(maxOf(0, 6 - visible.size)) {\n            rows.addView(historyRow(null), LinearLayout.LayoutParams(-1, -2).apply { setMargins(0, host.dp(6), 0, 0) })\n        }\n        card.addView(rows, LinearLayout.LayoutParams(-1, -2).apply { setMargins(0, host.dp(2), 0, 0) })\n\n'''
          assert old3 in s
          s=s.replace(old3,new3,1)
          old4='''        arrow.setOnClickListener {\n            expanded = !expanded\n            arrow.text = if (expanded) "⌃" else "⌄"\n            expandedViews.forEach { it.visibility = if (expanded) View.VISIBLE else View.GONE }\n        }\n'''
          new4='''        arrow.setOnClickListener {\n            expanded = !expanded\n            arrow.text = if (expanded) "▲" else "▼"\n            rows.visibility = if (expanded) View.VISIBLE else View.GONE\n        }\n'''
          assert old4 in s
          s=s.replace(old4,new4,1)
          p.write_text(s,encoding='utf-8')
          PY
          git diff --check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Verify B541 sources
        run: |
          set -euo pipefail
          grep -q "versionCode 31" app/build.gradle
          grep -q "V6g-GROWTH-BOOT-B541" app/build.gradle
          grep -q "showBootLoader" app/src/main/java/ro/alintudor/oracle/OracleMysticActivity.kt
          grep -q 'bootDurationMs = 5_000L' app/src/main/java/ro/alintudor/oracle/OracleMysticActivity.kt
          grep -q 'text = "▼"' app/src/main/java/ro/alintudor/oracle/nativeui/OracleGrowthModule.kt
          grep -q 'rows.visibility = if (expanded) View.VISIBLE else View.GONE' app/src/main/java/ro/alintudor/oracle/nativeui/OracleGrowthModule.kt
      - name: Build B541 release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Verify APK
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          BADGING="$($ANDROID_HOME/build-tools/36.0.0/aapt dump badging "$APK")"
          echo "$BADGING" | grep -q "versionCode='31'"
          echo "$BADGING" | grep -q "versionName='V6g-GROWTH-BOOT-B541'"
          sha256sum "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: Oracle-APK-B541-CLAUDE-EXACT
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
