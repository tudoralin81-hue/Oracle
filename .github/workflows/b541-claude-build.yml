name: Oracle B541 Claude Build
on:
  push:
    branches: [B541-CLAUDE-EXACT]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Claude Growth changes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/ro/alintudor/oracle/nativeui/OracleGrowthModule.kt')
          s=p.read_text(encoding='utf-8')
          s=s.replace('import ro.alintudor.oracle.core.OracleGrowthRecommendation\n','import ro.alintudor.oracle.core.OracleGrowthRecommendation\nimport ro.alintudor.oracle.core.OracleLoaderQuotes\n',1) if 'OracleLoaderQuotes' not in s else s
          import re
          s=re.sub(r'    private val loaderQuotes = listOf\(.*?\n    \)\n', '    private val loaderQuotes = OracleLoaderQuotes.ALL\n', s, count=1, flags=re.S)
          s=s.replace('text("DATE ÎNCĂRCATE: 0 / ${initial.total}", 12f, Typeface.DEFAULT_BOLD, cyan, 0, 10)', 'text("DATE ÎNCĂRCATE: 0 / ${initial.total}", 12f, Typeface.DEFAULT_BOLD, cyan, 0, 6)',1)
          if 'val percentLabel = text("0%"' not in s:
              s=s.replace('card.addView(progressLabel)\n        val progressBar', 'card.addView(progressLabel)\n        val percentLabel = text("0%", 12f, Typeface.DEFAULT_BOLD, green, 0, 8).apply { gravity = Gravity.CENTER }\n        card.addView(percentLabel)\n        val progressBar',1)
          s=s.replace('text(loaderQuotes.first(), 10f, Typeface.DEFAULT, white, 0, 9)', 'text(loaderQuotes.first(), 12f, Typeface.DEFAULT, orange, 0, 9)',1)
          s=s.replace('host.dp(390)', 'host.dp(414)',1)
          s=s.replace('progressLabel.text = "DATE ÎNCĂRCATE: $shown / $total"\n', 'progressLabel.text = "DATE ÎNCĂRCATE: $shown / $total"\n                percentLabel.text = "${(shown * 100 / total)}%"\n',1)
          s=s.replace('text = "⌄"', 'text = "▼"',1)
          s=s.replace('arrow.text = if (expanded) "⌃" else "⌄"\n            expandedViews.forEach { it.visibility = if (expanded) View.VISIBLE else View.GONE }', 'arrow.text = if (expanded) "▲" else "▼"\n            rows.visibility = if (expanded) View.VISIBLE else View.GONE',1)
          s=s.replace('BUILD B535 • GROWTH','BUILD B541 • GROWTH')
          p.write_text(s,encoding='utf-8')
          PY
          git diff --check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Verify source before build
        run: |
          set -euo pipefail
          grep -q 'versionCode 32' app/build.gradle
          grep -q 'V6g-START-PREMIUM-B541' app/build.gradle
          grep -q 'OracleLoaderQuotes.ALL' app/src/main/java/ro/alintudor/oracle/nativeui/OracleGrowthModule.kt
          grep -q 'percentLabel.text' app/src/main/java/ro/alintudor/oracle/nativeui/OracleGrowthModule.kt
          grep -q 'bootDurationMs = 5_000L' app/src/main/java/ro/alintudor/oracle/OracleMysticActivity.kt
          echo "SOURCE CHECK OK"
      - name: Persist Growth source
        run: |
          set -euo pipefail
          git config user.name 'tudoralin81-hue'
          git config user.email 'tudor.alin81@gmail.com'
          git add app/src/main/java/ro/alintudor/oracle/nativeui/OracleGrowthModule.kt
          git diff --cached --quiet || git commit -m 'B541: persist Claude Growth changes [skip ci]'
          git push origin HEAD:B541-CLAUDE-EXACT
      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Verify APK
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          BADGING="$($ANDROID_HOME/build-tools/36.0.0/aapt dump badging "$APK")"
          echo "$BADGING" | grep -q "versionCode='32'"
          echo "$BADGING" | grep -q "versionName='V6g-START-PREMIUM-B541'"
          sha256sum "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: Oracle-APK-B541-CLAUDE-EXACT
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
