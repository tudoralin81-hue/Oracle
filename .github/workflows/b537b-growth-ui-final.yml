name: Oracle B537 Growth UI Final
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Freeze protected modules
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/oracle-freeze
          for f in app/src/main/java/ro/alintudor/oracle/OracleMysticStartView.kt app/src/main/java/ro/alintudor/oracle/nativeui/OracleNewsModule.kt app/src/main/java/ro/alintudor/oracle/nativeui/OraclePortfolioModule.kt app/src/main/java/ro/alintudor/oracle/nativeui/OracleAlertsModule.kt app/src/main/java/ro/alintudor/oracle/nativeui/OracleAnalysisModules.kt app/src/main/java/ro/alintudor/oracle/core/OracleKnowledgeSync.kt; do git hash-object "$f"; done > /tmp/oracle-freeze/before
      - name: Patch Growth UI
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/ro/alintudor/oracle/nativeui/OracleGrowthModule.kt')
          s=p.read_text(encoding='utf-8')
          s=s.replace('header.addView(text("ULTIMELE RECOMANDĂRI", 15f, Typeface.DEFAULT_BOLD, cyan, 0, 0), LinearLayout.LayoutParams(0, -2, 1f))', 'header.addView(text("ULTIMELE RECOMANDĂRI", 15f, Typeface.DEFAULT_BOLD, cyan, 0, 0), LinearLayout.LayoutParams(-2, -2))')
          s=s.replace('historyRow(null)', 'historyRow(null, "31.08.2026 16:00")')
          s=s.replace('private fun historyRow(item: OracleGrowthRecommendation?): LinearLayout {','private fun historyRow(item: OracleGrowthRecommendation?, placeholderDate: String? = null): LinearLayout {')
          s=s.replace('text("—", 10f, Typeface.DEFAULT, muted, 0, 2)', 'text(placeholderDate ?: "—", 10f, Typeface.DEFAULT, muted, 0, 2)')
          s=s.replace('BUILD B535 • GROWTH','BUILD B537 • GROWTH')
          old='''        val expandedRows = all.drop(6)
        expandedRows.forEach {
            val row = historyRow(it)
            row.visibility = View.GONE
            rows.addView(row, LinearLayout.LayoutParams(-1, -2).apply { setMargins(0, host.dp(6), 0, 0) })
        }
        var expanded = false
        arrow.setOnClickListener {
            expanded = !expanded
            arrow.text = if (expanded) "⌃" else "⌄"
            expandedRows.forEach { it.visibility = if (expanded) View.VISIBLE else View.GONE }
        }'''
          new='''        val expandedViews = all.drop(6).map { item ->
            val row = historyRow(item)
            row.visibility = View.GONE
            rows.addView(row, LinearLayout.LayoutParams(-1, -2).apply { setMargins(0, host.dp(6), 0, 0) })
            row
        }
        var expanded = false
        arrow.setOnClickListener {
            expanded = !expanded
            arrow.text = if (expanded) "⌃" else "⌄"
            rows.visibility = if (expanded) View.VISIBLE else View.GONE
            expandedViews.forEach { view -> view.visibility = if (expanded) View.VISIBLE else View.GONE }
        }'''
          if old not in s:
              raise SystemExit('history toggle block not found')
          s=s.replace(old,new)
          # Put arrow immediately beside the title, with PDF on the right.
          old_header='''        header.addView(text("ULTIMELE RECOMANDĂRI", 15f, Typeface.DEFAULT_BOLD, cyan, 0, 0), LinearLayout.LayoutParams(0, -2, 1f))

        val download = TextView'''
          new_header='''        header.addView(text("ULTIMELE RECOMANDĂRI", 15f, Typeface.DEFAULT_BOLD, cyan, 0, 0), LinearLayout.LayoutParams(-2, -2))

        val arrow = TextView(host.root.context).apply {
            text = "⌄"
            textSize = 23f
            typeface = Typeface.DEFAULT_BOLD
            gravity = Gravity.CENTER
            setTextColor(cyan)
            setPadding(host.dp(4), 0, host.dp(8), host.dp(2))
            isClickable = true
            isFocusable = true
            contentDescription = "Extinde sau restrânge ultimele recomandări"
        }
        header.addView(arrow, LinearLayout.LayoutParams(host.dp(38), host.dp(40)))

        val download = TextView'''
          if old_header not in s:
              raise SystemExit('history header block not found')
          s=s.replace(old_header,new_header)
          old_arrow='''        val arrow = TextView(host.root.context).apply {
            text = "⌄"
            textSize = 23f
            typeface = Typeface.DEFAULT_BOLD
            gravity = Gravity.CENTER
            setTextColor(cyan)
            setPadding(0, 0, 0, host.dp(2))
            isClickable = true
            isFocusable = true
        }
        header.addView(arrow, LinearLayout.LayoutParams(host.dp(38), host.dp(40)))
        card.addView(header)'''
          # The arrow was moved above the PDF button; remove the old duplicate if still present.
          s=s.replace(old_arrow, '        card.addView(header)')
          p.write_text(s,encoding='utf-8')
          PY
          git diff --check
          grep -q '31.08.2026 16:00' app/src/main/java/ro/alintudor/oracle/nativeui/OracleGrowthModule.kt
          grep -q 'val expandedViews = all.drop(6).map' app/src/main/java/ro/alintudor/oracle/nativeui/OracleGrowthModule.kt
          grep -q 'rows.visibility = if (expanded) View.VISIBLE else View.GONE' app/src/main/java/ro/alintudor/oracle/nativeui/OracleGrowthModule.kt
          grep -q 'BUILD B537 • GROWTH' app/src/main/java/ro/alintudor/oracle/nativeui/OracleGrowthModule.kt
      - name: Set B537 identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('app/build.gradle'); s=p.read_text(encoding='utf-8')
          s=re.sub(r'versionCode\s+\d+', 'versionCode 32', s, count=1)
          s=re.sub(r'versionName\s+[\'\"][^\'\"]*[\'\"]', "versionName 'V6g-GROWTH-B537'", s, count=1)
          p.write_text(s,encoding='utf-8')
          PY
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
        with: {accept-android-sdk-licenses: true}
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.10'}
      - name: Build APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Verify APK and frozen modules
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          for f in app/src/main/java/ro/alintudor/oracle/OracleMysticStartView.kt app/src/main/java/ro/alintudor/oracle/nativeui/OracleNewsModule.kt app/src/main/java/ro/alintudor/oracle/nativeui/OraclePortfolioModule.kt app/src/main/java/ro/alintudor/oracle/nativeui/OracleAlertsModule.kt app/src/main/java/ro/alintudor/oracle/nativeui/OracleAnalysisModules.kt app/src/main/java/ro/alintudor/oracle/core/OracleKnowledgeSync.kt; do git hash-object "$f"; done > /tmp/oracle-freeze/after
          cmp /tmp/oracle-freeze/before /tmp/oracle-freeze/after
      - uses: actions/upload-artifact@v4
        with:
          name: Oracle-APK-B537-GROWTH-UI-FINAL
          path: app/build/outputs/apk/release/*.apk
          retention-days: 7
