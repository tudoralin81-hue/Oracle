name: Oracle B537 Growth UI Final
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Growth UI
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('app/src/main/java/ro/alintudor/oracle/nativeui/OracleGrowthModule.kt')
          s=p.read_text(encoding='utf-8')
          # Title, arrow, and PDF share one header: arrow immediately beside title, PDF at right.
          s=s.replace('header.addView(text("ULTIMELE RECOMANDĂRI", 15f, Typeface.DEFAULT_BOLD, cyan, 0, 0), LinearLayout.LayoutParams(0, -2, 1f))', 'header.addView(text("ULTIMELE RECOMANDĂRI", 15f, Typeface.DEFAULT_BOLD, cyan, 0, 0), LinearLayout.LayoutParams(-2, -2))')
          # Replace the broken recommendation-object visibility handling with View references.
          old=r'''        val expandedRows = all.drop(6)\n        expandedRows.forEach {\n            val row = historyRow(it)\n            row.visibility = View.GONE\n            rows.addView(row, LinearLayout.LayoutParams(-1, -2).apply { setMargins(0, host.dp(6), 0, 0) })\n        }\n        var expanded = false\n        arrow.setOnClickListener {\n            expanded = !expanded\n            arrow.text = if (expanded) "⌃" else "⌄"\n            expandedRows.forEach { it.visibility = if (expanded) View.VISIBLE else View.GONE }\n        }'''
          new='''        val expandedViews = all.drop(6).map { item ->\n            historyRow(item).also { row ->\n                row.visibility = View.GONE\n                rows.addView(row, LinearLayout.LayoutParams(-1, -2).apply { setMargins(0, host.dp(6), 0, 0) })\n            }\n        }\n        var expanded = false\n        arrow.contentDescription = "Deschide ultimele recomandări"\n        arrow.setOnClickListener {\n            expanded = !expanded\n            arrow.text = if (expanded) "⌃" else "⌄"\n            rows.visibility = View.VISIBLE\n            if (!expanded) {\n                expandedViews.forEach { it.visibility = View.GONE }\n            } else {\n                expandedViews.forEach { it.visibility = View.VISIBLE }\n            }\n            arrow.contentDescription = if (expanded) "Închide ultimele recomandări" else "Deschide ultimele recomandări"\n        }'''
          s=s.replace(old,new)
          # Empty visible history slots show the requested historical date.
          s=s.replace('historyRow(null)', 'historyRow(null, "31.08.2026 16:00")')
          s=s.replace('private fun historyRow(item: OracleGrowthRecommendation?): LinearLayout {','private fun historyRow(item: OracleGrowthRecommendation?, placeholderDate: String? = null): LinearLayout {')
          s=s.replace('text("—", 10f, Typeface.DEFAULT, muted, 0, 2)', 'text(placeholderDate ?: "—", 10f, Typeface.DEFAULT, muted, 0, 2)')
          s=s.replace('BUILD B535 • GROWTH','BUILD B537 • GROWTH')
          p.write_text(s,encoding='utf-8')
          PY
          git diff --check
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
        with: {accept-android-sdk-licenses: true}
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.10'}
      - name: Build APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: Oracle-APK-B537-GROWTH-UI-FINAL
          path: app/build/outputs/apk/release/*.apk
          retention-days: 7
