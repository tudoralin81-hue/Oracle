name: Build Oracle APK
on:
  push:
    branches: [ main, 'ui/**', 'feature/**' ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ORACLE_KEYSTORE_BASE64: ${{ secrets.ORACLE_KEYSTORE_BASE64 }}
      ORACLE_KEYSTORE_PASSWORD: ${{ secrets.ORACLE_KEYSTORE_PASSWORD }}
      ORACLE_KEY_ALIAS: ${{ secrets.ORACLE_KEY_ALIAS }}
      ORACLE_KEY_PASSWORD: ${{ secrets.ORACLE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Apply Analysis sector resolution fix
        shell: bash
        run: python3 scripts/fix_analysis_sector.py
      - name: Apply Analysis expanded parameters and fundamentals
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/fix_analysis_expanded.py
          python3 scripts/fix_analysis_status_colors.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/ro/alintudor/oracle/nativeui/OracleAnalysisModules.kt app/src/main/java/ro/alintudor/oracle/core/OracleAnalysisEngine.kt app/src/main/java/ro/alintudor/oracle/core/OracleRealData.kt
          if ! git diff --cached --quiet; then
            git commit -m 'Add three-color Analysis value status'
            git push
          fi
      - name: Verify permanent Growth source fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          analysis = Path('app/src/main/java/ro/alintudor/oracle/core/OracleAnalysisEngine.kt').read_text(encoding='utf-8')
          bootstrap = Path('app/src/main/java/ro/alintudor/oracle/core/OracleBootstrap.kt').read_text(encoding='utf-8')
          growth = Path('app/src/main/java/ro/alintudor/oracle/core/OracleGrowthEngine.kt').read_text(encoding='utf-8')
          live = Path('app/src/main/java/ro/alintudor/oracle/core/OracleGrowthLiveData.kt').read_text(encoding='utf-8')
          sector = Path('app/src/main/java/ro/alintudor/oracle/core/OracleSectorAllocation.kt').read_text(encoding='utf-8')
          local = Path('app/src/main/java/ro/alintudor/oracle/core/OracleLocalProcessor.kt').read_text(encoding='utf-8')
          if 'riskScore' not in analysis or 'val risk=when' not in analysis or 'riskFactor' not in analysis:
              raise SystemExit('Permanent dynamic risk/allocation calculation is missing from OracleAnalysisEngine')
          if 'private const val VERSION = 19' not in bootstrap:
              raise SystemExit('Growth snapshot migration VERSION 19 is missing')
          if 'fallbackRiskAllocation' not in bootstrap:
              raise SystemExit('Offline Risk/Allocation fallback is missing')
          if 'OracleAnalysisEngine.analyze(ticker)' not in bootstrap:
              raise SystemExit('Growth snapshot is not sourced from the analysis engine when live data is available')
          if 'risk=pick.risk' not in growth or 'correctedAllocation' not in growth or 'OracleSectorAllocation.apply' not in growth:
              raise SystemExit('Growth engine is not using same-pass risk plus sector-corrected allocation')
          if 'const val STEP = 0.025' not in sector or 'factorFor' not in sector or 'apply' not in sector:
              raise SystemExit('Sector allocation correction in 0.025 steps is missing')
          if 'snapshotIsCurrent = current.growth.isNotEmpty()' not in local or 'current.growth.all { it.referenceTimestamp == growthAnchor }' not in local:
              raise SystemExit('Growth immutable freshness gate is missing')
          if 'return items' not in live or 'item.copy(sector' in live:
              raise SystemExit('Growth UI adapter must be read-only and must not mutate recommendation state')
          print('Permanent Growth risk/allocation + sector score source + immutable snapshot fix verified')
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android 16 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Prepare production signing key when configured
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$ORACLE_KEYSTORE_BASE64" ] && [ -n "$ORACLE_KEYSTORE_PASSWORD" ] && [ -n "$ORACLE_KEY_ALIAS" ] && [ -n "$ORACLE_KEY_PASSWORD" ]; then
            echo "$ORACLE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/oracle-release.jks"
            {
              echo "ORACLE_KEYSTORE_FILE=$RUNNER_TEMP/oracle-release.jks"
              echo "ORACLE_KEYSTORE_PASSWORD=$ORACLE_KEYSTORE_PASSWORD"
              echo "ORACLE_KEY_ALIAS=$ORACLE_KEY_ALIAS"
              echo "ORACLE_KEY_PASSWORD=$ORACLE_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
          else
            echo "WARNING: production signing secrets are not configured; this build will use the non-production signing fallback."
          fi
      - name: Verify Watchlist ticker navigation fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/ro/alintudor/oracle/OracleMysticActivity.kt")
          s = p.read_text(encoding="utf-8")
          required = [
              'onWatchlistTickerClick = { ticker -> openWatchlistTicker(ticker) }',
              'private fun openWatchlistTicker(ticker: String)',
              'OracleSimpleModule.setTickerDraft(normalized)',
              'openModule("analysis")',
              'if (key == "analysis") return'
          ]
          missing = [x for x in required if x not in s]
          if missing:
              raise SystemExit("Watchlist navigation fix is missing: " + ", ".join(missing))
          print("Watchlist ticker navigation fix verified in source")
          PY
      - name: Build signed release APK
        run: gradle :app:assembleRelease --stacktrace
      - name: Verify release APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK"
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Oracle-APK-installable
          path: app/build/outputs/apk/release/*.apk
