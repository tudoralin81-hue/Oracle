name: Build Oracle APK
on:
  push:
    branches: [ main, 'ui/**', 'feature/**' ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ORACLE_KEYSTORE_BASE64: ${{ secrets.ORACLE_KEYSTORE_BASE64 }}
      ORACLE_KEYSTORE_PASSWORD: ${{ secrets.ORACLE_KEYSTORE_PASSWORD }}
      ORACLE_KEY_ALIAS: ${{ secrets.ORACLE_KEY_ALIAS }}
      ORACLE_KEY_PASSWORD: ${{ secrets.ORACLE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android 16 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Prepare production signing key when configured
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$ORACLE_KEYSTORE_BASE64" ] && [ -n "$ORACLE_KEYSTORE_PASSWORD" ] && [ -n "$ORACLE_KEY_ALIAS" ] && [ -n "$ORACLE_KEY_PASSWORD" ]; then
            echo "$ORACLE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/oracle-release.jks"
            {
              echo "ORACLE_KEYSTORE_FILE=$RUNNER_TEMP/oracle-release.jks"
              echo "ORACLE_KEYSTORE_PASSWORD=$ORACLE_KEYSTORE_PASSWORD"
              echo "ORACLE_KEY_ALIAS=$ORACLE_KEY_ALIAS"
              echo "ORACLE_KEY_PASSWORD=$ORACLE_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
          else
            echo "WARNING: production signing secrets are not configured; this build will use the non-production debug certificate fallback."
          fi
      - name: Apply Knowledge external link fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/ro/alintudor/oracle/nativeui/OracleAnalysisModules.kt")
          s = p.read_text(encoding="utf-8")
          if "import android.content.Intent" not in s:
              s = s.replace("package ro.alintudor.oracle.nativeui\n\n", "package ro.alintudor.oracle.nativeui\n\nimport android.content.Intent\nimport android.net.Uri\n")
          old = '''    private fun renderKnowledge(items: List<OracleKnowledgeItem>) {
          host.addCard("KNOWLEDGE", "Biblioteca Oracle — conținut local")
          if (items.isEmpty()) return
          items.sortedByDescending { it.publishedAt }.forEach { addItem(it.title, "${it.category}\\n${it.content}") }
      }'''
          new = '''    private fun renderKnowledge(items: List<OracleKnowledgeItem>) {
          host.addCard("KNOWLEDGE", "Biblioteca Oracle — conținut local")

          val linkCard = LinearLayout(host.root.context).apply {
              orientation = LinearLayout.HORIZONTAL
              gravity = Gravity.CENTER_VERTICAL
              setPadding(host.dp(16), host.dp(13), host.dp(16), host.dp(13))
              background = GradientDrawable().apply {
                  setColor(Color.rgb(7, 12, 23))
                  cornerRadius = host.dp(15).toFloat()
                  setStroke(host.dp(1), host.accent)
              }
              isClickable = true
              isFocusable = true
              setOnClickListener {
                  runCatching {
                      host.root.context.startActivity(
                          Intent(Intent.ACTION_VIEW, Uri.parse("https://alintudor.ro/knowledge/"))
                      )
                  }
              }
          }
          linkCard.addView(TextView(host.root.context).apply {
              text = "KNOWLEDGE ONLINE"
              textSize = 18f
              typeface = Typeface.DEFAULT_BOLD
              setTextColor(Color.WHITE)
          }, LinearLayout.LayoutParams(0, -2, 1f))
          linkCard.addView(TextView(host.root.context).apply {
              text = "alintudor.ro/knowledge  ›"
              textSize = 14f
              typeface = Typeface.DEFAULT_BOLD
              setTextColor(host.accent)
              gravity = Gravity.END
          })
          host.content.addView(linkCard, LinearLayout.LayoutParams(-1, -2).apply {
              setMargins(0, 0, 0, host.dp(12))
          })

          if (items.isEmpty()) return
          items.sortedByDescending { it.publishedAt }.forEach { addItem(it.title, "${it.category}\\n${it.content}") }
      }'''
          if old not in s:
              raise SystemExit("Expected OracleSimpleModule.renderKnowledge() was not found; refusing to build a different source.")
          s = s.replace(old, new, 1)
          p.write_text(s, encoding="utf-8")
          print("Knowledge link fix applied to OracleAnalysisModules.kt")
          PY
      - name: Apply Watchlist ticker navigation fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/ro/alintudor/oracle/OracleMysticActivity.kt")
          s = p.read_text(encoding="utf-8")
          old = '''            "growth", "analysis", "watchlist", "knowledge" -> OracleSimpleModule(host, titles[key] ?: key.uppercase()).render(actions = data.actions, knowledge = data.knowledge, positions = data.positions, history = data.history)'''
          new = '''            "growth", "analysis", "watchlist", "knowledge" -> OracleSimpleModule(
                host,
                titles[key] ?: key.uppercase(),
                onWatchlistTickerClick = { ticker -> openWatchlistTicker(ticker) }
            ).render(actions = data.actions, knowledge = data.knowledge, positions = data.positions, history = data.history)'''
          if old not in s:
              raise SystemExit("Expected Watchlist callback target was not found; refusing to build a different source.")
          s = s.replace(old, new, 1)
          anchor = '''    private fun handleBack() {'''
          fn = '''    private fun openWatchlistTicker(ticker: String) {
        val normalized = ticker.trim().uppercase(java.util.Locale.US)
        if (normalized.isBlank()) return
        OracleSimpleModule.setTickerDraft(normalized)
        openModule("analysis")
    }

'''
          if fn.strip() not in s:
              if anchor not in s:
                  raise SystemExit("Watchlist function insertion anchor was not found; refusing to build a different source.")
              s = s.replace(anchor, fn + anchor, 1)
          marker = '''        runCatching { renderModule(key) }.onFailure { showModuleError(key, it) }
        Thread {'''
          guarded = '''        runCatching { renderModule(key) }.onFailure { showModuleError(key, it) }
        if (key == "analysis") return
        Thread {'''
          if marker not in s:
              raise SystemExit("Analysis background-refresh guard target was not found; refusing to build a different source.")
          s = s.replace(marker, guarded, 1)
          p.write_text(s, encoding="utf-8")
          print("Watchlist -> Analysis fix applied to OracleMysticActivity.kt")
          PY
      - name: Build signed release APK
        run: gradle :app:assembleRelease --stacktrace
      - name: Verify release APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK"
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Oracle-APK-installable
          path: app/build/outputs/apk/release/*.apk
