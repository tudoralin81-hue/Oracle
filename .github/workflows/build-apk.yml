name: Build Oracle APK
on:
  push:
    branches: [ main, 'ui/**', 'feature/**' ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ORACLE_KEYSTORE_BASE64: ${{ secrets.ORACLE_KEYSTORE_BASE64 }}
      ORACLE_KEYSTORE_PASSWORD: ${{ secrets.ORACLE_KEYSTORE_PASSWORD }}
      ORACLE_KEY_ALIAS: ${{ secrets.ORACLE_KEY_ALIAS }}
      ORACLE_KEY_PASSWORD: ${{ secrets.ORACLE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Apply Growth risk/allocation repair
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/fix_growth_risk_allocation.py
          python3 - <<'PY'
          from pathlib import Path
          analysis = Path('app/src/main/java/ro/alintudor/oracle/core/OracleAnalysisEngine.kt').read_text(encoding='utf-8')
          growth = Path('app/src/main/java/ro/alintudor/oracle/core/OracleGrowthEngine.kt').read_text(encoding='utf-8')
          bootstrap = Path('app/src/main/java/ro/alintudor/oracle/core/OracleBootstrap.kt').read_text(encoding='utf-8')
          checks = [
              ('analysis helper', 'fun calculateRiskAllocation(' in analysis),
              ('analysis uses helper', 'calculateRiskAllocation(rsi,vr,m5,atrPct,trend)' in analysis),
              ('growth uses helper', 'OracleAnalysisEngine.calculateRiskAllocation(rsi,vr,m5,atrPct,trend)' in growth),
              ('bootstrap version 12', 'private const val VERSION = 12' in bootstrap),
              ('bootstrap allocation calculated', 'val snpsAllocation = calculatedAllocation("SNPS", 3.0)' in bootstrap),
              ('bootstrap VEEV allocation calculated', 'val veevAllocation = calculatedAllocation("VEEV", 3.0)' in bootstrap),
              ('bootstrap CRM allocation calculated', 'val crmAllocation = calculatedAllocation("CRM", 3.0)' in bootstrap),
              ('bootstrap SNPS risk calculated', 'val snpsRisk = OracleAnalysisEngine.analyze("SNPS")?.risk' in bootstrap),
              ('bootstrap VEEV risk calculated', 'val veevRisk = OracleAnalysisEngine.analyze("VEEV")?.risk' in bootstrap),
              ('bootstrap CRM risk calculated', 'val crmRisk = OracleAnalysisEngine.analyze("CRM")?.risk' in bootstrap),
              ('bootstrap SNPS risk wired', 'score=86, signal="STRONG BUY", risk=snpsRisk' in bootstrap),
              ('bootstrap VEEV risk wired', 'score=85, signal="STRONG BUY", risk=veevRisk' in bootstrap),
              ('bootstrap CRM risk wired', 'score=81, signal="BUY", risk=crmRisk' in bootstrap),
          ]
          missing = [name for name, ok in checks if not ok]
          if missing:
              raise SystemExit('Growth repair verification failed: ' + ', '.join(missing))
          print('Growth risk/allocation repair verified')
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android 16 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Prepare production signing key when configured
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$ORACLE_KEYSTORE_BASE64" ] && [ -n "$ORACLE_KEYSTORE_PASSWORD" ] && [ -n "$ORACLE_KEY_ALIAS" ] && [ -n "$ORACLE_KEY_PASSWORD" ]; then
            echo "$ORACLE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/oracle-release.jks"
            {
              echo "ORACLE_KEYSTORE_FILE=$RUNNER_TEMP/oracle-release.jks"
              echo "ORACLE_KEYSTORE_PASSWORD=$ORACLE_KEYSTORE_PASSWORD"
              echo "ORACLE_KEY_ALIAS=$ORACLE_KEY_ALIAS"
              echo "ORACLE_KEY_PASSWORD=$ORACLE_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
          else
            echo "WARNING: production signing secrets are not configured; this build will use the non-production debug certificate fallback."
          fi
      - name: Verify Watchlist ticker navigation fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/ro/alintudor/oracle/OracleMysticActivity.kt")
          s = p.read_text(encoding="utf-8")
          required = [
              'onWatchlistTickerClick = { ticker -> openWatchlistTicker(ticker) }',
              'private fun openWatchlistTicker(ticker: String)',
              'OracleSimpleModule.setTickerDraft(normalized)',
              'openModule("analysis")',
              'if (key == "analysis") return'
          ]
          missing = [x for x in required if x not in s]
          if missing:
              raise SystemExit("Watchlist navigation fix is missing: " + ", ".join(missing))
          print("Watchlist ticker navigation fix verified in source")
          PY
      - name: Build signed release APK
        run: gradle :app:assembleRelease --stacktrace
      - name: Verify release APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK"
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Oracle-APK-installable
          path: app/build/outputs/apk/release/*.apk
