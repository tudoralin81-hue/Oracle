name: Build Oracle APK
on:
  push:
    branches: [ main, 'ui/**' ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ORACLE_KEYSTORE_BASE64: ${{ secrets.ORACLE_KEYSTORE_BASE64 }}
      ORACLE_KEYSTORE_PASSWORD: ${{ secrets.ORACLE_KEYSTORE_PASSWORD }}
      ORACLE_KEY_ALIAS: ${{ secrets.ORACLE_KEY_ALIAS }}
      ORACLE_KEY_PASSWORD: ${{ secrets.ORACLE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android 16 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Prepare persistent release signing key
        run: |
          if [ -n "$ORACLE_KEYSTORE_BASE64" ]; then
            echo "$ORACLE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/oracle-release.jks"
            {
              echo "ORACLE_KEYSTORE_FILE=$RUNNER_TEMP/oracle-release.jks"
              echo "ORACLE_KEYSTORE_PASSWORD=$ORACLE_KEYSTORE_PASSWORD"
              echo "ORACLE_KEY_ALIAS=$ORACLE_KEY_ALIAS"
              echo "ORACLE_KEY_PASSWORD=$ORACLE_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Persistent Oracle release signing key prepared."
          else
            echo "No production keystore configured; release build will use the existing fallback signing configuration."
          fi
      - name: Build signed release APK
        run: gradle :app:assembleRelease --stacktrace
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Oracle-APK-installable
          path: app/build/outputs/apk/release/*.apk
