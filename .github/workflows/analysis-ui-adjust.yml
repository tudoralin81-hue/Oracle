name: analysis-ui-adjust
on:
  push:
    branches: [feature/news-module-v1]
permissions:
  contents: write
jobs:
  adjust:
    if: contains(github.event.head_commit.message, 'analysis-ui-adjust') == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Analysis chart UI adjustments
        shell: python
        run: |
          from pathlib import Path
          import re

          chart = Path('app/src/main/java/ro/alintudor/oracle/nativeui/OracleAnalysisChartView.kt')
          s = chart.read_text()
          s = s.replace('when (value) { "30M", "1H", "1D" -> value; else -> "1D" }',
                        'when (value) { "30M", "1H", "1D", "5D", "1M", "3M", "1Y" -> value; else -> "1D" }')
          s = s.replace('label(c, "$ticker  •  $mode", 12f, 20f, Color.WHITE, 15f)',
                        'label(c, "$ticker  •  $mode", 12f, 22f, Color.WHITE, 18f)')
          s = s.replace('label(c, "${money(d.last().close)}", width - 88f, 20f, text, 11f)',
                        'label(c, "${money(d.last().close)}", width - 108f, 22f, text, 14f)')
          s = s.replace('label(c, info, 12f, 40f, if (p.close >= p.open) green else red, 10f)',
                        'label(c, info, 12f, 45f, if (p.close >= p.open) green else red, 13f)')
          s = s.replace('label(c, "Atinge o lumânare pentru OHLC + volum", 12f, 40f, text, 10f)',
                        'label(c, "Atinge o lumânare pentru OHLC + volum", 12f, 45f, text, 13f)')
          s = s.replace('label(c, "BB(20,2)", 12f, top + 14f, blue, 10f)',
                        'label(c, "BB(20,2)", 12f, top + 16f, blue, 12f)')
          s = s.replace('label(c, "EMA10 / MA10", 82f, top + 14f, gold, 10f)',
                        'label(c, "EMA10 / MA10", 100f, top + 16f, gold, 12f)')
          s = s.replace('label(c, "Ichimoku", 178f, top + 14f, Color.rgb(80, 210, 150), 10f)',
                        'label(c, "Ichimoku", 205f, top + 16f, Color.rgb(80, 210, 150), 12f)')
          s = s.replace('label(c, money(maxP), width - 82f, top + 28f, text, 10f)',
                        'label(c, money(maxP), width - 92f, top + 32f, text, 12f)')
          s = s.replace('label(c, money(minP), width - 82f, bottom - 6f, text, 10f)',
                        'label(c, money(minP), width - 92f, bottom - 8f, text, 12f)')
          chart.write_text(s)

          modules = Path('app/src/main/java/ro/alintudor/oracle/nativeui/OracleAnalysisModules.kt')
          s = modules.read_text()
          s = s.replace('listOf("1D","1H","30M")', 'listOf("1D","1H","30M","5D","1M","3M","1Y")')
          marker = 'box.addView(indicators)\n        host.content.addView(box'
          legend = '''box.addView(indicators)\n        val legend=LinearLayout(host.root.context).apply{orientation=LinearLayout.VERTICAL;setPadding(host.dp(10),host.dp(9),host.dp(10),host.dp(5));background=GradientDrawable().apply{setColor(Color.rgb(7,12,23));cornerRadius=host.dp(10).toFloat();setStroke(host.dp(1),Color.rgb(34,55,82))}}\n        listOf(\n            "— Linie verde/roșie: direcția trendului calculată pe ultimele lumânări.",\n            "— Liniile paralele: zona de variație a trendului (volatilitate).",\n            "— Linie albastră: suport tehnic recent.",\n            "— Linie aurie: rezistență tehnică recentă.",\n            "— BB / MA-EMA / Ichimoku: indicatorii activați din butoanele de mai sus."\n        ).forEach{t->legend.addView(TextView(host.root.context).apply{text=t;textSize=12f;setTextColor(Color.rgb(195,205,220));setPadding(0,host.dp(2),0,host.dp(2))})}\n        box.addView(legend)\n        host.content.addView(box'''
          if marker in s:
              s = s.replace(marker, legend, 1)
          modules.write_text(s)
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/ro/alintudor/oracle/nativeui/OracleAnalysisChartView.kt app/src/main/java/ro/alintudor/oracle/nativeui/OracleAnalysisModules.kt
          git diff --cached --quiet || git commit -m 'feat: enlarge Analysis chart labels and explain trend lines [analysis-ui-adjust]'
          git push
      - name: Remove temporary workflow
        if: success()
        run: |
          git rm .github/workflows/analysis-ui-adjust.yml
          git commit -m 'chore: remove temporary analysis UI adjust workflow [analysis-ui-adjust]'
          git push
