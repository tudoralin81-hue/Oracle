name: Oracle B515 Parameter Order
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ORACLE_KEYSTORE_BASE64: ${{ secrets.ORACLE_KEYSTORE_BASE64 }}
      ORACLE_KEYSTORE_PASSWORD: ${{ secrets.ORACLE_KEYSTORE_PASSWORD }}
      ORACLE_KEY_ALIAS: ${{ secrets.ORACLE_KEY_ALIAS }}
      ORACLE_KEY_PASSWORD: ${{ secrets.ORACLE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Arrange Analysis cards in market order
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/src/main/java/ro/alintudor/oracle/nativeui/OracleAnalysisModules.kt')
          s = p.read_text(encoding='utf-8')
          old = '''        // Oracle factors: rawValues[0] is internal News; visible factors start at rawValues[1].
          OracleAnalysisEngine.factorNames.forEachIndexed { i, name ->
              if (!name.equals("Fundamentals", ignoreCase = true)) {
                  relevantParameters.add(name to (r.rawValues.getOrNull(i + 1) ?: "Valoare indisponibilă"))
              }
          }
'''
          new = '''        // Oracle factors in a deliberate stock-market reading order:
        // trend -> momentum -> volume -> levels -> breakout -> oscillators/volatility -> context.
        val factorValues = OracleAnalysisEngine.factorNames.mapIndexed { i, name ->
            name to (r.rawValues.getOrNull(i + 1) ?: "Valoare indisponibilă")
        }.toMap()
        val factorOrder = listOf(
            "Trend",
            "Momentum",
            "Volume",
            "Support / Resistance",
            "Breakout",
            "RSI (14)",
            "MACD (12/26)",
            "ADX",
            "Bollinger",
            "Ichimoku",
            "ATR",
            "Risk / Reward",
            "Market / Sector"
        )
        factorOrder.forEach { name ->
            factorValues.entries.firstOrNull { it.key.equals(name, ignoreCase = true) }?.let {
                relevantParameters.add(it.key to it.value)
            }
        }
        // Preserve any future Oracle factor automatically, but never re-add the aggregate Fundamentals card.
        OracleAnalysisEngine.factorNames.forEach { name ->
            if (!name.equals("Fundamentals", ignoreCase = true) &&
                relevantParameters.none { it.first.equals(name, ignoreCase = true) }) {
                factorValues[name]?.let { relevantParameters.add(name to it) }
            }
        }
'''
          if old not in s:
              raise SystemExit('Expected B514 factor block not found')
          s = s.replace(old, new, 1)
          s = s.replace('ORACLE • V6g-FINAL-B514', 'ORACLE • V6g-FINAL-B515')
          p.write_text(s, encoding='utf-8')
          gpath = Path('app/build.gradle')
          g = gpath.read_text(encoding='utf-8')
          g = g.replace('versionCode 25', 'versionCode 26')
          g = g.replace("versionName 'V6g-FINAL-B514'", "versionName 'V6g-FINAL-B515'")
          gpath.write_text(g, encoding='utf-8')
          assert 'val factorOrder = listOf(' in s
          assert '"Trend"' in s and '"Momentum"' in s and '"Support / Resistance"' in s
          assert 'ORACLE • V6g-FINAL-B515' in s
      - name: Verify source
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'val factorOrder = listOf(' app/src/main/java/ro/alintudor/oracle/nativeui/OracleAnalysisModules.kt
          grep -q '"Trend"' app/src/main/java/ro/alintudor/oracle/nativeui/OracleAnalysisModules.kt
          grep -q '"Momentum"' app/src/main/java/ro/alintudor/oracle/nativeui/OracleAnalysisModules.kt
          grep -q '"Support / Resistance"' app/src/main/java/ro/alintudor/oracle/nativeui/OracleAnalysisModules.kt
          grep -q "versionName 'V6g-FINAL-B515'" app/build.gradle
      - name: Commit B515 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/ro/alintudor/oracle/nativeui/OracleAnalysisModules.kt app/build.gradle
          git commit -m "B515: arrange Analysis parameter cards in market order [skip ci]"
          git push origin HEAD:main
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Build release APK
        run: gradle :app:assembleRelease --stacktrace
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK"
      - name: Upload B515 APK
        uses: actions/upload-artifact@v4
        with:
          name: Oracle-APK-B515-FINAL-installable
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
