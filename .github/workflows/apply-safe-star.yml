name: Apply safe Analysis star
on:
  push:
    branches: [ 'feature/watchlist-star-safe' ]
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch MainActivity without touching Analysis source
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/src/main/java/ro/alintudor/oracle/MainActivity.kt')
          s = p.read_text()
          marker = '        host.restoreScrollY(preservedScrollY)'
          insertion = '        if (key == "analysis") OracleAnalysisWatchlistStarOverlay.install(host)\n' + marker
          if 'OracleAnalysisWatchlistStarOverlay.install(host)' not in s:
              if marker not in s:
                  raise SystemExit('Safe insertion marker not found in MainActivity')
              s = s.replace(marker, insertion, 1)
              p.write_text(s)
          else:
              print('Overlay already installed')
      - name: Commit and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-safe-star.yml
          git add app/src/main/java/ro/alintudor/oracle/MainActivity.kt
          git commit -m 'feat: connect Analysis favorite star safely [skip ci]'
          git push
