name: B509 Analysis UI
on:
  push:
    branches: [ main ]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ORACLE_KEYSTORE_BASE64: ${{ secrets.ORACLE_KEYSTORE_BASE64 }}
      ORACLE_KEYSTORE_PASSWORD: ${{ secrets.ORACLE_KEYSTORE_PASSWORD }}
      ORACLE_KEY_ALIAS: ${{ secrets.ORACLE_KEY_ALIAS }}
      ORACLE_KEY_PASSWORD: ${{ secrets.ORACLE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-android@v3
      - name: Install Android 16 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Apply B509 Analysis matrix/autoscale patch
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/src/main/java/ro/alintudor/oracle/nativeui/OracleAnalysisModules.kt')
          s = p.read_text()

          old = '''            card.addView(TextView(host.root.context).apply {
                text = item.second
                textSize = 12.5f
                typeface = Typeface.DEFAULT_BOLD
                setTextColor(metricValueColor(item.first, item.second))
                setPadding(0, host.dp(4), 0, 0)
                maxLines = 4
            })
            row?.addView(card, LinearLayout.LayoutParams(0, host.dp(104), 1f).apply {'''
          new = '''            card.addView(TextView(host.root.context).apply {
                text = item.second
                textSize = 12.5f
                typeface = Typeface.DEFAULT_BOLD
                setTextColor(metricValueColor(item.first, item.second))
                setPadding(0, host.dp(3), 0, 0)
                includeFontPadding = true
            })
            row?.addView(card, LinearLayout.LayoutParams(0, -2, 1f).apply {'''
          if old not in s:
              raise SystemExit('B509 metric card block not found')
          s = s.replace(old, new, 1)

          old_end = '''            row?.addView(card, LinearLayout.LayoutParams(0, host.dp(104), 1f).apply {
                if (index % 2 == 1) setMargins(host.dp(4), 0, 0, 0)
                else setMargins(0, 0, host.dp(4), 0)
            })
        }
    }

    private fun metricValueColor'''
          new_end = '''            row?.addView(card, LinearLayout.LayoutParams(0, -2, 1f).apply {
                if (index % 2 == 1) setMargins(host.dp(4), 0, 0, 0)
                else setMargins(0, 0, host.dp(4), 0)
            })
        }
        // B509: every row remains a true two-column matrix, while height follows
        // the tallest content in that row. No fixed-height clipping.
        for (i in 0 until container.childCount) {
            (container.getChildAt(i) as? LinearLayout)?.post {
                val rowView = container.getChildAt(i) as? LinearLayout ?: return@post
                var maxHeight = 0
                for (j in 0 until rowView.childCount) {
                    maxHeight = maxOf(maxHeight, rowView.getChildAt(j).measuredHeight)
                }
                if (maxHeight > 0) {
                    for (j in 0 until rowView.childCount) {
                        val child = rowView.getChildAt(j)
                        val lp = child.layoutParams
                        if (lp.height != maxHeight) {
                            lp.height = maxHeight
                            child.layoutParams = lp
                        }
                    }
                }
            }
        }
    }

    private fun metricValueColor'''
          if old_end not in s:
              raise SystemExit('B509 grid end block not found')
          s = s.replace(old_end, new_end, 1)

          old_name = '''        "AAOI" -> "Applied Optoelectronics, Inc."
        "NVDA" -> "NVIDIA Corporation";'''
          new_name = '''        "AAOI" -> "Applied Optoelectronics, Inc."
        "APLD" -> "Applied Digital Corporation"
        "NVDA" -> "NVIDIA Corporation";'''
          if old_name not in s:
              raise SystemExit('B509 company-name map anchor not found')
          s = s.replace(old_name, new_name, 1)

          s = s.replace('text = "ORACLE • V6g-FINAL-B508"', 'text = "ORACLE • V6g-FINAL-B509"')
          p.write_text(s)

      - name: Commit B509 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/ro/alintudor/oracle/nativeui/OracleAnalysisModules.kt
          if git diff --cached --quiet; then
            echo "No source changes needed."
          else
            git commit -m "B509: autoscale Analysis matrix cards and add APLD company name [skip ci]"
            git push
          fi

      - name: Prepare production signing key
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$ORACLE_KEYSTORE_BASE64" ] && [ -n "$ORACLE_KEYSTORE_PASSWORD" ] && [ -n "$ORACLE_KEY_ALIAS" ] && [ -n "$ORACLE_KEY_PASSWORD" ]; then
            echo "$ORACLE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/oracle-release.jks"
            {
              echo "ORACLE_KEYSTORE_FILE=$RUNNER_TEMP/oracle-release.jks"
              echo "ORACLE_KEYSTORE_PASSWORD=$ORACLE_KEYSTORE_PASSWORD"
              echo "ORACLE_KEY_ALIAS=$ORACLE_KEY_ALIAS"
              echo "ORACLE_KEY_PASSWORD=$ORACLE_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
          fi
      - name: Build signed release APK
        run: gradle :app:assembleRelease --stacktrace
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
      - name: Upload B509 FINAL installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Oracle-APK-B509-FINAL-installable
          path: app/build/outputs/apk/release/*.apk
