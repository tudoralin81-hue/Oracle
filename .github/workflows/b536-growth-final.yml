name: Oracle B536 Growth Final Verified

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  growth:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Generate and harden B535 Growth
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/^a\.write_text(s\[:i\]+h+s\[j:\])$/p.write_text(s[:i]+h+s[j:])/g; /^PY$/d' scripts/build_b535_growth.py
          python3 scripts/build_b535_growth.py
          python3 scripts/fix_b535_growth_runtime.py
          python3 scripts/final_growth_hardening.py
          sed -i 's/seed?\.company/null/g; s/seed?\.sector/null/g' app/src/main/java/ro/alintudor/oracle/core/OracleGrowthEngine.kt
      - name: Verify Growth safety gates
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'ConcurrentHashMap<String, String>()' app/src/main/java/ro/alintudor/oracle/core/OracleRealData.kt
          grep -q 'remote?.let { companyNameCache\[symbol\]=it }' app/src/main/java/ro/alintudor/oracle/core/OracleRealData.kt
          grep -q 'newFixedThreadPool(16)' app/src/main/java/ro/alintudor/oracle/core/OracleGrowthEngine.kt
          grep -Eq 'invokeAll\(tasks, 25, ?TimeUnit\.SECONDS\)' app/src/main/java/ro/alintudor/oracle/core/OracleGrowthEngine.kt
          grep -q 'newFixedThreadPool(15)' app/src/main/java/ro/alintudor/oracle/core/OracleGrowthEngine.kt
          grep -Eq 'f\.get\(12, ?TimeUnit\.SECONDS\)' app/src/main/java/ro/alintudor/oracle/core/OracleGrowthEngine.kt
          grep -q 'future.get(45, TimeUnit.SECONDS)' app/src/main/java/ro/alintudor/oracle/OracleMysticActivity.kt
          grep -q 'Calculul Growth a depășit limita de 45 de secunde' app/src/main/java/ro/alintudor/oracle/OracleMysticActivity.kt
          git diff --check
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Build B536 Growth release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Verify installable APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -q "versionName='V6g-GROWTH-B535'"
      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: Oracle-APK-B535-GROWTH-NPE-FIXED-FINAL
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
