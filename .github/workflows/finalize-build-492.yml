name: Finalize Build 492

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply final Analysis/UI fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/ro/alintudor/oracle/nativeui/OracleNativeModule.kt')
          s = p.read_text(encoding='utf-8')
          # This legacy workflow is manual-only. Do not rewrite current B510 source.
          if 'BUILD 506' in s:
              s = s.replace('BUILD 506', 'BUILD 510', 1)
              p.write_text(s, encoding='utf-8')
          p = Path('app/src/main/java/ro/alintudor/oracle/nativeui/OracleAnalysisModules.kt')
          s = p.read_text(encoding='utf-8')
          s = s.replace('"Revenue growth" to pctFund(f?.revenueGrowth)', '"Revenue growth (YoY)" to pctFund(f?.revenueGrowth)', 1)
          p.write_text(s, encoding='utf-8')
          print('Legacy Build 492 workflow is manual-only.')
          PY

      - name: Commit final patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/ro/alintudor/oracle/nativeui/OracleNativeModule.kt app/src/main/java/ro/alintudor/oracle/nativeui/OracleAnalysisModules.kt
          if git diff --cached --quiet; then
            echo 'No final changes required.'
            exit 0
          fi
          git commit -m 'Legacy Build 492 workflow: manual only'
          git push
