name: One-off Analysis UI fix

on:
  push:
    branches:
      - feature/news-module-v1

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[analysis-ui-fix]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/news-module-v1
          fetch-depth: 0

      - name: Patch Analysis UI
        shell: python
        run: |
          from pathlib import Path

          modules = Path('app/src/main/java/ro/alintudor/oracle/nativeui/OracleAnalysisModules.kt')
          s = modules.read_text()
          old = 'listOf("30M", "1H", "1D", "5D", "1M", "3M", "1Y")'
          new = 'listOf("5M", "30M", "1H", "1D", "5D", "1M", "3M", "1Y")'
          if old not in s:
              raise SystemExit('Analysis timeframe list not found')
          s = s.replace(old, new, 1)
          s = s.replace('textSize = 11f\n                typeface = Typeface.DEFAULT_BOLD', 'textSize = 10f\n                typeface = Typeface.DEFAULT_BOLD', 1)
          modules.write_text(s)

          market = Path('app/src/main/java/ro/alintudor/oracle/core/OracleMarketData.kt')
          s = market.read_text()
          old = '"30M" -> "5d" to "30m"\n            "1H" -> "1mo" to "1h"'
          new = '"5M" -> "5d" to "5m"\n            "30M" -> "5d" to "30m"\n            "1H" -> "1mo" to "1h"'
          if old not in s:
              raise SystemExit('Market timeframe mapping not found')
          market.write_text(s.replace(old, new, 1))

          chart = Path('app/src/main/java/ro/alintudor/oracle/nativeui/OracleAnalysisChartView.kt')
          s = chart.read_text()
          old = '"30M", "1H", "1D", "5D", "1M", "3M", "1Y" -> value'
          new = '"5M", "30M", "1H", "1D", "5D", "1M", "3M", "1Y" -> value'
          if old not in s:
              raise SystemExit('Chart mode validation not found')
          s = s.replace(old, new, 1)

          replacements = [
              ('drawGrid(c, 0f, 72f, chartBottom, 6)', 'drawGrid(c, 0f, 94f, chartBottom, 6)'),
              ('drawCandles(c, d, 12f, 72f, width - 48f, chartBottom)', 'drawCandles(c, d, 12f, 94f, width - 48f, chartBottom)'),
              ('label(c, "$ticker  •  $mode", 14f, 27f, Color.WHITE, 21f)', 'label(c, "$ticker  •  $mode", 14f, 27f, Color.WHITE, 18f)'),
              ('label(c, money(d.last().close), width - 125f, 27f, green, 18f)', 'label(c, money(d.last().close), width - 125f, 27f, green, 16f)'),
              ('label(c, "O ${money(p.open)}   H ${money(p.high)}   L ${money(p.low)}   C ${money(p.close)}", 14f, 53f, if (p.close >= p.open) green else red, 16f)', 'label(c, "O ${money(p.open)}   H ${money(p.high)}   L ${money(p.low)}   C ${money(p.close)}", 14f, 53f, if (p.close >= p.open) green else red, 13f)'),
              ('label(c, "${dateTime(p.timestamp)}   •   VOL ${volumeText(p.volume)}", 14f, 70f, text, 15f)', 'label(c, "${dateTime(p.timestamp)}   •   VOL ${volumeText(p.volume)}", 14f, 78f, text, 13f)'),
              ('label(c, "Atinge o lumânare pentru OHLC + data/ora + volum", 14f, 52f, text, 15f)', 'label(c, "Atinge o lumânare pentru OHLC + data/ora + volum", 14f, 54f, text, 13f)')
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'Chart replacement not found: {old[:60]}')
              s = s.replace(old, new, 1)
          chart.write_text(s)

          Path('.github/workflows/oneoff-analysis-ui-fix.yml').unlink()

      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/ro/alintudor/oracle/nativeui/OracleAnalysisModules.kt app/src/main/java/ro/alintudor/oracle/nativeui/OracleAnalysisChartView.kt app/src/main/java/ro/alintudor/oracle/core/OracleMarketData.kt .github/workflows/oneoff-analysis-ui-fix.yml
          git commit -m "fix: Analysis 5M and non-overlapping chart header [analysis-ui-fix]"
          git push origin HEAD:feature/news-module-v1

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Build debug APK
        run: chmod +x ./gradlew && ./gradlew assembleDebug

      - name: Upload patched APK
        uses: actions/upload-artifact@v4
        with:
          name: Oracle-Analysis-5M-UI-fix
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
