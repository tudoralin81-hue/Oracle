name: Oracle B518 Growth FINAL APK

'on':
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  ORACLE_KEYSTORE_BASE64: ${{ secrets.ORACLE_KEYSTORE_BASE64 }}
  ORACLE_KEYSTORE_PASSWORD: ${{ secrets.ORACLE_KEYSTORE_PASSWORD }}
  ORACLE_KEY_ALIAS: ${{ secrets.ORACLE_KEY_ALIAS }}
  ORACLE_KEY_PASSWORD: ${{ secrets.ORACLE_KEY_PASSWORD }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Apply Growth-only fix
        run: |
          set -euo pipefail
          python3 scripts/fix_growth_stale_and_build_footer.py
          git diff --check
      - name: Verify Growth-only source
        run: |
          set -euo pipefail
          grep -q "V6g-FINAL-B518" app/build.gradle
          grep -q "V6g-FINAL-B518" app/src/main/java/ro/alintudor/oracle/nativeui/OracleGrowthModule.kt
          grep -q "Never render a stale trading-day snapshot" app/src/main/java/ro/alintudor/oracle/nativeui/OracleGrowthModule.kt
          grep -q "addBuildFooter" app/src/main/java/ro/alintudor/oracle/nativeui/OracleGrowthModule.kt
          grep -q "Europe/Bucharest" app/src/main/java/ro/alintudor/oracle/nativeui/OracleGrowthModule.kt
          grep -q "OracleMarketCalendar" app/src/main/java/ro/alintudor/oracle/core/OracleLocalProcessor.kt
          git diff --check
      - name: Prepare production signing key
        run: |
          set -euo pipefail
          if [ -n "$ORACLE_KEYSTORE_BASE64" ] && [ -n "$ORACLE_KEYSTORE_PASSWORD" ] && [ -n "$ORACLE_KEY_ALIAS" ] && [ -n "$ORACLE_KEY_PASSWORD" ]; then
            echo "$ORACLE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/oracle-release.jks"
            {
              echo "ORACLE_KEYSTORE_FILE=$RUNNER_TEMP/oracle-release.jks"
              echo "ORACLE_KEYSTORE_PASSWORD=$ORACLE_KEYSTORE_PASSWORD"
              echo "ORACLE_KEY_ALIAS=$ORACLE_KEY_ALIAS"
              echo "ORACLE_KEY_PASSWORD=$ORACLE_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
          fi
      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Verify APK
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK"
      - name: Upload B518 FINAL APK
        uses: actions/upload-artifact@v4
        with:
          name: Oracle-APK-B518-GrowthFix-installable
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
