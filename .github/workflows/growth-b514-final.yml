name: Oracle B519 FINAL APK

'on':
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  ORACLE_KEYSTORE_BASE64: ${{ secrets.ORACLE_KEYSTORE_BASE64 }}
  ORACLE_KEYSTORE_PASSWORD: ${{ secrets.ORACLE_KEYSTORE_PASSWORD }}
  ORACLE_KEY_ALIAS: ${{ secrets.ORACLE_KEY_ALIAS }}
  ORACLE_KEY_PASSWORD: ${{ secrets.ORACLE_KEY_PASSWORD }}

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Verify B514 Analysis baseline
        run: |
          set -euo pipefail
          test "$(git rev-parse 51365deb1a5e4e3020fcf02a144d55ba6a8f027e^{commit})" = "51365deb1a5e4e3020fcf02a144d55ba6a8f027e"
          git diff --quiet 51365deb1a5e4e3020fcf02a144d55ba6a8f027e -- app/src/main/java/ro/alintudor/oracle/MainActivity.kt app/src/main/java/ro/alintudor/oracle/core/OracleLocalProcessor.kt
      - name: Apply B519 Growth-only render patch
        run: |
          set -euo pipefail
          python3 scripts/fix_growth_b519.py
          git diff --check
      - name: Verify B519 source
        run: |
          set -euo pipefail
          grep -q "versionCode 31" app/build.gradle
          grep -q "versionName 'V6g-FINAL-B519'" app/build.gradle
          grep -q "currentGrowthAnchor" app/src/main/java/ro/alintudor/oracle/core/OracleGrowthLiveData.kt
          ! grep -q "firstRender" app/src/main/java/ro/alintudor/oracle/core/OracleGrowthLiveData.kt
          grep -q "addBuildFooter" app/src/main/java/ro/alintudor/oracle/nativeui/OracleGrowthModule.kt
          grep -q "BUILD B519 • V6g-FINAL" app/src/main/java/ro/alintudor/oracle/nativeui/OracleGrowthModule.kt
          grep -q "☀" app/src/main/java/ro/alintudor/oracle/nativeui/OracleNativeModule.kt
          grep -q "☾" app/src/main/java/ro/alintudor/oracle/nativeui/OracleNativeModule.kt
          git diff --check
      - name: Prepare production signing key
        run: |
          set -euo pipefail
          if [ -n "$ORACLE_KEYSTORE_BASE64" ] && [ -n "$ORACLE_KEYSTORE_PASSWORD" ] && [ -n "$ORACLE_KEY_ALIAS" ] && [ -n "$ORACLE_KEY_PASSWORD" ]; then
            echo "$ORACLE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/oracle-release.jks"
            {
              echo "ORACLE_KEYSTORE_FILE=$RUNNER_TEMP/oracle-release.jks"
              echo "ORACLE_KEYSTORE_PASSWORD=$ORACLE_KEYSTORE_PASSWORD"
              echo "ORACLE_KEY_ALIAS=$ORACLE_KEY_ALIAS"
              echo "ORACLE_KEY_PASSWORD=$ORACLE_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
          fi
      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Verify APK
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK"
      - name: Upload B519 FINAL APK
        uses: actions/upload-artifact@v4
        with:
          name: Oracle-APK-B519-FINAL-installable
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
