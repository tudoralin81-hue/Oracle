name: Build Oracle Watchlist Fix
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Watchlist navigation fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/ro/alintudor/oracle/OracleMysticActivity.kt')
          s = p.read_text(encoding='utf-8')
          old = '''            "growth", "analysis", "watchlist", "knowledge" -> OracleSimpleModule(host, titles[key] ?: key.uppercase()).render(actions = data.actions, knowledge = data.knowledge, positions = data.positions, history = data.history)'''
          new = '''            "growth", "analysis", "watchlist", "knowledge" -> OracleSimpleModule(
                host,
                titles[key] ?: key.uppercase(),
                onWatchlistTickerClick = { ticker -> openWatchlistTicker(ticker) }
            ).render(actions = data.actions, knowledge = data.knowledge, positions = data.positions, history = data.history)'''
          if old not in s:
              raise SystemExit('Watchlist callback target not found; refusing to build.')
          s = s.replace(old, new, 1)
          anchor = '''    private fun handleBack() {'''
          fn = '''    private fun openWatchlistTicker(ticker: String) {
        val normalized = ticker.trim().uppercase(java.util.Locale.US)
        if (normalized.isBlank()) return
        OracleSimpleModule.setTickerDraft(normalized)
        openModule("analysis")
    }

'''
          if fn.strip() not in s:
              if anchor not in s:
                  raise SystemExit('Watchlist function insertion anchor not found; refusing to build.')
              s = s.replace(anchor, fn + anchor, 1)
          marker = '''        runCatching { renderModule(key) }.onFailure { showModuleError(key, it) }
        Thread {'''
          guarded = '''        runCatching { renderModule(key) }.onFailure { showModuleError(key, it) }
        // Analysis is auto-triggered from the selected Watchlist ticker.
        // Do not let the background refresh immediately re-render it.
        if (key == "analysis") return
        Thread {'''
          if marker not in s:
              raise SystemExit('openModule guard target not found; refusing to build.')
          s = s.replace(marker, guarded, 1)
          p.write_text(s, encoding='utf-8')
          print('Watchlist navigation fix + Analysis re-render guard applied successfully.')
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Build release APK
        run: gradle :app:assembleRelease --stacktrace
      - name: Verify APK
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Oracle-Watchlist-fix-latest
          path: app/build/outputs/apk/release/*.apk
