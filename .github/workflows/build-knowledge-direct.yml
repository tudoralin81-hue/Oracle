name: Oracle Actions Sanity Test

on:
  push:
    branches: [main]
    paths:
      - B519_START_FINAL.txt
      - .github/workflows/build-knowledge-direct.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Runner sanity check
        run: |
          set -euo pipefail
          echo "GitHub Actions runner is available"
          test -f B519_START_FINAL.txt
