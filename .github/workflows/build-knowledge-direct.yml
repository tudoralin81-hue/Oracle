name: Build Oracle Knowledge Link
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Verify Knowledge link implementation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/ro/alintudor/oracle/MainActivity.kt')
          s = p.read_text(encoding='utf-8')
          required = [
              'private fun renderKnowledgeDirect(host: OracleNativeModule)',
              'Deschide alintudor.ro/knowledge/',
              'openKnowledgeUrl("https://alintudor.ro/knowledge/")',
              'DESCHIDE KNOWLEDGE'
          ]
          missing = [x for x in required if x not in s]
          if missing:
              raise SystemExit('Knowledge link implementation missing: ' + ', '.join(missing))
          print('Knowledge direct link implementation verified.')
          PY
      - name: Build release APK
        run: gradle :app:assembleRelease --stacktrace
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          echo "APK=$APK"
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Oracle-Knowledge-link-latest
          path: app/build/outputs/apk/release/*.apk
