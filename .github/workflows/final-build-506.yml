name: Oracle APK B508 FINAL
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ORACLE_KEYSTORE_BASE64: ${{ secrets.ORACLE_KEYSTORE_BASE64 }}
      ORACLE_KEYSTORE_PASSWORD: ${{ secrets.ORACLE_KEYSTORE_PASSWORD }}
      ORACLE_KEY_ALIAS: ${{ secrets.ORACLE_KEY_ALIAS }}
      ORACLE_KEY_PASSWORD: ${{ secrets.ORACLE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android 16 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Apply B508 Analysis UI polish
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          src = Path('app/src/main/java/ro/alintudor/oracle/nativeui/OracleAnalysisModules.kt')
          s = src.read_text(encoding='utf-8')

          old = 'row?.addView(card, LinearLayout.LayoutParams(0, -2, 1f).apply {'
          new = 'row?.addView(card, LinearLayout.LayoutParams(0, host.dp(104), 1f).apply {'
          if old not in s:
              if 'row?.addView(card, LinearLayout.LayoutParams(0, host.dp(104), 1f).apply {' not in s:
                  raise SystemExit('Expected metric-card layout line not found')
          else:
              s = s.replace(old, new, 1)

          s = s.replace('Color.rgb(255, 193, 7)', 'Color.rgb(228, 178, 28)')
          s = s.replace('Color.rgb(255, 193, 54)', 'Color.rgb(228, 178, 28)')

          needle = 'host.content.addView(w, LinearLayout.LayoutParams(-1, host.dp(50)).apply { setMargins(0, 0, 0, host.dp(16)) })'
          marker = '// BUILD_VERSION_BOTTOM_V1'
          if marker not in s:
              if needle not in s:
                  raise SystemExit('Expected Analysis bottom/watchlist anchor not found')
              insert = '''host.content.addView(w, LinearLayout.LayoutParams(-1, host.dp(50)).apply { setMargins(0, 0, 0, host.dp(16)) })

          // BUILD_VERSION_BOTTOM_V1
          host.content.addView(TextView(host.root.context).apply {
              text = "ORACLE • V6g-FINAL-B508"
              textSize = 10f
              typeface = Typeface.DEFAULT_BOLD
              letterSpacing = .08f
              gravity = Gravity.CENTER
              setTextColor(Color.rgb(110, 120, 140))
              setPadding(0, host.dp(6), 0, host.dp(18))
          }, LinearLayout.LayoutParams(-1, -2))'''
              s = s.replace(needle, insert, 1)

          src.write_text(s, encoding='utf-8')

          gradle = Path('app/build.gradle')
          g = gradle.read_text(encoding='utf-8')
          g = g.replace("versionName 'V6g-FINAL-B507'", "versionName 'V6g-FINAL-B508'")
          if "versionName 'V6g-FINAL-B508'" not in g:
              raise SystemExit('Version name update failed')
          gradle.write_text(g, encoding='utf-8')
          PY
          grep -q "versionCode 23" app/build.gradle
          grep -q "versionName 'V6g-FINAL-B508'" app/build.gradle
          grep -q 'host.dp(104)' app/src/main/java/ro/alintudor/oracle/nativeui/OracleAnalysisModules.kt
          grep -q 'BUILD_VERSION_BOTTOM_V1' app/src/main/java/ro/alintudor/oracle/nativeui/OracleAnalysisModules.kt
          grep -q 'Color.rgb(228, 178, 28)' app/src/main/java/ro/alintudor/oracle/nativeui/OracleAnalysisModules.kt
      - name: Commit B508 UI changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle app/src/main/java/ro/alintudor/oracle/nativeui/OracleAnalysisModules.kt
          if git diff --cached --quiet; then
            echo "B508 UI changes already present"
          else
            git commit -m "B508: equalize Analysis cards and soften yellow text"
            git push origin HEAD:main
          fi
      - name: Verify authoritative Analysis mapping and UI
        shell: bash
        run: |
          set -euo pipefail
          grep -q "versionCode 23" app/build.gradle
          grep -q "versionName 'V6g-FINAL-B508'" app/build.gradle
          grep -q 'name to (r.rawValues.getOrNull(i + 1)' app/src/main/java/ro/alintudor/oracle/nativeui/OracleAnalysisModules.kt
          ! grep -q 'name to (r.rawValues.getOrNull(i) ?: "Valoare indisponibilă")' app/src/main/java/ro/alintudor/oracle/nativeui/OracleAnalysisModules.kt
          grep -q 'host.dp(104)' app/src/main/java/ro/alintudor/oracle/nativeui/OracleAnalysisModules.kt
          grep -q 'BUILD_VERSION_BOTTOM_V1' app/src/main/java/ro/alintudor/oracle/nativeui/OracleAnalysisModules.kt
          grep -q 'Color.rgb(228, 178, 28)' app/src/main/java/ro/alintudor/oracle/nativeui/OracleAnalysisModules.kt
          grep -q 'val factorKeys = listOf("news","breakout","trend","momentum","volume","support_resistance","fundamentals","bollinger","ichimoku","market_sector","risk_reward","adx")' app/src/main/java/ro/alintudor/oracle/core/OracleAnalysisEngine.kt
          grep -q 'val factorNames = listOf("Breakout","Trend","Momentum","Volume","Support / Resistance","Fundamentals","Bollinger","Ichimoku","Market / Sector","Risk / Reward","ADX")' app/src/main/java/ro/alintudor/oracle/core/OracleAnalysisEngine.kt
          git diff --check
      - name: Build signed release APK
        run: gradle :app:assembleRelease --stacktrace
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK"
      - name: Upload B508 FINAL installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Oracle-APK-B508-FINAL-installable
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
