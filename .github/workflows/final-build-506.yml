name: Oracle APK B506 FINAL
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ORACLE_KEYSTORE_BASE64: ${{ secrets.ORACLE_KEYSTORE_BASE64 }}
      ORACLE_KEYSTORE_PASSWORD: ${{ secrets.ORACLE_KEYSTORE_PASSWORD }}
      ORACLE_KEY_ALIAS: ${{ secrets.ORACLE_KEY_ALIAS }}
      ORACLE_KEY_PASSWORD: ${{ secrets.ORACLE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android 16 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Prepare production signing key
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$ORACLE_KEYSTORE_BASE64" ] && [ -n "$ORACLE_KEYSTORE_PASSWORD" ] && [ -n "$ORACLE_KEY_ALIAS" ] && [ -n "$ORACLE_KEY_PASSWORD" ]; then
            echo "$ORACLE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/oracle-release.jks"
            {
              echo "ORACLE_KEYSTORE_FILE=$RUNNER_TEMP/oracle-release.jks"
              echo "ORACLE_KEYSTORE_PASSWORD=$ORACLE_KEYSTORE_PASSWORD"
              echo "ORACLE_KEY_ALIAS=$ORACLE_KEY_ALIAS"
              echo "ORACLE_KEY_PASSWORD=$ORACLE_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
          fi
      - name: Repair authoritative Analysis mapping
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/ro/alintudor/oracle/nativeui/OracleAnalysisModules.kt')
          s = p.read_text(encoding='utf-8')
          old = 'name to (r.rawValues.getOrNull(i) ?: "Valoare indisponibilă")'
          new = 'name to (r.rawValues.getOrNull(i + 1) ?: "Valoare indisponibilă")'
          if old in s:
              s = s.replace(old, new, 1)
              s = s.replace('// ANALYSIS_PARAMETERS_V6', '// ANALYSIS_PARAMETERS_V7', 1)
              s = s.replace('// NEWS remains internal to Growth and is intentionally hidden here.', '// News remains internal to the Oracle calculation and is intentionally hidden from Analysis UI.\n        // rawValues[0] is News; factorNames contains only the 11 visible factors, so visible factor i maps to rawValues[i + 1].', 1)
              p.write_text(s, encoding='utf-8')
              print('Analysis mapping repaired.')
          else:
              print('Analysis mapping already repaired.')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/ro/alintudor/oracle/nativeui/OracleAnalysisModules.kt
          if ! git diff --cached --quiet; then
            git commit -m 'Fix Analysis Oracle value mapping'
            git push
          fi
      - name: Verify authoritative B506 source
        shell: bash
        run: |
          set -euo pipefail
          grep -q "versionCode 22" app/build.gradle
          grep -q "versionName 'V6g-FINAL-B506'" app/build.gradle
          grep -q 'text="BUILD 506 • FINAL"' app/src/main/java/ro/alintudor/oracle/nativeui/OracleNativeModule.kt
          grep -q 'name to (r.rawValues.getOrNull(i + 1)' app/src/main/java/ro/alintudor/oracle/nativeui/OracleAnalysisModules.kt
          ! grep -q 'name to (r.rawValues.getOrNull(i) ?: "Valoare indisponibilă")' app/src/main/java/ro/alintudor/oracle/nativeui/OracleAnalysisModules.kt
          grep -q 'val rg=ts?.revenueGrowth ?: summary?.revenueGrowth' app/src/main/java/ro/alintudor/oracle/core/OracleRealData.kt
          grep -q 'val cap=summary?.marketCap ?: quote?.marketCap ?: ts?.marketCap' app/src/main/java/ro/alintudor/oracle/core/OracleRealData.kt
          ! grep -R -q 'finalize_b505.py' .github/workflows || true
          git diff --check
      - name: Build signed release APK
        run: gradle :app:assembleRelease --stacktrace
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK"
      - name: Upload B506 FINAL installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Oracle-APK-B506-FINAL-installable
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
