name: Oracle B514 Analysis Fix
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix Analysis matrix layout
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('app/src/main/java/ro/alintudor/oracle/nativeui/OracleAnalysisModules.kt')
          s = p.read_text(encoding='utf-8')

          # The old Oracle "Fundamentals" factor is a single long text block.
          # Fundamentals are already represented below as individual matrix cards;
          # keeping the aggregate card creates the oversized/clipped row seen in B513.
          old = '''        OracleAnalysisEngine.factorNames.forEachIndexed { i, name ->
            relevantParameters.add(name to (r.rawValues.getOrNull(i + 1) ?: "Valoare indisponibilă"))
        }'''
          new = '''        OracleAnalysisEngine.factorNames.forEachIndexed { i, name ->
            if (!name.equals("Fundamentals", ignoreCase = true)) {
                relevantParameters.add(name to (r.rawValues.getOrNull(i + 1) ?: "Valoare indisponibilă"))
            }
        }'''
          if old not in s:
              raise SystemExit('Expected factorNames block not found')
          s = s.replace(old, new, 1)

          # Replace the fragile weighted/measure-with-largest-child grid implementation
          # with a true wrap-content two-column matrix. Each row is equalized only after
          # Android has completed the real text measurement, so multiline cards cannot clip.
          start = s.index('    private fun addMetricGrid(')
          end = s.index('    private fun metricValueColor', start)
          new_func = '''    private fun addMetricGrid(container: LinearLayout, items: List<Pair<String, String>>) {
        var row: LinearLayout? = null

        fun equalizeRow(target: LinearLayout) {
            var maxHeight = 0
            for (j in 0 until target.childCount) {
                val child = target.getChildAt(j)
                child.measure(
                    android.view.View.MeasureSpec.makeMeasureSpec(target.measuredWidth / 2, android.view.View.MeasureSpec.AT_MOST),
                    android.view.View.MeasureSpec.makeMeasureSpec(0, android.view.View.MeasureSpec.UNSPECIFIED)
                )
                maxHeight = maxOf(maxHeight, child.measuredHeight)
            }
            if (maxHeight > 0) {
                for (j in 0 until target.childCount) {
                    val child = target.getChildAt(j)
                    val lp = child.layoutParams
                    if (lp.height != maxHeight) {
                        lp.height = maxHeight
                        child.layoutParams = lp
                    }
                }
            }
        }

        items.forEachIndexed { index, item ->
            if (index % 2 == 0) {
                row = LinearLayout(host.root.context).apply {
                    orientation = LinearLayout.HORIZONTAL
                    gravity = Gravity.TOP
                    clipChildren = false
                    clipToPadding = false
                }
                container.addView(row, LinearLayout.LayoutParams(-1, -2).apply {
                    setMargins(0, 0, 0, host.dp(6))
                })
            }

            val card = LinearLayout(host.root.context).apply {
                orientation = LinearLayout.VERTICAL
                setPadding(host.dp(11), host.dp(8), host.dp(11), host.dp(8))
                clipChildren = false
                clipToPadding = false
                background = GradientDrawable().apply {
                    setColor(Color.rgb(6, 12, 24))
                    cornerRadius = host.dp(12).toFloat()
                    setStroke(host.dp(1), Color.rgb(35, 65, 98))
                }
            }
            card.addView(TextView(host.root.context).apply {
                text = item.first.uppercase(Locale.US)
                textSize = 10f
                typeface = Typeface.DEFAULT_BOLD
                letterSpacing = .07f
                setTextColor(Color.rgb(85, 190, 235))
                includeFontPadding = true
                maxLines = 2
                setHorizontallyScrolling(false)
            })
            card.addView(TextView(host.root.context).apply {
                text = item.second
                textSize = 12.5f
                typeface = Typeface.DEFAULT_BOLD
                setTextColor(metricValueColor(item.first, item.second))
                setPadding(0, host.dp(2), 0, 0)
                includeFontPadding = true
                setHorizontallyScrolling(false)
                maxLines = Int.MAX_VALUE
                ellipsize = null
            })
            row?.addView(card, LinearLayout.LayoutParams(0, -2, 1f).apply {
                if (index % 2 == 1) setMargins(host.dp(4), 0, 0, 0)
                else setMargins(0, 0, host.dp(4), 0)
            })

            row?.post { equalizeRow(row!!) }
        }

        container.post {
            for (i in 0 until container.childCount) {
                val r = container.getChildAt(i) as? LinearLayout ?: continue
                equalizeRow(r)
            }
            container.requestLayout()
        }
    }

'''
          s = s[:start] + new_func + s[end:]

          # Advance the displayed build version only; no data/formula changes.
          s = s.replace('ORACLE • V6g-FINAL-B513', 'ORACLE • V6g-FINAL-B514')
          p.write_text(s, encoding='utf-8')

          gpath = Path('app/build.gradle')
          g = gpath.read_text(encoding='utf-8')
          g = g.replace('versionCode 24', 'versionCode 25')
          g = g.replace("versionName 'V6g-FINAL-B509'", "versionName 'V6g-FINAL-B514'")
          g = g.replace("versionName 'V6g-FINAL-B513'", "versionName 'V6g-FINAL-B514'")
          gpath.write_text(g, encoding='utf-8')

          # Make sure the intended source state is actually present.
          assert 'if (!name.equals("Fundamentals", ignoreCase = true))' in s
          assert 'gravity = Gravity.TOP' in s
          assert 'clipChildren = false' in s
          assert 'ORACLE • V6g-FINAL-B514' in s
      - name: Verify and build
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'if (!name.equals("Fundamentals", ignoreCase = true))' app/src/main/java/ro/alintudor/oracle/nativeui/OracleAnalysisModules.kt
          grep -q 'gravity = Gravity.TOP' app/src/main/java/ro/alintudor/oracle/nativeui/OracleAnalysisModules.kt
          grep -q "versionName 'V6g-FINAL-B514'" app/build.gradle
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/ro/alintudor/oracle/nativeui/OracleAnalysisModules.kt app/build.gradle
          if ! git diff --cached --quiet; then
            git commit -m "B514: remove aggregate Fundamentals card and fix matrix autoscale [skip ci]"
            git push origin HEAD:main
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Build release APK
        run: gradle :app:assembleRelease --stacktrace
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
      - name: Upload B514 APK
        uses: actions/upload-artifact@v4
        with:
          name: Oracle-APK-B514-FINAL-installable
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
