name: Patch Portfolio V12
on:
  push:
    branches: [ 'ui/portfolio-v12-fix' ]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply portfolio fixes
        run: python3 scripts/patch_portfolio_v12.py
      - name: Commit patched source
        run: |
          git config user.name 'oracle-bot'
          git config user.email 'oracle-bot@users.noreply.github.com'
          git add app/src/main/java/ro/alintudor/oracle/nativeui/OraclePortfolioModule.kt
          git diff --cached --quiet && exit 0
          git commit -m 'fix: portfolio forecast and bottom exports [skip ci]'
          git push origin HEAD
