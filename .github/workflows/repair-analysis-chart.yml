name: Repair Analysis Chart

on:
  push:
    branches:
      - feature/news-module-v1

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message != 'fix: repair Analysis chart Kotlin type mismatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair Kotlin type mismatch
        shell: bash
        run: |
          set -euo pipefail
          FILE="app/src/main/java/ro/alintudor/oracle/nativeui/OracleAnalysisChartView.kt"
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/ro/alintudor/oracle/nativeui/OracleAnalysisChartView.kt")
          s = p.read_text()
          old = 'val futureBars = min(12, max(4, (right - lastX) / max(1f, step)).toInt())'
          new = 'val futureBars = min(12, max(4f, (right - lastX) / max(1f, step)).toInt())'
          if old not in s:
              raise SystemExit("Expected Analysis chart line not found")
          p.write_text(s.replace(old, new, 1))
          PY
          git config user.name "tudoralin81-hue"
          git config user.email "tudor.alin81@gmail.com"
          git add "$FILE"
          git commit -m "fix: repair Analysis chart Kotlin type mismatch"
          git push origin HEAD:feature/news-module-v1

