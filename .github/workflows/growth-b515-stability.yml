name: Oracle B515 Growth Stability APK

'on':
  push:
    branches: [growth-b515-stability]
  pull_request:
    branches: [build-519]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

env:
  ORACLE_KEYSTORE_BASE64: ${{ secrets.ORACLE_KEYSTORE_BASE64 }}
  ORACLE_KEYSTORE_PASSWORD: ${{ secrets.ORACLE_KEYSTORE_PASSWORD }}
  ORACLE_KEY_ALIAS: ${{ secrets.ORACLE_KEY_ALIAS }}
  ORACLE_KEY_PASSWORD: ${{ secrets.ORACLE_KEY_PASSWORD }}

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: growth-b515-stability

      - name: Restore exact approved B514 Analysis source
        run: |
          set -euo pipefail
          B514_COMMIT="51365deb1a5e4e3020fcf02a144d55ba6a8f027e"
          ANALYSIS="app/src/main/java/ro/alintudor/oracle/nativeui/OracleAnalysisModules.kt"
          git checkout "$B514_COMMIT" -- "$ANALYSIS"
          test "$(git hash-object "$ANALYSIS")" = "76210ed4db93147487bc59e01ced70ae54f44ff6"
          test "$(git rev-parse "$B514_COMMIT:$ANALYSIS")" = "76210ed4db93147487bc59e01ced70ae54f44ff6"

      - name: Apply B515 Growth stability patch
        run: |
          set -euo pipefail
          python3 scripts/fix_growth_b515.py
          git diff --check

      - name: Verify Analysis is untouched by Growth patch
        run: |
          set -euo pipefail
          test "$(git hash-object app/src/main/java/ro/alintudor/oracle/nativeui/OracleAnalysisModules.kt)" = "76210ed4db93147487bc59e01ced70ae54f44ff6"
          grep -q '@Synchronized' app/src/main/java/ro/alintudor/oracle/core/OracleLocalProcessor.kt
          grep -q 'currentGrowthAnchor' app/src/main/java/ro/alintudor/oracle/MainActivity.kt
          grep -q "versionName 'V6g-FINAL-B515'" app/build.gradle

      - name: Prepare production signing key
        run: |
          set -euo pipefail
          if [ -n "$ORACLE_KEYSTORE_BASE64" ] && [ -n "$ORACLE_KEYSTORE_PASSWORD" ] && [ -n "$ORACLE_KEY_ALIAS" ] && [ -n "$ORACLE_KEY_PASSWORD" ]; then
            echo "$ORACLE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/oracle-release.jks"
            {
              echo "ORACLE_KEYSTORE_FILE=$RUNNER_TEMP/oracle-release.jks"
              echo "ORACLE_KEYSTORE_PASSWORD=$ORACLE_KEYSTORE_PASSWORD"
              echo "ORACLE_KEY_ALIAS=$ORACLE_KEY_ALIAS"
              echo "ORACLE_KEY_PASSWORD=$ORACLE_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
          fi

      - name: Package only the approved B514 Analysis footer label
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/ro/alintudor/oracle/nativeui/OracleAnalysisModules.kt')
          s = p.read_text(encoding='utf-8')
          old = 'ORACLE • V6g-FINAL-B513'
          new = 'ORACLE • V6g-FINAL-B514'
          if old not in s:
              raise SystemExit('Expected B513 Analysis footer label not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Build release APK
        run: |
          set -euo pipefail
          gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Verify APK and prove Analysis source was only packaging-labeled
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/ro/alintudor/oracle/nativeui/OracleAnalysisModules.kt')
          s = p.read_text(encoding='utf-8')
          p.write_text(s.replace('ORACLE • V6g-FINAL-B514', 'ORACLE • V6g-FINAL-B513', 1), encoding='utf-8')
          PY
          test "$(git hash-object app/src/main/java/ro/alintudor/oracle/nativeui/OracleAnalysisModules.kt)" = "76210ed4db93147487bc59e01ced70ae54f44ff6"

      - name: Upload B515 FINAL APK
        uses: actions/upload-artifact@v4
        with:
          name: Oracle-APK-B515-Growth-Stability
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
