name: B514 Premium Start

on:
  workflow_dispatch:
  push:
    branches:
      - ui/start-premium-b514

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify frozen modules byte-for-byte
        shell: bash
        run: |
          set -euo pipefail
          grep -v '^#' FROZEN_MODULES_SHA256_B514.txt | while read -r expected path; do
            [ -z "${expected:-}" ] && continue
            actual="$(git hash-object "$path")"
            if [ "$actual" != "$expected" ]; then
              echo "BYTE-LOCK FAILURE: $path"
              echo "expected: $expected"
              echo "actual:   $actual"
              exit 1
            fi
            echo "LOCKED: $path"
          done

      - name: Build release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Oracle-B514-START-FINAL
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
