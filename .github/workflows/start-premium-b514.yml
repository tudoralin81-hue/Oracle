name: B514 Premium Start

on:
  workflow_dispatch:
  push:
    branches:
      - ui/start-premium-b514

permissions:
  contents: write

env:
  MAIN_FILE: app/src/main/java/ro/alintudor/oracle/MainActivity.kt

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Build release APK
        run: ./gradlew :app:assembleRelease --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Oracle-B514-START-PREMIUM
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

# Trigger a clean CI run for B514 Premium Start.
