name: B514 FINAL APK

'on':
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  BASE_COMMIT: e1195536704f375f6a44f1ae5985bc464671ec0b
  ORACLE_KEYSTORE_BASE64: ${{ secrets.ORACLE_KEYSTORE_BASE64 }}
  ORACLE_KEYSTORE_PASSWORD: ${{ secrets.ORACLE_KEYSTORE_PASSWORD }}
  ORACLE_KEY_ALIAS: ${{ secrets.ORACLE_KEY_ALIAS }}
  ORACLE_KEY_PASSWORD: ${{ secrets.ORACLE_KEY_PASSWORD }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current build recipe
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare EXACT B514-good source
        run: |
          set -euo pipefail
          cp scripts/b514_build_growth.py "$RUNNER_TEMP/b514_build_growth.py"
          git checkout "$BASE_COMMIT"
          test "$(git rev-parse HEAD)" = "$BASE_COMMIT"

      - name: Verify exact B514 baseline is checked out
        run: test "$(git rev-parse HEAD)" = "$BASE_COMMIT"

      - name: Apply ONLY Growth patch
        run: python3 "$RUNNER_TEMP/b514_build_growth.py"

      - name: HARD VERIFY Analysis unchanged
        run: |
          set -euo pipefail
          ANALYSIS="app/src/main/java/ro/alintudor/oracle/nativeui/OracleAnalysisModules.kt"
          test -f "$ANALYSIS"
          BASE_ANALYSIS_SHA="$(git rev-parse "$BASE_COMMIT:$ANALYSIS")"
          CURRENT_ANALYSIS_SHA="$(git hash-object "$ANALYSIS")"
          test "$CURRENT_ANALYSIS_SHA" = "$BASE_ANALYSIS_SHA"
          test "$(git diff -- "$ANALYSIS" | wc -l)" -eq 0
          grep -q 'return items.filter { it.referenceTimestamp > 0L }' app/src/main/java/ro/alintudor/oracle/core/OracleGrowthLiveData.kt
          grep -q 'if (key != "growth")' app/src/main/java/ro/alintudor/oracle/MainActivity.kt
          grep -q 'BUILD B514 • V6g-FINAL' app/src/main/java/ro/alintudor/oracle/nativeui/OracleGrowthModule.kt
          grep -q 'versionCode 35' app/build.gradle
          grep -q "versionName 'V6g-FINAL-B514'" app/build.gradle

      - name: HARD VERIFY ONLY Growth files changed
        run: |
          set -euo pipefail
          git diff --name-only | sort > "$RUNNER_TEMP/actual-files.txt"
          cat > "$RUNNER_TEMP/expected-files.txt" <<'EOF'
          app/build.gradle
          app/src/main/java/ro/alintudor/oracle/MainActivity.kt
          app/src/main/java/ro/alintudor/oracle/core/OracleGrowthLiveData.kt
          app/src/main/java/ro/alintudor/oracle/nativeui/OracleGrowthModule.kt
          EOF
          sed -i 's/^          //' "$RUNNER_TEMP/expected-files.txt"
          diff -u "$RUNNER_TEMP/expected-files.txt" "$RUNNER_TEMP/actual-files.txt"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Prepare production signing key
        run: |
          set -euo pipefail
          if [ -n "$ORACLE_KEYSTORE_BASE64" ] && [ -n "$ORACLE_KEYSTORE_PASSWORD" ] && [ -n "$ORACLE_KEY_ALIAS" ] && [ -n "$ORACLE_KEY_PASSWORD" ]; then
            echo "$ORACLE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/oracle-release.jks"
            {
              echo "ORACLE_KEYSTORE_FILE=$RUNNER_TEMP/oracle-release.jks"
              echo "ORACLE_KEYSTORE_PASSWORD=$ORACLE_KEYSTORE_PASSWORD"
              echo "ORACLE_KEY_ALIAS=$ORACLE_KEY_ALIAS"
              echo "ORACLE_KEY_PASSWORD=$ORACLE_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Verify APK
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK"

      - name: Upload B514 FINAL APK
        uses: actions/upload-artifact@v4
        with:
          name: Oracle-APK-B514-FINAL-installable
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
