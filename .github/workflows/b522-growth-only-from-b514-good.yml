# B514 build: source-of-truth main; Analysis immutable; Growth-only patch.
name: B514 FINAL APK

on:
  push:
    branches:
      - main
    paths:
      - scripts/b514_build_growth.py
      - .github/workflows/b522-growth-only-from-b514-good.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  ORACLE_KEYSTORE_BASE64: ${{ secrets.ORACLE_KEYSTORE_BASE64 }}
  ORACLE_KEYSTORE_PASSWORD: ${{ secrets.ORACLE_KEYSTORE_PASSWORD }}
  ORACLE_KEY_ALIAS: ${{ secrets.ORACLE_KEY_ALIAS }}
  ORACLE_KEY_PASSWORD: ${{ secrets.ORACLE_KEY_PASSWORD }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify build is using current main
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - name: Verify canonical Analysis source before Growth patch
        run: |
          set -euo pipefail
          ANALYSIS=app/src/main/java/ro/alintudor/oracle/nativeui/OracleAnalysisModules.kt
          test -f "$ANALYSIS"
          test "$(git hash-object "$ANALYSIS")" = "76210ed4db93147487bc59e01ced70ae54f44ff6"

      - name: Apply B514 Growth-only patch
        run: python3 scripts/b514_build_growth.py

      - name: HARD VERIFY Analysis is byte-for-byte unchanged
        run: |
          set -euo pipefail
          ANALYSIS=app/src/main/java/ro/alintudor/oracle/nativeui/OracleAnalysisModules.kt
          test "$(git hash-object "$ANALYSIS")" = "76210ed4db93147487bc59e01ced70ae54f44ff6"
          grep -q 'if (key != "growth")' app/src/main/java/ro/alintudor/oracle/MainActivity.kt
          grep -q 'BUILD B514 • V6g-FINAL' app/src/main/java/ro/alintudor/oracle/nativeui/OracleGrowthModule.kt
          grep -q "versionName 'V6g-FINAL-B514'" app/build.gradle
          grep -q 'versionCode 35' app/build.gradle
          git diff --check

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Prepare production signing key
        run: |
          set -euo pipefail
          if [ -n "$ORACLE_KEYSTORE_BASE64" ] && [ -n "$ORACLE_KEYSTORE_PASSWORD" ] && [ -n "$ORACLE_KEY_ALIAS" ] && [ -n "$ORACLE_KEY_PASSWORD" ]; then
            echo "$ORACLE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/oracle-release.jks"
            {
              echo "ORACLE_KEYSTORE_FILE=$RUNNER_TEMP/oracle-release.jks"
              echo "ORACLE_KEYSTORE_PASSWORD=$ORACLE_KEYSTORE_PASSWORD"
              echo "ORACLE_KEY_ALIAS=$ORACLE_KEY_ALIAS"
              echo "ORACLE_KEY_PASSWORD=$ORACLE_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
          fi
      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Verify APK
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK"
          BADGING="$($ANDROID_HOME/build-tools/36.0.0/aapt dump badging "$APK")"
          printf '%s\n' "$BADGING" | grep -q "versionName='V6g-FINAL-B514'"
          printf '%s\n' "$BADGING" | grep -q "versionCode='35'"
      - name: Upload ONLY B514 FINAL APK
        uses: actions/upload-artifact@v4
        with:
          name: Oracle-APK-B514-FINAL-installable
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
