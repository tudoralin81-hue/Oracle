name: B514 FINAL APK

'on': [push, workflow_dispatch]

permissions:
  contents: read

env:
  BASE_COMMIT: e1195536704f375f6a44f1ae5985bc464671ec0b
  ORACLE_KEYSTORE_BASE64: ${{ secrets.ORACLE_KEYSTORE_BASE64 }}
  ORACLE_KEYSTORE_PASSWORD: ${{ secrets.ORACLE_KEYSTORE_PASSWORD }}
  ORACLE_KEY_ALIAS: ${{ secrets.ORACLE_KEY_ALIAS }}
  ORACLE_KEY_PASSWORD: ${{ secrets.ORACLE_KEY_PASSWORD }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact B514 #77 baseline
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_COMMIT }}
          fetch-depth: 0

      - name: Verify Analysis baseline
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASE_COMMIT"
          test "$(git hash-object app/src/main/java/ro/alintudor/oracle/nativeui/OracleAnalysisModules.kt)" = "76210ed4db93147487bc59e01ced70ae54f44ff6"

      - name: Patch Growth only
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('app/src/main/java/ro/alintudor/oracle/core/OracleGrowthLiveData.kt')
          s = p.read_text(encoding='utf-8')
          start = s.index('    fun refresh(')
          end = s.index('\n    private fun currentGrowthAnchor', start)
          s = s[:start] + '''    fun refresh(items: List<OracleGrowthRecommendation>): List<OracleGrowthRecommendation> {
        if (items.isEmpty()) return emptyList()
        return items.filter { it.referenceTimestamp > 0L }
    }
''' + s[s.index('\n}', end):]
          p.write_text(s, encoding='utf-8')

          p = Path('app/src/main/java/ro/alintudor/oracle/MainActivity.kt')
          s = p.read_text(encoding='utf-8')
          old = '        runCatching{renderModule(key,false)}.onFailure{showModuleError(key,it)}'
          new = '''        if (key != "growth") {
            runCatching{renderModule(key,false)}.onFailure{showModuleError(key,it)}
        }'''
          if old not in s: raise SystemExit('Growth initial-render anchor not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

          p = Path('app/src/main/java/ro/alintudor/oracle/nativeui/OracleGrowthModule.kt')
          s = p.read_text(encoding='utf-8')
          old = '''        if (items.isEmpty()) {
            host.addCard("GROWTH", "Nu există încă un snapshot Growth local. Refresh va afișa ultimul rezultat Oracle disponibil.")
            return
        }'''
          new = '''        if (items.isEmpty()) {
            host.addCard("GROWTH", "Se încarcă snapshot-ul Growth al sesiunii curente…")
            addBuildFooter()
            return
        }'''
          if old not in s: raise SystemExit('Growth empty-state anchor not found')
          s = s.replace(old, new, 1)
          old = '''        addNews(ordered, fallbackNews)
        addHistory(items)
    }'''
          new = '''        addNews(ordered, fallbackNews)
        addHistory(items)
        addBuildFooter()
    }

    private fun addBuildFooter() {
        host.content.addView(text("BUILD B514 • V6g-FINAL", 9f, Typeface.DEFAULT_BOLD, Color.rgb(125, 135, 155), host.dp(4), 8), LinearLayout.LayoutParams(-1, -2).apply {
            setMargins(0, 0, 0, host.dp(18))
        })
    }'''
          if old not in s: raise SystemExit('Growth footer anchor not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

          p = Path('app/build.gradle')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'versionCode\s+\d+', 'versionCode 35', s, count=1)
          s = re.sub(r"versionName\s+'[^']+'", "versionName 'V6g-FINAL-B514'", s, count=1)
          p.write_text(s, encoding='utf-8')
          PY
          git diff --check

      - name: HARD VERIFY Analysis untouched
        run: |
          set -euo pipefail
          test "$(git hash-object app/src/main/java/ro/alintudor/oracle/nativeui/OracleAnalysisModules.kt)" = "76210ed4db93147487bc59e01ced70ae54f44ff6"
          test "$(git show "$BASE_COMMIT:app/src/main/java/ro/alintudor/oracle/nativeui/OracleAnalysisModules.kt" | git hash-object --stdin)" = "76210ed4db93147487bc59e01ced70ae54f44ff6"
          grep -q 'return items.filter { it.referenceTimestamp > 0L }' app/src/main/java/ro/alintudor/oracle/core/OracleGrowthLiveData.kt
          grep -q 'if (key != "growth")' app/src/main/java/ro/alintudor/oracle/MainActivity.kt
          grep -q 'BUILD B514 • V6g-FINAL' app/src/main/java/ro/alintudor/oracle/nativeui/OracleGrowthModule.kt
          grep -q 'versionCode 35' app/build.gradle
          grep -q "versionName 'V6g-FINAL-B514'" app/build.gradle

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Prepare production signing key
        run: |
          set -euo pipefail
          if [ -n "$ORACLE_KEYSTORE_BASE64" ] && [ -n "$ORACLE_KEYSTORE_PASSWORD" ] && [ -n "$ORACLE_KEY_ALIAS" ] && [ -n "$ORACLE_KEY_PASSWORD" ]; then
            echo "$ORACLE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/oracle-release.jks"
            echo "ORACLE_KEYSTORE_FILE=$RUNNER_TEMP/oracle-release.jks" >> "$GITHUB_ENV"
            echo "ORACLE_KEYSTORE_PASSWORD=$ORACLE_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "ORACLE_KEY_ALIAS=$ORACLE_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "ORACLE_KEY_PASSWORD=$ORACLE_KEY_PASSWORD" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Verify APK
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK"

      - name: Upload B514 FINAL APK
        uses: actions/upload-artifact@v4
        with:
          name: Oracle-APK-B514-FINAL-installable
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
