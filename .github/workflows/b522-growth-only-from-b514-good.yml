name: B514 FINAL APK

'on':
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  BASE_COMMIT: e1195536704f375f6a44f1ae5985bc464671ec0b
  ORACLE_KEYSTORE_BASE64: ${{ secrets.ORACLE_KEYSTORE_BASE64 }}
  ORACLE_KEYSTORE_PASSWORD: ${{ secrets.ORACLE_KEYSTORE_PASSWORD }}
  ORACLE_KEY_ALIAS: ${{ secrets.ORACLE_KEY_ALIAS }}
  ORACLE_KEY_PASSWORD: ${{ secrets.ORACLE_KEY_PASSWORD }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout EXACT B514-good base
        uses: actions/checkout@v4
        with:
          ref: e1195536704f375f6a44f1ae5985bc464671ec0b
          fetch-depth: 1

      - name: Assert Analysis is untouched B514-good
        run: |
          set -euo pipefail
          git status --short
          test "$(git rev-parse HEAD)" = "$BASE_COMMIT"
          test "$(git hash-object app/src/main/java/ro/alintudor/oracle/nativeui/OracleAnalysisModules.kt)" = "76210ed4db93147487bc59e01ced70ae54f44ff6"

      - name: Apply ONLY Growth initial-render, snapshot and footer patch
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          main = Path('app/src/main/java/ro/alintudor/oracle/MainActivity.kt')
          growth = Path('app/src/main/java/ro/alintudor/oracle/nativeui/OracleGrowthModule.kt')
          live = Path('app/src/main/java/ro/alintudor/oracle/core/OracleGrowthLiveData.kt')
          gradle = Path('app/build.gradle')

          s = main.read_text(encoding='utf-8')
          old = '    private fun openModule(key:String){\\n        currentModule=key\\n        runCatching{renderModule(key,false)}.onFailure{showModuleError(key,it)}\\n        if (key == "analysis") return\\n'
          new = '    private fun openModule(key:String){\\n        currentModule=key\\n        if (key != "growth") {\\n            runCatching{renderModule(key,false)}.onFailure{showModuleError(key,it)}\\n        }\\n        if (key == "analysis") return\\n'
          if old not in s: raise SystemExit('MainActivity openModule baseline not found')
          main.write_text(s.replace(old,new,1), encoding='utf-8')

          s = live.read_text(encoding='utf-8')
          old = '    fun refresh(items: List<OracleGrowthRecommendation>): List<OracleGrowthRecommendation> {\\n        if (items.isEmpty()) return emptyList()\\n        if (items.any { it.referenceTimestamp <= 0L }) return emptyList()\\n        val expectedAnchor = currentGrowthAnchor(System.currentTimeMillis())\\n        if (items.any { it.referenceTimestamp != expectedAnchor }) return emptyList()\\n        return items\\n    }\\n\\n    private fun currentGrowthAnchor(nowMillis: Long): Long {\\n        val now = Instant.ofEpochMilli(nowMillis).atZone(BUCHAREST)\\n        var date = if (now.toLocalTime().isBefore(LocalTime.of(16, 0))) now.toLocalDate().minusDays(1) else now.toLocalDate()\\n        while (!OracleMarketCalendar.isTradingDay(date)) date = date.minusDays(1)\\n        return ZonedDateTime.of(date, LocalTime.of(16, 0), BUCHAREST).toInstant().toEpochMilli()\\n    }'
          new = '    fun refresh(items: List<OracleGrowthRecommendation>): List<OracleGrowthRecommendation> {\\n        if (items.isEmpty()) return emptyList()\\n        return items.filter { it.referenceTimestamp > 0L }\\n    }'
          if old not in s: raise SystemExit('GrowthLiveData snapshot gate not found')
          live.write_text(s.replace(old,new,1), encoding='utf-8')

          s = growth.read_text(encoding='utf-8')
          old = '        if (items.isEmpty()) {\\n            host.addCard("GROWTH", "Nu există încă un snapshot Growth local. Refresh va afișa ultimul rezultat Oracle disponibil.")\\n            return\\n        }'
          new = '        if (items.isEmpty()) {\\n            host.addCard("GROWTH", "Se încarcă snapshot-ul Growth al sesiunii curente…")\\n            addBuildFooter()\\n            return\\n        }'
          if old not in s: raise SystemExit('Growth empty-state anchor not found')
          s = s.replace(old,new,1)
          old = '        addNews(ordered, fallbackNews)\\n        addHistory(items)\\n    }\\n'
          new = '        addNews(ordered, fallbackNews)\\n        addHistory(items)\\n        addBuildFooter()\\n    }\\n\\n    private fun addBuildFooter() {\\n        host.content.addView(text("BUILD B514 • V6g-FINAL", 9f, Typeface.DEFAULT_BOLD, Color.rgb(125, 135, 155), host.dp(4), 8), LinearLayout.LayoutParams(-1, -2).apply {\\n            setMargins(0, 0, 0, host.dp(18))\\n        })\\n    }\\n'
          if old not in s: raise SystemExit('Growth footer insertion point not found')
          growth.write_text(s.replace(old,new,1), encoding='utf-8')

          s = gradle.read_text(encoding='utf-8')
          s = re.sub(r'versionCode\\s+\\d+', 'versionCode 35', s, count=1)
          s = re.sub(r"versionName\\s+'[^']+'", "versionName 'V6g-FINAL-B514'", s, count=1)
          gradle.write_text(s, encoding='utf-8')
          PY
          git diff --check

      - name: HARD VERIFY Analysis unchanged
        run: |
          set -euo pipefail
          git diff --name-only
          test "$(git hash-object app/src/main/java/ro/alintudor/oracle/nativeui/OracleAnalysisModules.kt)" = "76210ed4db93147487bc59e01ced70ae54f44ff6"
          if git diff --name-only | grep -q '^app/src/main/java/ro/alintudor/oracle/nativeui/OracleSimpleModule.kt$'; then exit 1; fi
          grep -q 'return items.filter { it.referenceTimestamp > 0L }' app/src/main/java/ro/alintudor/oracle/core/OracleGrowthLiveData.kt
          grep -q 'BUILD B514 • V6g-FINAL' app/src/main/java/ro/alintudor/oracle/nativeui/OracleGrowthModule.kt
          grep -q 'if (key != "growth")' app/src/main/java/ro/alintudor/oracle/MainActivity.kt
          grep -q 'versionCode 35' app/build.gradle
          grep -q "versionName 'V6g-FINAL-B514'" app/build.gradle

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Prepare production signing key
        run: |
          set -euo pipefail
          if [ -n "$ORACLE_KEYSTORE_BASE64" ] && [ -n "$ORACLE_KEYSTORE_PASSWORD" ] && [ -n "$ORACLE_KEY_ALIAS" ] && [ -n "$ORACLE_KEY_PASSWORD" ]; then
            echo "$ORACLE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/oracle-release.jks"
            {
              echo "ORACLE_KEYSTORE_FILE=$RUNNER_TEMP/oracle-release.jks"
              echo "ORACLE_KEYSTORE_PASSWORD=$ORACLE_KEYSTORE_PASSWORD"
              echo "ORACLE_KEY_ALIAS=$ORACLE_KEY_ALIAS"
              echo "ORACLE_KEY_PASSWORD=$ORACLE_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Verify APK
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK"

      - name: Upload B514 FINAL APK
        uses: actions/upload-artifact@v4
        with:
          name: Oracle-APK-B514-FINAL-installable
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
