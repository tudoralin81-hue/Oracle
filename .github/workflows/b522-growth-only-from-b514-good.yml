name: B514 FINAL APK

on:
  push:
    branches:
      - main
    paths:
      - scripts/b514_build_growth.py
  workflow_dispatch:

permissions:
  contents: read

env:
  BASE_COMMIT: e1195536704f375f6a44f1ae5985bc464671ec0b
  ORACLE_KEYSTORE_BASE64: ${{ secrets.ORACLE_KEYSTORE_BASE64 }}
  ORACLE_KEYSTORE_PASSWORD: ${{ secrets.ORACLE_KEYSTORE_PASSWORD }}
  ORACLE_KEY_ALIAS: ${{ secrets.ORACLE_KEY_ALIAS }}
  ORACLE_KEY_PASSWORD: ${{ secrets.ORACLE_KEY_PASSWORD }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact B514 Analysis base
        uses: actions/checkout@v4
        with:
          ref: e1195536704f375f6a44f1ae5985bc464671ec0b
          fetch-depth: 0

      - name: Verify exact B514 base
        run: test "$(git rev-parse HEAD)" = "e1195536704f375f6a44f1ae5985bc464671ec0b"

      - name: Import current Growth implementation only
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git checkout origin/main -- \
            app/src/main/java/ro/alintudor/oracle/nativeui/OracleGrowthModule.kt \
            app/src/main/java/ro/alintudor/oracle/nativeui/OracleNativeModule.kt \
            app/src/main/java/ro/alintudor/oracle/core/OracleGrowthLiveData.kt \
            app/src/main/java/ro/alintudor/oracle/core/OracleLocalProcessor.kt \
            app/src/main/java/ro/alintudor/oracle/core/OracleMarketCalendar.kt

      - name: Apply B514 Growth-only script
        run: python3 scripts/b514_build_growth.py

      - name: HARD VERIFY Analysis locked to e119553 except build footer
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          p = Path('app/src/main/java/ro/alintudor/oracle/nativeui/OracleAnalysisModules.kt')
          actual = p.read_text(encoding='utf-8')
          base = subprocess.check_output(['git','show','e1195536704f375f6a44f1ae5985bc464671ec0b:app/src/main/java/ro/alintudor/oracle/nativeui/OracleAnalysisModules.kt'], text=True)
          if actual.replace('ORACLE • V6g-FINAL-B514','ORACLE • V6g-FINAL-BUILD') != base.replace('ORACLE • V6g-FINAL-B513','ORACLE • V6g-FINAL-BUILD'):
              raise SystemExit('Analysis changed beyond the build footer')
          if actual.count('ORACLE • V6g-FINAL-B514') != 1:
              raise SystemExit('Analysis B514 footer missing or duplicated')
          PY
          grep -q 'BUILD B514' app/src/main/java/ro/alintudor/oracle/nativeui/OracleGrowthModule.kt
          grep -q "versionName 'V6g-FINAL-B514'" app/build.gradle

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Prepare production signing key
        run: |
          set -euo pipefail
          if [ -n "$ORACLE_KEYSTORE_BASE64" ] && [ -n "$ORACLE_KEYSTORE_PASSWORD" ] && [ -n "$ORACLE_KEY_ALIAS" ] && [ -n "$ORACLE_KEY_PASSWORD" ]; then
            echo "$ORACLE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/oracle-release.jks"
            {
              echo "ORACLE_KEYSTORE_FILE=$RUNNER_TEMP/oracle-release.jks"
              echo "ORACLE_KEYSTORE_PASSWORD=$ORACLE_KEYSTORE_PASSWORD"
              echo "ORACLE_KEY_ALIAS=$ORACLE_KEY_ALIAS"
              echo "ORACLE_KEY_PASSWORD=$ORACLE_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
          fi
      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Verify APK
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK"
          unzip -p "$APK" classes.dex | strings | grep -q 'V6g-FINAL-B514'
          unzip -p "$APK" classes.dex | strings | grep -q 'BUILD B514'
      - name: Upload ONLY B514 FINAL APK
        uses: actions/upload-artifact@v4
        with:
          name: Oracle-APK-B514-FINAL-installable
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
