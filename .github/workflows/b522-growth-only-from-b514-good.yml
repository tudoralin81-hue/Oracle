name: B514 FINAL APK

'on':
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  BASE_COMMIT: e1195536704f375f6a44f1ae5985bc464671ec0b
  ORACLE_KEYSTORE_BASE64: ${{ secrets.ORACLE_KEYSTORE_BASE64 }}
  ORACLE_KEYSTORE_PASSWORD: ${{ secrets.ORACLE_KEYSTORE_PASSWORD }}
  ORACLE_KEY_ALIAS: ${{ secrets.ORACLE_KEY_ALIAS }}
  ORACLE_KEY_PASSWORD: ${{ secrets.ORACLE_KEY_PASSWORD }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact B514 Analysis base
        uses: actions/checkout@v4
        with:
          ref: e1195536704f375f6a44f1ae5985bc464671ec0b
          fetch-depth: 0

      - name: Verify exact B514 base
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "e1195536704f375f6a44f1ae5985bc464671ec0b"

      - name: Import ONLY current Growth implementation
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git checkout origin/main -- \
            app/src/main/java/ro/alintudor/oracle/nativeui/OracleGrowthModule.kt \
            app/src/main/java/ro/alintudor/oracle/nativeui/OracleNativeModule.kt \
            app/src/main/java/ro/alintudor/oracle/core/OracleGrowthLiveData.kt \
            app/src/main/java/ro/alintudor/oracle/core/OracleLocalProcessor.kt \
            app/src/main/java/ro/alintudor/oracle/core/OracleMarketCalendar.kt

      - name: Apply Growth-only patch and B514 version marker
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          analysis = Path('app/src/main/java/ro/alintudor/oracle/nativeui/OracleAnalysisModules.kt')
          main = Path('app/src/main/java/ro/alintudor/oracle/MainActivity.kt')
          live = Path('app/src/main/java/ro/alintudor/oracle/core/OracleGrowthLiveData.kt')
          growth = Path('app/src/main/java/ro/alintudor/oracle/nativeui/OracleGrowthModule.kt')
          gradle = Path('app/build.gradle')

          # Analysis is LOCKED: the only permitted Analysis edit is the visible build marker.
          s = analysis.read_text(encoding='utf-8')
          if s.count('ORACLE • V6g-FINAL-B513') != 1:
              raise SystemExit('Expected exactly one B513 Analysis footer in the e119553 base')
          s = s.replace('ORACLE • V6g-FINAL-B513', 'ORACLE • V6g-FINAL-B514', 1)
          analysis.write_text(s, encoding='utf-8')

          s = main.read_text(encoding='utf-8')
          old = '''    private fun openModule(key:String){
        currentModule=key
        runCatching{renderModule(key,false)}.onFailure{showModuleError(key,it)}
        if (key == "analysis") return
'''
          new = '''    private fun openModule(key:String){
        currentModule=key
        if (key != "growth") {
            runCatching{renderModule(key,false)}.onFailure{showModuleError(key,it)}
        }
        if (key == "analysis") return
'''
          if old not in s:
              raise SystemExit('MainActivity Growth render anchor not found')
          main.write_text(s.replace(old, new, 1), encoding='utf-8')

          s = live.read_text(encoding='utf-8')
          old = '''    fun refresh(items: List<OracleGrowthRecommendation>): List<OracleGrowthRecommendation> {
        if (items.isEmpty()) return emptyList()
        if (items.any { it.referenceTimestamp <= 0L }) return emptyList()
        val expectedAnchor = currentGrowthAnchor(System.currentTimeMillis())
        if (items.any { it.referenceTimestamp != expectedAnchor }) return emptyList()
        return items
    }

    private fun currentGrowthAnchor(nowMillis: Long): Long {
        val now = Instant.ofEpochMilli(nowMillis).atZone(BUCHAREST)
        var date = if (now.toLocalTime().isBefore(LocalTime.of(16, 0))) now.toLocalDate().minusDays(1) else now.toLocalDate()
        while (!OracleMarketCalendar.isTradingDay(date)) date = date.minusDays(1)
        return ZonedDateTime.of(date, LocalTime.of(16, 0), BUCHAREST).toInstant().toEpochMilli()
    }'''
          new = '''    fun refresh(items: List<OracleGrowthRecommendation>): List<OracleGrowthRecommendation> {
        if (items.isEmpty()) return emptyList()
        return items.filter { it.referenceTimestamp > 0L }
    }'''
          if old not in s:
              raise SystemExit('GrowthLiveData snapshot gate not found')
          live.write_text(s.replace(old, new, 1), encoding='utf-8')

          s = growth.read_text(encoding='utf-8')
          old = '''        if (items.isEmpty()) {
            host.addCard("GROWTH", "Nu există încă un snapshot Growth local. Refresh va afișa ultimul rezultat Oracle disponibil.")
            return
        }
'''
          new = '''        if (items.isEmpty()) {
            host.addCard("GROWTH", "Se încarcă snapshot-ul Growth al sesiunii curente…")
            addBuildFooter()
            return
        }
'''
          if old not in s:
              raise SystemExit('Growth empty-state anchor not found')
          s = s.replace(old, new, 1)
          old = '''        addNews(ordered, fallbackNews)
        addHistory(items)
    }
'''
          new = '''        addNews(ordered, fallbackNews)
        addHistory(items)
        addBuildFooter()
    }

    private fun addBuildFooter() {
        host.content.addView(text("BUILD B514 • V6g-FINAL", 9f, Typeface.DEFAULT_BOLD, Color.rgb(125, 135, 155), host.dp(4), 8), LinearLayout.LayoutParams(-1, -2).apply {
            setMargins(0, 0, 0, host.dp(18))
        })
    }
'''
          if old not in s:
              raise SystemExit('Growth footer anchor not found')
          growth.write_text(s.replace(old, new, 1), encoding='utf-8')

          s = gradle.read_text(encoding='utf-8')
          s = re.sub(r'versionCode\s+\d+', 'versionCode 32', s, count=1)
          s = re.sub(r"versionName\s+'[^']+'", "versionName 'V6g-FINAL-B514'", s, count=1)
          gradle.write_text(s, encoding='utf-8')
          PY
          git diff --check

      - name: HARD VERIFY Analysis is locked
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          p = Path('app/src/main/java/ro/alintudor/oracle/nativeui/OracleAnalysisModules.kt')
          actual = p.read_text(encoding='utf-8')
          baseline = subprocess.check_output(['git','show','e1195536704f375f6a44f1ae5985bc464671ec0b:app/src/main/java/ro/alintudor/oracle/nativeui/OracleAnalysisModules.kt'], text=True)
          norm_actual = actual.replace('ORACLE • V6g-FINAL-B514','ORACLE • V6g-FINAL-BUILD')
          norm_base = baseline.replace('ORACLE • V6g-FINAL-B513','ORACLE • V6g-FINAL-BUILD')
          if norm_actual != norm_base:
              raise SystemExit('FAIL: Analysis differs from exact e119553 baseline beyond build footer')
          if actual.count('ORACLE • V6g-FINAL-B514') != 1:
              raise SystemExit('FAIL: Analysis B514 footer missing or duplicated')
          print('PASS: Analysis byte-equivalent to e119553 after normalizing only the build footer.')
          PY
          grep -q 'BUILD B514 • V6g-FINAL' app/src/main/java/ro/alintudor/oracle/nativeui/OracleGrowthModule.kt
          grep -q "versionName 'V6g-FINAL-B514'" app/build.gradle
          grep -q 'versionCode 32' app/build.gradle

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Prepare production signing key
        run: |
          set -euo pipefail
          if [ -n "$ORACLE_KEYSTORE_BASE64" ] && [ -n "$ORACLE_KEYSTORE_PASSWORD" ] && [ -n "$ORACLE_KEY_ALIAS" ] && [ -n "$ORACLE_KEY_PASSWORD" ]; then
            echo "$ORACLE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/oracle-release.jks"
            {
              echo "ORACLE_KEYSTORE_FILE=$RUNNER_TEMP/oracle-release.jks"
              echo "ORACLE_KEYSTORE_PASSWORD=$ORACLE_KEYSTORE_PASSWORD"
              echo "ORACLE_KEY_ALIAS=$ORACLE_KEY_ALIAS"
              echo "ORACLE_KEY_PASSWORD=$ORACLE_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
          fi
      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Verify APK
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK"
          unzip -p "$APK" classes.dex | strings | grep -q 'V6g-FINAL-B514'
          unzip -p "$APK" classes.dex | strings | grep -q 'BUILD B514'
          echo "APK verified: B514"
      - name: Upload ONLY B514 FINAL APK
        uses: actions/upload-artifact@v4
        with:
          name: Oracle-APK-B514-FINAL-installable
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
