name: Oracle B540 Growth Real Fix
# This workflow builds the Claude B540 source snapshot.
# Only the requested GROWTH loader/history patch is applied at build time.
# START and all non-GROWTH modules remain protected by the frozen manifest.
# BUILD TRIGGER: exact Claude snapshot reproduction + release APK.
#
on:
  push:
    branches:
      - B540-CLAUDE-V2-EXACT
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify frozen (non-GROWTH) files are byte-identical to B539
        run: |
          set -euo pipefail
          sha256sum -c B540_FROZEN_MANIFEST.sha256 --strict

      - name: Verify GROWTH source markers
        run: |
          set -euo pipefail
          E=app/src/main/java/ro/alintudor/oracle/core/OracleGrowthEngine.kt
          M=app/src/main/java/ro/alintudor/oracle/nativeui/OracleGrowthModule.kt
          MD=app/src/main/java/ro/alintudor/oracle/core/OracleMarketData.kt
          U=app/src/main/java/ro/alintudor/oracle/core/OracleSP500Universe.kt
          grep -Fq 'TARGET_SIZE = 500' "$U"
          grep -Fq 'fun companies(context: Context)' "$U"
          grep -Fq 'fun fetchDailyBatch' "$MD"
          grep -Fq 'OracleGrowthPhase' "$E"
          grep -Fq 'TOTAL_BUDGET_NANOS' "$E"
          grep -Fq 'OracleGrowthPhase.NO_DATA' "$M"
          test -f app/src/main/assets/sp500_universe.json
          [ "$(python3 -c "import json;print(len(json.load(open('app/src/main/assets/sp500_universe.json'))))")" = "500" ]

      - name: Reproduce exact Claude GROWTH files
        run: |
          set -euo pipefail
          python3 scripts/b540_growth_history_toggle.py
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          expected = {
            'app/src/main/java/ro/alintudor/oracle/core/OracleGrowthEngine.kt': '683eea654306692a0d207cae5109dc4c51897b83',
            'app/src/main/java/ro/alintudor/oracle/nativeui/OracleGrowthModule.kt': 'd087f7e508daff3f54b3e29eb7cb96892dc08e82',
          }
          for path, want in expected.items():
              data = Path(path).read_bytes()
              got = hashlib.sha1(f'blob {len(data)}\\0'.encode() + data).hexdigest()
              assert got == want, f'{path}: {got} != {want}'
          print('EXACT CLAUDE SNAPSHOT: PASS')
          PY
          git diff --check

      - name: Set B540 identity
        run: |
          set -euo pipefail
          grep -Fq "versionCode 30" app/build.gradle
          grep -Fq "versionName 'B540'" app/build.gradle

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Build release APK
        env:
          ORACLE_KEYSTORE_FILE: ${{ secrets.ORACLE_KEYSTORE_FILE }}
          ORACLE_KEYSTORE_PASSWORD: ${{ secrets.ORACLE_KEYSTORE_PASSWORD }}
          ORACLE_KEY_ALIAS: ${{ secrets.ORACLE_KEY_ALIAS }}
          ORACLE_KEY_PASSWORD: ${{ secrets.ORACLE_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Verify APK signature and version, re-check frozen files post-build
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          BADGING="$($ANDROID_HOME/build-tools/36.0.0/aapt dump badging "$APK")"
          echo "$BADGING" | grep -Fq "versionCode='30'"
          echo "$BADGING" | grep -Fq "versionName='B540'"
          sha256sum -c B540_FROZEN_MANIFEST.sha256 --strict
          sha256sum "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: Oracle-APK-B540-GROWTH-REAL-FIX
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
