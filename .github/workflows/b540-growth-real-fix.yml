name: Oracle B540 Growth Real Fix
on:
  push:
    branches:
      - B540-CLAUDE-V2-EXACT
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify frozen files
        run: sha256sum -c B540_FROZEN_MANIFEST.sha256 --strict
      - name: Apply Claude GROWTH loader and 45s budget
        run: |
          set -euo pipefail
          python3 scripts/b540_growth_history_toggle.py
          grep -Fq 'DATE ÎNCĂRCATE: $pct%' app/src/main/java/ro/alintudor/oracle/nativeui/OracleGrowthModule.kt
          grep -Fq 'Maxim țintă: 45 secunde' app/src/main/java/ro/alintudor/oracle/nativeui/OracleGrowthModule.kt
          grep -Fq '44_000_000_000L' app/src/main/java/ro/alintudor/oracle/core/OracleGrowthEngine.kt
          grep -Fq '30_000_000_000L' app/src/main/java/ro/alintudor/oracle/core/OracleGrowthEngine.kt
          git diff --check
      - name: Set B540 identity
        run: |
          grep -Fq "versionCode 30" app/build.gradle
          grep -Fq "versionName 'B540'" app/build.gradle
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Build release APK
        env:
          ORACLE_KEYSTORE_FILE: ${{ secrets.ORACLE_KEYSTORE_FILE }}
          ORACLE_KEYSTORE_PASSWORD: ${{ secrets.ORACLE_KEYSTORE_PASSWORD }}
          ORACLE_KEY_ALIAS: ${{ secrets.ORACLE_KEY_ALIAS }}
          ORACLE_KEY_PASSWORD: ${{ secrets.ORACLE_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Verify APK and frozen files
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          BADGING="$($ANDROID_HOME/build-tools/36.0.0/aapt dump badging "$APK")"
          echo "$BADGING" | grep -Fq "versionCode='30'"
          echo "$BADGING" | grep -Fq "versionName='B540'"
          sha256sum -c B540_FROZEN_MANIFEST.sha256 --strict
          sha256sum "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: Oracle-APK-B540-GROWTH-REAL-FIX
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
