name: Oracle B536 Growth Final

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  ORACLE_KEYSTORE_BASE64: ${{ secrets.ORACLE_KEYSTORE_BASE64 }}
  ORACLE_KEYSTORE_PASSWORD: ${{ secrets.ORACLE_KEYSTORE_PASSWORD }}
  ORACLE_KEY_ALIAS: ${{ secrets.ORACLE_KEY_ALIAS }}
  ORACLE_KEY_PASSWORD: ${{ secrets.ORACLE_KEY_PASSWORD }}

jobs:
  growth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - name: Verify protected modules before build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/oracle-freeze
          for f in app/src/main/java/ro/alintudor/oracle/OracleMysticStartView.kt app/src/main/java/ro/alintudor/oracle/nativeui/OracleNewsModule.kt app/src/main/java/ro/alintudor/oracle/nativeui/OraclePortfolioModule.kt app/src/main/java/ro/alintudor/oracle/nativeui/OracleAlertsModule.kt app/src/main/java/ro/alintudor/oracle/nativeui/OracleAnalysisModules.kt app/src/main/java/ro/alintudor/oracle/core/OracleKnowledgeSync.kt; do test -f "$f"; git hash-object "$f"; done > /tmp/oracle-freeze/protected.before.sha
      - name: Verify Growth implementation
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'ULTIMELE RECOMANDĂRI' app/src/main/java/ro/alintudor/oracle/nativeui/OracleGrowthModule.kt
          grep -q 'take(6)' app/src/main/java/ro/alintudor/oracle/nativeui/OracleGrowthModule.kt
          grep -q '31.08.2026' app/src/main/java/ro/alintudor/oracle/nativeui/OracleGrowthModule.kt
          grep -q '⌄' app/src/main/java/ro/alintudor/oracle/nativeui/OracleGrowthModule.kt
          grep -q 'setImageResource(ro.alintudor.oracle.R.drawable.ic_oracle)' app/src/main/java/ro/alintudor/oracle/nativeui/OracleGrowthModule.kt
          grep -q 'OracleRealData.fundamentals' app/src/main/java/ro/alintudor/oracle/core/OracleGrowthEngine.kt
          grep -q 'OracleRealData.newsContext' app/src/main/java/ro/alintudor/oracle/core/OracleGrowthEngine.kt
          grep -q 'OracleRealData.marketContext' app/src/main/java/ro/alintudor/oracle/core/OracleGrowthEngine.kt
          grep -q 'refreshGrowthOnly(repository)' app/src/main/java/ro/alintudor/oracle/OracleMysticActivity.kt
          git diff --check
      - name: Apply Growth corrections
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          
          # Guarantee a real company name even when the repository metadata contains only the ticker.
          p=Path('app/src/main/java/ro/alintudor/oracle/core/OracleGrowthEngine.kt')
          s=p.read_text(encoding='utf-8')
          old='val company=meta?.company?.takeIf { it.isNotBlank() && !it.equals(pick.ticker,true) } ?: lookupCompanyName(pick.ticker) ?: pick.ticker'
          new='val company=knownCompanyName(pick.ticker, meta?.company) ?: lookupCompanyName(pick.ticker) ?: "Company ${pick.ticker}"'
          if old not in s: raise SystemExit('company assignment anchor not found')
          s=s.replace(old,new)
          anchor='private fun lookupCompanyName(ticker:String):String? = runCatching {'
          helper='''private fun knownCompanyName(ticker:String, metadata:String?):String? {\n        val key=ticker.uppercase(Locale.US)\n        val known=when(key){\n            "CF" -> "CF Industries Holdings, Inc."\n            "LNG" -> "Cheniere Energy, Inc."\n            "CRM" -> "Salesforce, Inc."\n            "NVDA" -> "NVIDIA Corporation"\n            "MSFT" -> "Microsoft Corporation"\n            "AAPL" -> "Apple Inc."\n            "AMZN" -> "Amazon.com, Inc."\n            "GOOGL","GOOG" -> "Alphabet Inc."\n            "META" -> "Meta Platforms, Inc."\n            "AMD" -> "Advanced Micro Devices, Inc."\n            "AVGO" -> "Broadcom Inc."\n            "PLTR" -> "Palantir Technologies Inc."\n            "ORCL" -> "Oracle Corporation"\n            "NOW" -> "ServiceNow, Inc."\n            "TSLA" -> "Tesla, Inc."\n            "VRT" -> "Vertiv Holdings Co"\n            "CEG" -> "Constellation Energy Corporation"\n            "MU" -> "Micron Technology, Inc."\n            "ANET" -> "Arista Networks, Inc."\n            "ADBE" -> "Adobe Inc."\n            "SNOW" -> "Snowflake Inc."\n            "DDOG" -> "Datadog, Inc."\n            "NET" -> "Cloudflare, Inc."\n            "PANW" -> "Palo Alto Networks, Inc."\n            "CRWD" -> "CrowdStrike Holdings, Inc."\n            "INTU" -> "Intuit Inc."\n            "IBM" -> "International Business Machines Corporation"\n            "CSCO" -> "Cisco Systems, Inc."\n            "QCOM" -> "QUALCOMM Incorporated"\n            "INTC" -> "Intel Corporation"\n            "AMAT" -> "Applied Materials, Inc."\n            "LRCX" -> "Lam Research Corporation"\n            "KLAC" -> "KLA Corporation"\n            "TSM" -> "Taiwan Semiconductor Manufacturing Company Limited"\n            "ASML" -> "ASML Holding N.V."\n            "JPM" -> "JPMorgan Chase & Co."\n            "BAC" -> "Bank of America Corporation"\n            "GS" -> "The Goldman Sachs Group, Inc."\n            "MS" -> "Morgan Stanley"\n            "BLK" -> "BlackRock, Inc."\n            "XOM" -> "Exxon Mobil Corporation"\n            "CVX" -> "Chevron Corporation"\n            "COP" -> "ConocoPhillips"\n            "SLB" -> "SLB"\n            "GE" -> "GE Aerospace"\n            "CAT" -> "Caterpillar Inc."\n            "HON" -> "Honeywell International Inc."\n            "RTX" -> "RTX Corporation"\n            "BA" -> "The Boeing Company"\n            "LLY" -> "Eli Lilly and Company"\n            "JNJ" -> "Johnson & Johnson"\n            "UNH" -> "UnitedHealth Group Incorporated"\n            "COST" -> "Costco Wholesale Corporation"\n            "WMT" -> "Walmart Inc."\n            "MCD" -> "McDonald's Corporation"\n            "NKE" -> "NIKE, Inc."\n            "DIS" -> "The Walt Disney Company"\n            "NFLX" -> "Netflix, Inc."\n            "UBER" -> "Uber Technologies, Inc."\n            "COIN" -> "Coinbase Global, Inc."\n            "HOOD" -> "Robinhood Markets, Inc."\n            else -> null\n        }\n        if(known!=null) return known\n        return metadata?.trim()?.takeIf { it.isNotBlank() && !it.equals(key,true) }\n    }\n\n    '''+anchor
          if anchor not in s: raise SystemExit('company helper anchor not found')
          s=s.replace(anchor,helper,1)
          p.write_text(s,encoding='utf-8')
          
          # Normalize legacy journal rows at display time so old ticker-only entries also show full names.
          p=Path('app/src/main/java/ro/alintudor/oracle/nativeui/OracleGrowthModule.kt')
          s=p.read_text(encoding='utf-8')
          old='identity.addView(text(item.company.ifBlank { "—" }, 11f, Typeface.DEFAULT_BOLD, white, 0, 0))'
          new='identity.addView(text(displayCompanyName(item.ticker,item.company), 11f, Typeface.DEFAULT_BOLD, white, 0, 0))'
          if old not in s: raise SystemExit('history company anchor not found')
          s=s.replace(old,new,1)
          anchor='private fun horizonOrder(horizon: String) = when (horizon.uppercase(Locale.US)) { "SHORT" -> 0; "MEDIUM" -> 1; else -> 2 }'
          helper='''private fun displayCompanyName(ticker:String, stored:String):String {\n        val key=ticker.uppercase(Locale.US)\n        val known=when(key){\n            "CF" -> "CF Industries Holdings, Inc."\n            "LNG" -> "Cheniere Energy, Inc."\n            "CRM" -> "Salesforce, Inc."\n            "NVDA" -> "NVIDIA Corporation"\n            "MSFT" -> "Microsoft Corporation"\n            "AAPL" -> "Apple Inc."\n            "AMZN" -> "Amazon.com, Inc."\n            "GOOGL","GOOG" -> "Alphabet Inc."\n            "META" -> "Meta Platforms, Inc."\n            "AMD" -> "Advanced Micro Devices, Inc."\n            "AVGO" -> "Broadcom Inc."\n            "PLTR" -> "Palantir Technologies Inc."\n            "ORCL" -> "Oracle Corporation"\n            "NOW" -> "ServiceNow, Inc."\n            "TSLA" -> "Tesla, Inc."\n            "VRT" -> "Vertiv Holdings Co"\n            "CEG" -> "Constellation Energy Corporation"\n            "MU" -> "Micron Technology, Inc."\n            "ANET" -> "Arista Networks, Inc."\n            "ADBE" -> "Adobe Inc."\n            "SNOW" -> "Snowflake Inc."\n            "DDOG" -> "Datadog, Inc."\n            "NET" -> "Cloudflare, Inc."\n            "PANW" -> "Palo Alto Networks, Inc."\n            "CRWD" -> "CrowdStrike Holdings, Inc."\n            "INTU" -> "Intuit Inc."\n            "IBM" -> "International Business Machines Corporation"\n            "CSCO" -> "Cisco Systems, Inc."\n            "QCOM" -> "QUALCOMM Incorporated"\n            "INTC" -> "Intel Corporation"\n            "AMAT" -> "Applied Materials, Inc."\n            "LRCX" -> "Lam Research Corporation"\n            "KLAC" -> "KLA Corporation"\n            "TSM" -> "Taiwan Semiconductor Manufacturing Company Limited"\n            "ASML" -> "ASML Holding N.V."\n            "JPM" -> "JPMorgan Chase & Co."\n            "BAC" -> "Bank of America Corporation"\n            "GS" -> "The Goldman Sachs Group, Inc."\n            "MS" -> "Morgan Stanley"\n            "BLK" -> "BlackRock, Inc."\n            "XOM" -> "Exxon Mobil Corporation"\n            "CVX" -> "Chevron Corporation"\n            "COP" -> "ConocoPhillips"\n            "GE" -> "GE Aerospace"\n            "CAT" -> "Caterpillar Inc."\n            "HON" -> "Honeywell International Inc."\n            "RTX" -> "RTX Corporation"\n            "BA" -> "The Boeing Company"\n            "LLY" -> "Eli Lilly and Company"\n            "JNJ" -> "Johnson & Johnson"\n            "UNH" -> "UnitedHealth Group Incorporated"\n            "COST" -> "Costco Wholesale Corporation"\n            "WMT" -> "Walmart Inc."\n            "MCD" -> "McDonald's Corporation"\n            "NKE" -> "NIKE, Inc."\n            "DIS" -> "The Walt Disney Company"\n            "NFLX" -> "Netflix, Inc."\n            "UBER" -> "Uber Technologies, Inc."\n            "COIN" -> "Coinbase Global, Inc."\n            "HOOD" -> "Robinhood Markets, Inc."\n            else -> null\n        }\n        return known ?: stored.trim().takeIf { it.isNotBlank() && !it.equals(key,true) } ?: "Company $key"\n    }\n\n    '''+anchor
          if anchor not in s: raise SystemExit('history helper anchor not found')
          s=s.replace(anchor,helper,1)
          p.write_text(s,encoding='utf-8')
          PY
          
          grep -q 'knownCompanyName' app/src/main/java/ro/alintudor/oracle/core/OracleGrowthEngine.kt
          grep -q 'displayCompanyName' app/src/main/java/ro/alintudor/oracle/nativeui/OracleGrowthModule.kt
          grep -q 'refreshGrowthOnly(repository)' app/src/main/java/ro/alintudor/oracle/OracleMysticActivity.kt
          git diff --check
      - name: Set B536 identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('app/build.gradle'); s=p.read_text(encoding='utf-8')
          s=re.sub(r'versionCode\s+\d+', 'versionCode 31', s, count=1)
          s=re.sub(r'versionName\s+[\'\"][^\'\"]*[\'\"]', "versionName 'V6g-GROWTH-B536'", s, count=1)
          p.write_text(s,encoding='utf-8')
          PY
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.10'}
      - name: Prepare signing key
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$ORACLE_KEYSTORE_BASE64" ] && [ -n "$ORACLE_KEYSTORE_PASSWORD" ] && [ -n "$ORACLE_KEY_ALIAS" ] && [ -n "$ORACLE_KEY_PASSWORD" ]; then
            echo "$ORACLE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/oracle-release.jks"
            { echo "ORACLE_KEYSTORE_FILE=$RUNNER_TEMP/oracle-release.jks"; echo "ORACLE_KEYSTORE_PASSWORD=$ORACLE_KEYSTORE_PASSWORD"; echo "ORACLE_KEY_ALIAS=$ORACLE_KEY_ALIAS"; echo "ORACLE_KEY_PASSWORD=$ORACLE_KEY_PASSWORD"; } >> "$GITHUB_ENV"
          fi
      - name: Build APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Verify APK and frozen modules
        shell: bash
        run: |
          set -euo pipefail
          for f in app/src/main/java/ro/alintudor/oracle/OracleMysticStartView.kt app/src/main/java/ro/alintudor/oracle/nativeui/OracleNewsModule.kt app/src/main/java/ro/alintudor/oracle/nativeui/OraclePortfolioModule.kt app/src/main/java/ro/alintudor/oracle/nativeui/OracleAlertsModule.kt app/src/main/java/ro/alintudor/oracle/nativeui/OracleAnalysisModules.kt app/src/main/java/ro/alintudor/oracle/core/OracleKnowledgeSync.kt; do git hash-object "$f"; done > /tmp/oracle-freeze/protected.after.sha
          cmp /tmp/oracle-freeze/protected.before.sha /tmp/oracle-freeze/protected.after.sha
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -q "versionName='V6g-GROWTH-B536'"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Oracle-APK-B536-GROWTH-FINAL
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30