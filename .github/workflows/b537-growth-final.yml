name: Oracle B537 Growth Final

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  ORACLE_KEYSTORE_BASE64: ${{ secrets.ORACLE_KEYSTORE_BASE64 }}
  ORACLE_KEYSTORE_PASSWORD: ${{ secrets.ORACLE_KEYSTORE_PASSWORD }}
  ORACLE_KEY_ALIAS: ${{ secrets.ORACLE_KEY_ALIAS }}
  ORACLE_KEY_PASSWORD: ${{ secrets.ORACLE_KEY_PASSWORD }}

jobs:
  growth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: Verify protected modules before build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/oracle-freeze
          for f in \
            app/src/main/java/ro/alintudor/oracle/OracleMysticStartView.kt \
            app/src/main/java/ro/alintudor/oracle/nativeui/OracleNewsModule.kt \
            app/src/main/java/ro/alintudor/oracle/nativeui/OraclePortfolioModule.kt \
            app/src/main/java/ro/alintudor/oracle/nativeui/OracleAlertsModule.kt \
            app/src/main/java/ro/alintudor/oracle/nativeui/OracleAnalysisModules.kt \
            app/src/main/java/ro/alintudor/oracle/core/OracleKnowledgeSync.kt; do
            test -f "$f"
            git hash-object "$f"
          done > /tmp/oracle-freeze/protected.before.sha

      - name: Verify Growth implementation
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'ULTIMELE RECOMANDĂRI' app/src/main/java/ro/alintudor/oracle/nativeui/OracleGrowthModule.kt
          grep -q 'take(6)' app/src/main/java/ro/alintudor/oracle/nativeui/OracleGrowthModule.kt
          grep -q '31.08.2026' app/src/main/java/ro/alintudor/oracle/nativeui/OracleGrowthModule.kt
          grep -q '⌄' app/src/main/java/ro/alintudor/oracle/nativeui/OracleGrowthModule.kt
          grep -q 'setImageResource(ro.alintudor.oracle.R.drawable.ic_oracle)' app/src/main/java/ro/alintudor/oracle/nativeui/OracleGrowthModule.kt
          grep -q 'BUILD B535' app/src/main/java/ro/alintudor/oracle/nativeui/OracleGrowthModule.kt
          grep -q 'OracleRealData.fundamentals' app/src/main/java/ro/alintudor/oracle/core/OracleGrowthEngine.kt
          grep -q 'OracleRealData.newsContext' app/src/main/java/ro/alintudor/oracle/core/OracleGrowthEngine.kt
          grep -q 'OracleRealData.marketContext' app/src/main/java/ro/alintudor/oracle/core/OracleGrowthEngine.kt
          grep -q 'refreshGrowthOnly(repository)' app/src/main/java/ro/alintudor/oracle/OracleMysticActivity.kt
          git diff --check

      - name: Set B535 identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('app/build.gradle')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'versionCode\s+\d+', 'versionCode 30', s, count=1)
          s=re.sub(r'versionName\s+[\'\"][^\'\"]*[\'\"]', "versionName 'V6g-GROWTH-B535'", s, count=1)
          p.write_text(s, encoding='utf-8')
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Prepare signing key
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$ORACLE_KEYSTORE_BASE64" ] && [ -n "$ORACLE_KEYSTORE_PASSWORD" ] && [ -n "$ORACLE_KEY_ALIAS" ] && [ -n "$ORACLE_KEY_PASSWORD" ]; then
            echo "$ORACLE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/oracle-release.jks"
            {
              echo "ORACLE_KEYSTORE_FILE=$RUNNER_TEMP/oracle-release.jks"
              echo "ORACLE_KEYSTORE_PASSWORD=$ORACLE_KEYSTORE_PASSWORD"
              echo "ORACLE_KEY_ALIAS=$ORACLE_KEY_ALIAS"
              echo "ORACLE_KEY_PASSWORD=$ORACLE_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
          fi

      - name: Build APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Verify APK and frozen modules
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            app/src/main/java/ro/alintudor/oracle/OracleMysticStartView.kt \
            app/src/main/java/ro/alintudor/oracle/nativeui/OracleNewsModule.kt \
            app/src/main/java/ro/alintudor/oracle/nativeui/OraclePortfolioModule.kt \
            app/src/main/java/ro/alintudor/oracle/nativeui/OracleAlertsModule.kt \
            app/src/main/java/ro/alintudor/oracle/nativeui/OracleAnalysisModules.kt \
            app/src/main/java/ro/alintudor/oracle/core/OracleKnowledgeSync.kt; do
            git hash-object "$f"
          done > /tmp/oracle-freeze/protected.after.sha
          cmp /tmp/oracle-freeze/protected.before.sha /tmp/oracle-freeze/protected.after.sha
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -q "versionName='V6g-GROWTH-B535'"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Oracle-APK-B535-GROWTH-FINAL
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
