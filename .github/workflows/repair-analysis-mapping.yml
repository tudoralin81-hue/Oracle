name: Repair Analysis value mapping

on:
  push:
    paths:
      - '.github/workflows/repair-analysis-mapping.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair authoritative Analysis mapping
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('app/src/main/java/ro/alintudor/oracle/nativeui/OracleAnalysisModules.kt')
          s = p.read_text(encoding='utf-8')
          old = 'name to (r.rawValues.getOrNull(i) ?: "Valoare indisponibilă")'
          new = 'name to (r.rawValues.getOrNull(i + 1) ?: "Valoare indisponibilă")'
          if old not in s:
              raise SystemExit('Expected Analysis mapping was not found')
          s = s.replace(old, new, 1)
          s = s.replace('// ANALYSIS_PARAMETERS_V6', '// ANALYSIS_PARAMETERS_V7', 1)
          s = s.replace('// NEWS remains internal to Growth and is intentionally hidden here.', '// News remains internal to the Oracle calculation and is intentionally hidden from Analysis UI.\n        // rawValues[0] is News; factorNames contains only the 11 visible factors, so visible factor i maps to rawValues[i + 1].', 1)
          p.write_text(s, encoding='utf-8')

          p = Path('.github/workflows/final-build-506.yml')
          s = p.read_text(encoding='utf-8')
          old = "grep -q 'name to (r.rawValues.getOrNull(i)' app/src/main/java/ro/alintudor/oracle/nativeui/OracleAnalysisModules.kt"
          new = "grep -q 'name to (r.rawValues.getOrNull(i + 1)' app/src/main/java/ro/alintudor/oracle/nativeui/OracleAnalysisModules.kt"
          if old not in s:
              raise SystemExit('B506 verification line was not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify exact repair
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'name to (r.rawValues.getOrNull(i + 1)' app/src/main/java/ro/alintudor/oracle/nativeui/OracleAnalysisModules.kt
          ! grep -q 'name to (r.rawValues.getOrNull(i) ?: "Valoare indisponibilă")' app/src/main/java/ro/alintudor/oracle/nativeui/OracleAnalysisModules.kt
          grep -q 'rawValues\[0\] is News' app/src/main/java/ro/alintudor/oracle/nativeui/OracleAnalysisModules.kt
          git diff --check

      - name: Commit exact repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/ro/alintudor/oracle/nativeui/OracleAnalysisModules.kt .github/workflows/final-build-506.yml
          git commit -m 'Fix Analysis Oracle value mapping'
          git push
