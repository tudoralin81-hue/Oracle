name: B514 START PREMIUM FINAL

on:
  push:
    branches: [main]
    paths:
      - scripts/apply_start_redesign.py
      - app/src/main/java/ro/alintudor/oracle/OracleStartView.kt
      - .github/workflows/b514-start-redesign-final.yml
      - BUILD_B514_START_PREMIUM.txt
  workflow_dispatch:

permissions:
  contents: read

env:
  ORACLE_KEYSTORE_BASE64: ${{ secrets.ORACLE_KEYSTORE_BASE64 }}
  ORACLE_KEYSTORE_PASSWORD: ${{ secrets.ORACLE_KEYSTORE_PASSWORD }}
  ORACLE_KEY_ALIAS: ${{ secrets.ORACLE_KEY_ALIAS }}
  ORACLE_KEY_PASSWORD: ${{ secrets.ORACLE_KEY_PASSWORD }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Clean generated state
        run: git clean -xfd

      - name: Freeze protected module sources
        run: |
          set -euo pipefail
          mkdir -p /tmp/oracle-freeze
          : > /tmp/oracle-freeze/module-sha.txt
          for f in \
            app/src/main/java/ro/alintudor/oracle/nativeui/OracleGrowthModule.kt \
            app/src/main/java/ro/alintudor/oracle/core/OracleKnowledgeSync.kt \
            app/src/main/java/ro/alintudor/oracle/nativeui/OracleNewsModule.kt \
            app/src/main/java/ro/alintudor/oracle/nativeui/OraclePortfolioModule.kt \
            app/src/main/java/ro/alintudor/oracle/nativeui/OracleAlertsModule.kt \
            app/src/main/java/ro/alintudor/oracle/nativeui/OracleAnalysisModules.kt; do
            test -f "$f"
            printf '%s %s\n' "$(git hash-object "$f")" "$f" >> /tmp/oracle-freeze/module-sha.txt
          done
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('app/src/main/java/ro/alintudor/oracle/MainActivity.kt')
          s=p.read_text()
          start=s.index('    private fun showHub()')
          end=s.index('    private fun makeHomeCard', start)
          Path('/tmp/oracle-freeze/main-without-start.sha').write_text(hashlib.sha256((s[:start]+s[end:]).encode()).hexdigest())
          PY

      - name: Apply Start redesign only
        run: python3 scripts/apply_start_redesign.py

      - name: HARD VERIFY protected modules byte-for-byte
        run: |
          set -euo pipefail
          while read expected path; do
            test "$(git hash-object "$path")" = "$expected"
          done < /tmp/oracle-freeze/module-sha.txt
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('app/src/main/java/ro/alintudor/oracle/MainActivity.kt')
          s=p.read_text()
          start=s.index('    private fun showHub()')
          end=s.index('    private fun makeHomeCard', start)
          actual=hashlib.sha256((s[:start]+s[end:]).encode()).hexdigest()
          expected=Path('/tmp/oracle-freeze/main-without-start.sha').read_text().strip()
          assert actual == expected, 'Non-Start MainActivity bytes changed'
          PY
          git diff --check

      - name: Set B514 package identity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('app/build.gradle')
          s=p.read_text()
          s=re.sub(r'versionCode\s+\d+', 'versionCode 35', s, count=1)
          s=re.sub(r"versionName\s+'[^']+'", "versionName 'V6g-FINAL-B514'", s, count=1)
          p.write_text(s)
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Prepare production signing key
        run: |
          set -euo pipefail
          if [ -n "$ORACLE_KEYSTORE_BASE64" ] && [ -n "$ORACLE_KEYSTORE_PASSWORD" ] && [ -n "$ORACLE_KEY_ALIAS" ] && [ -n "$ORACLE_KEY_PASSWORD" ]; then
            echo "$ORACLE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/oracle-release.jks"
            {
              echo "ORACLE_KEYSTORE_FILE=$RUNNER_TEMP/oracle-release.jks"
              echo "ORACLE_KEYSTORE_PASSWORD=$ORACLE_KEYSTORE_PASSWORD"
              echo "ORACLE_KEY_ALIAS=$ORACLE_KEY_ALIAS"
              echo "ORACLE_KEY_PASSWORD=$ORACLE_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Verify B514 APK
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -q "versionName='V6g-FINAL-B514'"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -q "versionCode='35'"

      - name: Final protected-source verification
        run: |
          set -euo pipefail
          while read expected path; do
            test "$(git hash-object "$path")" = "$expected"
          done < /tmp/oracle-freeze/module-sha.txt

      - name: Upload B514 installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Oracle-APK-B514-START-PREMIUM-FINAL
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
