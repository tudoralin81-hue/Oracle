name: One-shot Watchlist Eye Fix
on:
  push:
    branches: [ main ]
jobs:
  fix-build:
    runs-on: ubuntu-latest
    env:
      ORACLE_KEYSTORE_BASE64: ${{ secrets.ORACLE_KEYSTORE_BASE64 }}
      ORACLE_KEYSTORE_PASSWORD: ${{ secrets.ORACLE_KEYSTORE_PASSWORD }}
      ORACLE_KEY_ALIAS: ${{ secrets.ORACLE_KEY_ALIAS }}
      ORACLE_KEY_PASSWORD: ${{ secrets.ORACLE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Patch source safely
        shell: python
        run: |
          from pathlib import Path

          modules = Path('app/src/main/java/ro/alintudor/oracle/nativeui/OracleAnalysisModules.kt')
          s = modules.read_text()

          old_headline = '''        val headline = LinearLayout(host.root.context).apply { orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER_VERTICAL }
        headline.addView(TextView(host.root.context).apply {
            text = r.ticker
            textSize = 30f
            typeface = Typeface.DEFAULT_BOLD
            setTextColor(Color.WHITE)
        }, LinearLayout.LayoutParams(0, -2, 1f))
        headline.addView(TextView(host.root.context).apply {
            text = money(r.price)
            textSize = 17f
            typeface = Typeface.DEFAULT_BOLD
            setTextColor(Color.rgb(45, 232, 92))
            gravity = Gravity.END
        })'''
          new_headline = '''        val headline = LinearLayout(host.root.context).apply { orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER_VERTICAL }
        headline.addView(TextView(host.root.context).apply {
            text = r.ticker
            textSize = 30f
            typeface = Typeface.DEFAULT_BOLD
            setTextColor(Color.WHITE)
        }, LinearLayout.LayoutParams(0, -2, 1f))
        val watchStore = OracleWatchlistStore(host.root.context)
        val watchTicker = r.ticker.trim().uppercase(Locale.US)
        val watchEye = WatchlistEyeView(host.root.context, host.dp(42)).apply {
            tag = "oracle_watchlist_eye_direct"
            isClickable = true
            isFocusable = true
            contentDescription = "Adaugă sau scoate $watchTicker din Watchlist"
            setSelectedState(watchStore.load().any { it.equals(watchTicker, true) })
            setOnClickListener {
                val current = watchStore.load().toMutableList()
                val present = current.any { it.equals(watchTicker, true) }
                if (present) current.removeAll { it.equals(watchTicker, true) } else current.add(watchTicker)
                watchStore.save(current)
                setSelectedState(!present)
                Toast.makeText(host.root.context, if (!present) "$watchTicker adăugat în Watchlist" else "$watchTicker scos din Watchlist", Toast.LENGTH_SHORT).show()
            }
        }
        headline.addView(watchEye, LinearLayout.LayoutParams(host.dp(42), host.dp(42)).apply { setMargins(host.dp(4), 0, host.dp(8), 0) })
        headline.addView(TextView(host.root.context).apply {
            text = money(r.price)
            textSize = 17f
            typeface = Typeface.DEFAULT_BOLD
            setTextColor(Color.rgb(45, 232, 92))
            gravity = Gravity.END
        })'''
          if old_headline not in s:
              raise SystemExit('Expected Analysis headline block not found; refusing unsafe patch')
          s = s.replace(old_headline, new_headline, 1)

          marker = '''        host.content.addView(row, LinearLayout.LayoutParams(-1, -2).apply { setMargins(0, 0, 0, host.dp(8)) })'''
          replacement = '''        // Explicit child navigation: ticker and arrow both open the same Analysis target.
        for (j in 0 until row.childCount) {
            val child = row.getChildAt(j)
            if (child is TextView && child.text?.toString()?.trim() == t) {
                child.isClickable = true
                child.isFocusable = true
                child.setOnClickListener { onWatchlistTickerClick(t) }
            } else if (child is TextView && child.text?.toString()?.trim() == "›") {
                child.isClickable = true
                child.isFocusable = true
                child.setOnClickListener { onWatchlistTickerClick(t) }
            }
        }
        host.content.addView(row, LinearLayout.LayoutParams(-1, -2).apply { setMargins(0, 0, 0, host.dp(8)) })'''
          if marker not in s:
              raise SystemExit('Expected Watchlist row marker not found; refusing unsafe patch')
          s = s.replace(marker, replacement, 1)

          class_code = '''\n    private class WatchlistEyeView(context: android.content.Context, private val sizePx: Int) : android.view.View(context) {\n        private val paint = android.graphics.Paint(android.graphics.Paint.ANTI_ALIAS_FLAG).apply {\n            style = android.graphics.Paint.Style.STROKE\n            strokeWidth = (sizePx * 0.055f).coerceAtLeast(2f)\n            strokeCap = android.graphics.Paint.Cap.ROUND\n            strokeJoin = android.graphics.Paint.Join.ROUND\n        }\n        private var selected = false\n\n        fun setSelectedState(value: Boolean) {\n            selected = value\n            paint.color = if (selected) Color.rgb(255, 210, 45) else Color.rgb(125, 135, 155)\n            invalidate()\n        }\n\n        override fun onDraw(canvas: android.graphics.Canvas) {\n            super.onDraw(canvas)\n            val cx = width / 2f\n            val cy = height / 2f\n            val rx = width * 0.32f\n            val ry = height * 0.22f\n            canvas.drawOval(cx - rx, cy - ry, cx + rx, cy + ry, paint)\n            canvas.drawCircle(cx, cy, width * 0.105f, paint)\n            if (selected) {\n                paint.style = android.graphics.Paint.Style.FILL\n                canvas.drawCircle(cx, cy, width * 0.052f, paint)\n                paint.style = android.graphics.Paint.Style.STROKE\n            }\n        }\n    }\n'''
          if 'private class WatchlistEyeView' not in s:
              pos = s.rfind('\n}')
              if pos < 0:
                  raise SystemExit('Could not locate end of OracleSimpleModule.kt; refusing unsafe patch')
              s = s[:pos] + class_code + s[pos:]
          modules.write_text(s)

          main = Path('app/src/main/java/ro/alintudor/oracle/MainActivity.kt')
          m = main.read_text()
          old_overlay = '        if (key == "analysis") OracleAnalysisWatchlistEyeOverlay.install(host)\n'
          if old_overlay in m:
              m = m.replace(old_overlay, '', 1)
          main.write_text(m)

      - name: Verify source changes
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'oracle_watchlist_eye_direct' app/src/main/java/ro/alintudor/oracle/nativeui/OracleAnalysisModules.kt
          grep -q 'Explicit child navigation' app/src/main/java/ro/alintudor/oracle/nativeui/OracleAnalysisModules.kt
          ! grep -q 'OracleAnalysisWatchlistEyeOverlay.install(host)' app/src/main/java/ro/alintudor/oracle/MainActivity.kt

      - name: Commit source and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/ro/alintudor/oracle/nativeui/OracleAnalysisModules.kt app/src/main/java/ro/alintudor/oracle/MainActivity.kt
          git rm .github/workflows/one-shot-watchlist-fix.yml
          git commit -m "fix: Analysis watchlist eye and ticker navigation [skip ci]"
          git push

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Prepare production signing key when configured
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$ORACLE_KEYSTORE_BASE64" ] && [ -n "$ORACLE_KEYSTORE_PASSWORD" ] && [ -n "$ORACLE_KEY_ALIAS" ] && [ -n "$ORACLE_KEY_PASSWORD" ]; then
            echo "$ORACLE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/oracle-release.jks"
            {
              echo "ORACLE_KEYSTORE_FILE=$RUNNER_TEMP/oracle-release.jks"
              echo "ORACLE_KEYSTORE_PASSWORD=$ORACLE_KEYSTORE_PASSWORD"
              echo "ORACLE_KEY_ALIAS=$ORACLE_KEY_ALIAS"
              echo "ORACLE_KEY_PASSWORD=$ORACLE_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
          fi
      - name: Build release APK
        run: gradle :app:assembleRelease --stacktrace
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Oracle-Watchlist-Eye-Fix
          path: app/build/outputs/apk/release/*.apk
