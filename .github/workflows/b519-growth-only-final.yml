name: Oracle B519 Growth-only FINAL APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  ORACLE_KEYSTORE_BASE64: ${{ secrets.ORACLE_KEYSTORE_BASE64 }}
  ORACLE_KEYSTORE_PASSWORD: ${{ secrets.ORACLE_KEYSTORE_PASSWORD }}
  ORACLE_KEY_ALIAS: ${{ secrets.ORACLE_KEY_ALIAS }}
  ORACLE_KEY_PASSWORD: ${{ secrets.ORACLE_KEY_PASSWORD }}

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: build-519

      - name: Verify exact B514-good Analysis baseline
        run: |
          set -euo pipefail
          test "$(git hash-object app/src/main/java/ro/alintudor/oracle/nativeui/OracleAnalysisModules.kt)" = "76210ed4db93147487bc59e01ced70ae54f44ff6"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Apply Growth-only B519 patch
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          MAIN = Path('app/src/main/java/ro/alintudor/oracle/MainActivity.kt')
          GROWTH = Path('app/src/main/java/ro/alintudor/oracle/nativeui/OracleGrowthModule.kt')

          # MainActivity: Growth must never paint repository.snapshot() first.
          s = MAIN.read_text(encoding='utf-8')
          old = '''    private fun openModule(key:String){
        currentModule=key
        runCatching{renderModule(key,false)}.onFailure{showModuleError(key,it)}
        if (key == "analysis") return
        if (key == "knowledge") {
            if (OracleKnowledgeSync.isStale(this)) {
                OracleKnowledgeSync.refreshAsync(this) { ok, error ->
                    if (currentModule != "knowledge" || isFinishing) return@refreshAsync
                    if (ok) runCatching { renderModule("knowledge", false) }.onFailure { showModuleError("knowledge", it) }
                    else if (error != null) Toast.makeText(this, "Knowledge refresh eșuat: $error", Toast.LENGTH_LONG).show()
                }
            }
            return
        }
        Thread{val result=runCatching{OracleLocalProcessor.refresh(repository)};mainHandler.post{if(currentModule!=key||isFinishing)return@post;result.onSuccess{runCatching{renderModule(key,false)}.onFailure{showModuleError(key,it)}}.onFailure{e->Toast.makeText(this,"Refresh local eșuat: ${e.message?:e.javaClass.simpleName}",Toast.LENGTH_LONG).show()}}}.start()
    }
'''
          new = '''    private fun openModule(key:String){
        currentModule=key
        if (key == "growth") {
            // Never paint cached Growth recommendations from a previous trading day.
            runCatching { renderGrowthLoading() }.onFailure { showModuleError(key,it) }
        } else {
            runCatching{renderModule(key,false)}.onFailure{showModuleError(key,it)}
        }
        if (key == "analysis") return
        if (key == "knowledge") {
            if (OracleKnowledgeSync.isStale(this)) {
                OracleKnowledgeSync.refreshAsync(this) { ok, error ->
                    if (currentModule != "knowledge" || isFinishing) return@refreshAsync
                    if (ok) runCatching { renderModule("knowledge", false) }.onFailure { showModuleError("knowledge", it) }
                    else if (error != null) Toast.makeText(this, "Knowledge refresh eșuat: $error", Toast.LENGTH_LONG).show()
                }
            }
            return
        }
        Thread{val result=runCatching{OracleLocalProcessor.refresh(repository)};mainHandler.post{if(currentModule!=key||isFinishing)return@post;result.onSuccess{runCatching{renderModule(key,false)}.onFailure{showModuleError(key,it)}}.onFailure{e->Toast.makeText(this,"Refresh local eșuat: ${e.message?:e.javaClass.simpleName}",Toast.LENGTH_LONG).show()}}}.start()
    }

    private fun renderGrowthLoading() {
        val title = titles["growth"] ?: "GROWTH"
        val preservedScrollY = OracleNativeModule.rememberedScroll(title)
        root.removeAllViews()
        val host = OracleNativeModule(this, title, { showHub() }, { refreshModule("growth") })
        root.addView(host.root, FrameLayout.LayoutParams(-1, -1))
        OracleGrowthModule(host).render(emptyList())
        host.restoreScrollY(preservedScrollY)
    }
'''
          if old not in s:
              raise SystemExit('Expected B514 MainActivity openModule block not found')
          MAIN.write_text(s.replace(old,new,1), encoding='utf-8')

          g = GROWTH.read_text(encoding='utf-8')
          old_empty = '''        if (items.isEmpty()) {
            host.addCard("GROWTH", "Nu există încă un snapshot Growth local. Refresh va afișa ultimul rezultat Oracle disponibil.")
            return
        }
'''
          new_empty = '''        if (items.isEmpty()) {
            host.addCard("GROWTH", "Se încarcă snapshot-ul Growth al sesiunii curente…")
            addBuildFooter()
            return
        }
'''
          if old_empty not in g:
              raise SystemExit('Expected B514 Growth empty-state block not found')
          g = g.replace(old_empty,new_empty,1)

          old_tail = '''        addNews(ordered, fallbackNews)
        addHistory(items)
    }
'''
          new_tail = '''        addNews(ordered, fallbackNews)
        addHistory(items)
        addBuildFooter()
    }

    private fun addBuildFooter() {
        host.content.addView(TextView(host.root.context).apply {
            text = "ORACLE • V6g-FINAL-B519"
            textSize = 10f
            typeface = Typeface.DEFAULT_BOLD
            letterSpacing = .08f
            gravity = Gravity.CENTER
            setTextColor(Color.rgb(110, 120, 140))
            setPadding(0, host.dp(8), 0, host.dp(20))
        }, LinearLayout.LayoutParams(-1, -2))
    }
'''
          if old_tail not in g:
              raise SystemExit('Expected B514 Growth render tail not found')
          GROWTH.write_text(g.replace(old_tail,new_tail,1), encoding='utf-8')
          PY
          git diff --check

      - name: HARD VERIFY Analysis is untouched
        run: |
          set -euo pipefail
          test "$(git hash-object app/src/main/java/ro/alintudor/oracle/nativeui/OracleAnalysisModules.kt)" = "76210ed4db93147487bc59e01ced70ae54f44ff6"
          grep -q "renderGrowthLoading" app/src/main/java/ro/alintudor/oracle/MainActivity.kt
          grep -q "Se încarcă snapshot-ul Growth al sesiunii curente" app/src/main/java/ro/alintudor/oracle/nativeui/OracleGrowthModule.kt
          grep -q "ORACLE • V6g-FINAL-B519" app/src/main/java/ro/alintudor/oracle/nativeui/OracleGrowthModule.kt
          grep -q "versionCode 31" app/build.gradle
          grep -q "versionName 'V6g-FINAL-B519'" app/build.gradle
          git diff --check

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Prepare production signing key
        run: |
          set -euo pipefail
          if [ -n "$ORACLE_KEYSTORE_BASE64" ] && [ -n "$ORACLE_KEYSTORE_PASSWORD" ] && [ -n "$ORACLE_KEY_ALIAS" ] && [ -n "$ORACLE_KEY_PASSWORD" ]; then
            echo "$ORACLE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/oracle-release.jks"
            {
              echo "ORACLE_KEYSTORE_FILE=$RUNNER_TEMP/oracle-release.jks"
              echo "ORACLE_KEYSTORE_PASSWORD=$ORACLE_KEYSTORE_PASSWORD"
              echo "ORACLE_KEY_ALIAS=$ORACLE_KEY_ALIAS"
              echo "ORACLE_KEY_PASSWORD=$ORACLE_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Verify APK
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK"

      - name: Upload B519 FINAL APK
        uses: actions/upload-artifact@v4
        with:
          name: Oracle-APK-B519-Growth-only-FINAL-installable
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
