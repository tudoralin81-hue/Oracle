name: Oracle B521 FINAL APK

'on':
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  BASE_COMMIT: b6134541d3eceb116c8f92b169b211226c8ed288
  ORACLE_KEYSTORE_BASE64: ${{ secrets.ORACLE_KEYSTORE_BASE64 }}
  ORACLE_KEYSTORE_PASSWORD: ${{ secrets.ORACLE_KEYSTORE_PASSWORD }}
  ORACLE_KEY_ALIAS: ${{ secrets.ORACLE_KEY_ALIAS }}
  ORACLE_KEY_PASSWORD: ${{ secrets.ORACLE_KEY_PASSWORD }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout EXACT B514-good base
        uses: actions/checkout@v4
        with:
          ref: b6134541d3eceb116c8f92b169b211226c8ed288
          fetch-depth: 1

      - name: Assert Analysis is untouched B514-good
        run: |
          set -euo pipefail
          git status --short
          test "$(git rev-parse HEAD)" = "$BASE_COMMIT"
          echo "Analysis baseline is the exact B514-good commit: $BASE_COMMIT"

      - name: Apply ONLY Growth initial-render and footer patch
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          main = Path('app/src/main/java/ro/alintudor/oracle/MainActivity.kt')
          growth = Path('app/src/main/java/ro/alintudor/oracle/nativeui/OracleGrowthModule.kt')
          gradle = Path('app/build.gradle')

          s = main.read_text(encoding='utf-8')
          old = '''    private fun openModule(key:String){\n        currentModule=key\n        runCatching{renderModule(key,false)}.onFailure{showModuleError(key,it)}\n        if (key == "analysis") return\n'''
          new = '''    private fun openModule(key:String){\n        currentModule=key\n        if (key != "growth") {\n            runCatching{renderModule(key,false)}.onFailure{showModuleError(key,it)}\n        }\n        if (key == "analysis") return\n'''
          if old not in s:
              raise SystemExit('MainActivity openModule baseline not found')
          s = s.replace(old, new, 1)
          main.write_text(s, encoding='utf-8')

          s = growth.read_text(encoding='utf-8')
          old = '        addHistory(items)\n    }\n'
          new = '''        addHistory(items)\n        addBuildFooter()\n    }\n\n    private fun addBuildFooter() {\n        host.content.addView(text("BUILD B521 • V6g-FINAL", 9f, Typeface.DEFAULT_BOLD, Color.rgb(125, 135, 155), host.dp(4), 8), LinearLayout.LayoutParams(-1, -2).apply {\n            setMargins(0, 0, 0, host.dp(18))\n        })\n    }\n'''
          if old not in s:
              raise SystemExit('Growth render footer insertion point not found')
          s = s.replace(old, new, 1)
          growth.write_text(s, encoding='utf-8')

          s = gradle.read_text(encoding='utf-8')
          s = s.replace('versionCode 31', 'versionCode 32', 1)
          s = s.replace("versionName 'V6g-FINAL-B519'", "versionName 'V6g-FINAL-B521'", 1)
          gradle.write_text(s, encoding='utf-8')
          PY
          git diff --check

      - name: HARD VERIFY Analysis unchanged
        run: |
          set -euo pipefail
          # Only Growth/MainActivity/build metadata are allowed to differ from B514.
          git diff --name-only
          if git diff --name-only | grep -q '^app/src/main/java/ro/alintudor/oracle/nativeui/OracleAnalysisModules.kt$'; then exit 1; fi
          if git diff --name-only | grep -q '^app/src/main/java/ro/alintudor/oracle/nativeui/OracleSimpleModule.kt$'; then exit 1; fi
          grep -q 'BUILD B521 • V6g-FINAL' app/src/main/java/ro/alintudor/oracle/nativeui/OracleGrowthModule.kt
          grep -q 'if (key != "growth")' app/src/main/java/ro/alintudor/oracle/MainActivity.kt
          grep -q 'versionCode 32' app/build.gradle
          grep -q "versionName 'V6g-FINAL-B521'" app/build.gradle

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Prepare production signing key
        run: |
          set -euo pipefail
          if [ -n "$ORACLE_KEYSTORE_BASE64" ] && [ -n "$ORACLE_KEYSTORE_PASSWORD" ] && [ -n "$ORACLE_KEY_ALIAS" ] && [ -n "$ORACLE_KEY_PASSWORD" ]; then
            echo "$ORACLE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/oracle-release.jks"
            {
              echo "ORACLE_KEYSTORE_FILE=$RUNNER_TEMP/oracle-release.jks"
              echo "ORACLE_KEYSTORE_PASSWORD=$ORACLE_KEYSTORE_PASSWORD"
              echo "ORACLE_KEY_ALIAS=$ORACLE_KEY_ALIAS"
              echo "ORACLE_KEY_PASSWORD=$ORACLE_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Verify APK
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK"

      - name: Upload B521 FINAL APK
        uses: actions/upload-artifact@v4
        with:
          name: Oracle-APK-B521-FINAL-installable
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
