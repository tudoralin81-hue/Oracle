name: B511 FINAL APK

'on':
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  ORACLE_KEYSTORE_BASE64: ${{ secrets.ORACLE_KEYSTORE_BASE64 }}
  ORACLE_KEYSTORE_PASSWORD: ${{ secrets.ORACLE_KEYSTORE_PASSWORD }}
  ORACLE_KEY_ALIAS: ${{ secrets.ORACLE_KEY_ALIAS }}
  ORACLE_KEY_PASSWORD: ${{ secrets.ORACLE_KEY_PASSWORD }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Apply B511 patch
        run: python3 scripts/b511_patch.py

      - name: Verify B511 source
        run: |
          set -euo pipefail
          grep -q "versionCode 26" app/build.gradle
          grep -q "versionName 'V6g-FINAL-B511'" app/build.gradle
          grep -q 'text = companyName(r.ticker)' app/src/main/java/ro/alintudor/oracle/nativeui/OracleAnalysisModules.kt
          grep -q 'Applied Digital Corporation' app/src/main/java/ro/alintudor/oracle/nativeui/OracleAnalysisModules.kt
          grep -q 'Color.rgb(205, 165, 38)' app/src/main/java/ro/alintudor/oracle/nativeui/OracleAnalysisModules.kt
          grep -q 'maxLines = Int.MAX_VALUE' app/src/main/java/ro/alintudor/oracle/nativeui/OracleAnalysisModules.kt
          ! grep -q 'baselineAligned = false' app/src/main/java/ro/alintudor/oracle/nativeui/OracleAnalysisModules.kt
          git diff --check

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Verify APK
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK"

      - name: Upload B511 FINAL APK
        uses: actions/upload-artifact@v4
        with:
          name: Oracle-APK-B511-FINAL-installable
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
