name: B511 FINAL APK

'on':
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  ORACLE_KEYSTORE_BASE64: ${{ secrets.ORACLE_KEYSTORE_BASE64 }}
  ORACLE_KEYSTORE_PASSWORD: ${{ secrets.ORACLE_KEYSTORE_PASSWORD }}
  ORACLE_KEY_ALIAS: ${{ secrets.ORACLE_KEY_ALIAS }}
  ORACLE_KEY_PASSWORD: ${{ secrets.ORACLE_KEY_PASSWORD }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle 8.10
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Apply B511 UI changes
        shell: python
        run: |
          from pathlib import Path
          import re

          src = Path('app/src/main/java/ro/alintudor/oracle/nativeui/OracleAnalysisModules.kt')
          s = src.read_text(encoding='utf-8')

          # Full company name on its own line; sector below it.
          old = '''        top.addView(TextView(host.root.context).apply {
            text = "${companyName(r.ticker)}   •   Sector: ${r.sector ?: "Sector indisponibil"}"
            textSize = 15f
            typeface = Typeface.DEFAULT_BOLD
            setTextColor(Color.rgb(205, 213, 228))
            setPadding(0, host.dp(4), 0, 0)
        })'''
          new = '''        top.addView(TextView(host.root.context).apply {
            text = companyName(r.ticker)
            textSize = 15f
            typeface = Typeface.DEFAULT_BOLD
            setTextColor(Color.rgb(205, 213, 228))
            setPadding(0, host.dp(4), 0, 0)
        })
        top.addView(TextView(host.root.context).apply {
            text = "Sector: ${r.sector ?: "Sector indisponibil"}"
            textSize = 13.5f
            typeface = Typeface.DEFAULT_BOLD
            setTextColor(Color.rgb(145, 158, 180))
            setPadding(0, host.dp(2), 0, 0)
        })'''
          if old in s:
              s = s.replace(old, new, 1)

          # Make every matrix row content-sized and equal-height after layout.
          start = s.find('    private fun addMetricGrid(')
          end = s.find('    private fun metricValueColor', start)
          if start < 0 or end < 0:
              raise SystemExit('B511: addMetricGrid anchors not found')
          grid = '''    private fun addMetricGrid(container: LinearLayout, items: List<Pair<String, String>>) {
        var row: LinearLayout? = null
        items.forEachIndexed { index, item ->
            if (index % 2 == 0) {
                row = LinearLayout(host.root.context).apply {
                    orientation = LinearLayout.HORIZONTAL
                    gravity = Gravity.FILL_VERTICAL
                }
                container.addView(row, LinearLayout.LayoutParams(-1, -2).apply {
                    setMargins(0, 0, 0, host.dp(6))
                })
            }
            val card = LinearLayout(host.root.context).apply {
                orientation = LinearLayout.VERTICAL
                setPadding(host.dp(11), host.dp(8), host.dp(11), host.dp(8))
                background = GradientDrawable().apply {
                    setColor(Color.rgb(6, 12, 24))
                    cornerRadius = host.dp(12).toFloat()
                    setStroke(host.dp(1), Color.rgb(35, 65, 98))
                }
            }
            card.addView(TextView(host.root.context).apply {
                text = item.first.uppercase(Locale.US)
                textSize = 10f
                typeface = Typeface.DEFAULT_BOLD
                letterSpacing = .07f
                setTextColor(Color.rgb(85, 190, 235))
                includeFontPadding = true
            })
            card.addView(TextView(host.root.context).apply {
                text = item.second
                textSize = 12.5f
                typeface = Typeface.DEFAULT_BOLD
                setTextColor(metricValueColor(item.first, item.second))
                setPadding(0, host.dp(2), 0, 0)
                includeFontPadding = true
                setHorizontallyScrolling(false)
                maxLines = Int.MAX_VALUE
                ellipsize = null
            })
            row?.addView(card, LinearLayout.LayoutParams(0, -2, 1f).apply {
                if (index % 2 == 1) setMargins(host.dp(4), 0, 0, 0)
                else setMargins(0, 0, host.dp(4), 0)
            })
        }
        container.post {
            for (i in 0 until container.childCount) {
                val rv = container.getChildAt(i) as? LinearLayout ?: continue
                var maxHeight = 0
                for (j in 0 until rv.childCount) maxHeight = maxOf(maxHeight, rv.getChildAt(j).measuredHeight)
                if (maxHeight > 0) {
                    for (j in 0 until rv.childCount) {
                        val child = rv.getChildAt(j)
                        val lp = child.layoutParams
                        lp.height = maxHeight
                        child.layoutParams = lp
                    }
                    rv.requestLayout()
                }
            }
        }
    }

'''
          s = s[:start] + grid + s[end:]

          # Slightly soften yellow value text.
          s = s.replace('Color.rgb(228, 178, 28)', 'Color.rgb(205, 165, 38)')

          if '"APLD" -> "Applied Digital Corporation"' not in s:
              anchor = '"AAOI" -> "Applied Optoelectronics, Inc."'
              if anchor in s:
                  s = s.replace(anchor, anchor + '\n        "APLD" -> "Applied Digital Corporation"', 1)

          s = s.replace('V6g-FINAL-B508', 'V6g-FINAL-B511')
          s = s.replace('V6g-FINAL-B509', 'V6g-FINAL-B511')
          s = s.replace('V6g-FINAL-B510', 'V6g-FINAL-B511')
          src.write_text(s, encoding='utf-8')

          gradle = Path('app/build.gradle')
          g = gradle.read_text(encoding='utf-8')
          g = re.sub(r'versionCode\s+\d+', 'versionCode 26', g, count=1)
          g = re.sub(r"versionName\s+'[^']+'", "versionName 'V6g-FINAL-B511'", g, count=1)
          gradle.write_text(g, encoding='utf-8')

      - name: Verify source
        run: |
          set -euo pipefail
          grep -q "versionCode 26" app/build.gradle
          grep -q "versionName 'V6g-FINAL-B511'" app/build.gradle
          grep -q 'Applied Digital Corporation' app/src/main/java/ro/alintudor/oracle/nativeui/OracleAnalysisModules.kt
          grep -q 'text = companyName(r.ticker)' app/src/main/java/ro/alintudor/oracle/nativeui/OracleAnalysisModules.kt
          grep -q 'maxLines = Int.MAX_VALUE' app/src/main/java/ro/alintudor/oracle/nativeui/OracleAnalysisModules.kt
          grep -q 'Color.rgb(205, 165, 38)' app/src/main/java/ro/alintudor/oracle/nativeui/OracleAnalysisModules.kt
          git diff --check

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Verify APK
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK"

      - name: Upload B511 FINAL APK
        uses: actions/upload-artifact@v4
        with:
          name: Oracle-APK-B511-FINAL-installable
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
