name: B510 Analysis UI FIX

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  ORACLE_KEYSTORE_BASE64: ${{ secrets.ORACLE_KEYSTORE_BASE64 }}
  ORACLE_KEYSTORE_PASSWORD: ${{ secrets.ORACLE_KEYSTORE_PASSWORD }}
  ORACLE_KEY_ALIAS: ${{ secrets.ORACLE_KEY_ALIAS }}
  ORACLE_KEY_PASSWORD: ${{ secrets.ORACLE_KEY_PASSWORD }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Apply B510 Analysis matrix fix
        shell: python
        run: |
          from pathlib import Path

          src = Path('app/src/main/java/ro/alintudor/oracle/nativeui/OracleAnalysisModules.kt')
          s = src.read_text(encoding='utf-8')

          # Remove the broken B509 post-measure equalisation block if it exists.
          start = s.find('        // B509: every row remains a true two-column matrix')
          if start >= 0:
              end = s.find('    private fun metricValueColor', start)
              if end < 0:
                  raise SystemExit('B510 could not locate metricValueColor after B509 block')
              s = s[:start] + s[end:]

          # Card values are content-sized. Never clip Fundamentals or other long values.
          s = s.replace(
              '                setPadding(0, host.dp(4), 0, 0)\n                maxLines = 4',
              '                setPadding(0, host.dp(3), 0, 0)\n                includeFontPadding = true\n                setHorizontallyScrolling(false)'
          )
          s = s.replace(
              'row?.addView(card, LinearLayout.LayoutParams(0, host.dp(104), 1f).apply {',
              'row?.addView(card, LinearLayout.LayoutParams(0, -2, 1f).apply {'
          )

          # Real matrix rows: two equal-width cards, row height determined by tallest content.
          s = s.replace(
              'row = LinearLayout(host.root.context).apply { orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER_VERTICAL }',
              'row = LinearLayout(host.root.context).apply {\n                    orientation = LinearLayout.HORIZONTAL\n                    gravity = Gravity.FILL_VERTICAL\n                    setMeasureWithLargestChildEnabled(true)\n                }'
          )
          # Kotlin/Android does not expose baselineAligned as a valid property here.
          s = s.replace('                    baselineAligned = false\n', '')

          # APLD must show the full company name below the ticker.
          if '"APLD" -> "Applied Digital Corporation"' not in s:
              anchor = '"AAOI" -> "Applied Optoelectronics, Inc."'
              if anchor in s:
                  s = s.replace(anchor, anchor + '\n        "APLD" -> "Applied Digital Corporation"', 1)
              else:
                  raise SystemExit('B510 company-name map anchor not found')

          # B510 version marker.
          s = s.replace('V6g-FINAL-B508', 'V6g-FINAL-B510')
          s = s.replace('V6g-FINAL-B509', 'V6g-FINAL-B510')
          src.write_text(s, encoding='utf-8')

          gradle = Path('app/build.gradle')
          g = gradle.read_text(encoding='utf-8')
          g = g.replace('versionCode 23', 'versionCode 25')
          g = g.replace('versionCode 24', 'versionCode 25')
          g = g.replace("versionName 'V6g-FINAL-B508'", "versionName 'V6g-FINAL-B510'")
          g = g.replace("versionName 'V6g-FINAL-B509'", "versionName 'V6g-FINAL-B510'")
          if "versionName 'V6g-FINAL-B510'" not in g:
              raise SystemExit('B510 versionName update failed')
          gradle.write_text(g, encoding='utf-8')

      - name: Verify B510 source
        shell: bash
        run: |
          set -euo pipefail
          grep -q "versionCode 25" app/build.gradle
          grep -q "versionName 'V6g-FINAL-B510'" app/build.gradle
          grep -q 'LinearLayout.LayoutParams(0, -2, 1f)' app/src/main/java/ro/alintudor/oracle/nativeui/OracleAnalysisModules.kt
          grep -q 'setMeasureWithLargestChildEnabled(true)' app/src/main/java/ro/alintudor/oracle/nativeui/OracleAnalysisModules.kt
          grep -q 'Applied Digital Corporation' app/src/main/java/ro/alintudor/oracle/nativeui/OracleAnalysisModules.kt
          ! grep -q 'maxLines = 4' app/src/main/java/ro/alintudor/oracle/nativeui/OracleAnalysisModules.kt
          ! grep -q 'host.dp(104)' app/src/main/java/ro/alintudor/oracle/nativeui/OracleAnalysisModules.kt
          ! grep -q 'baselineAligned = false' app/src/main/java/ro/alintudor/oracle/nativeui/OracleAnalysisModules.kt
          git diff --check

      - name: Commit B510 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle app/src/main/java/ro/alintudor/oracle/nativeui/OracleAnalysisModules.kt
          if ! git diff --cached --quiet; then
            git commit -m "B510: fix autosized Analysis matrix cards and company name [skip ci]"
            git push origin HEAD:main
          fi

      - name: Prepare production signing key
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$ORACLE_KEYSTORE_BASE64" ] && [ -n "$ORACLE_KEYSTORE_PASSWORD" ] && [ -n "$ORACLE_KEY_ALIAS" ] && [ -n "$ORACLE_KEY_PASSWORD" ]; then
            echo "$ORACLE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/oracle-release.jks"
            {
              echo "ORACLE_KEYSTORE_FILE=$RUNNER_TEMP/oracle-release.jks"
              echo "ORACLE_KEYSTORE_PASSWORD=$ORACLE_KEYSTORE_PASSWORD"
              echo "ORACLE_KEY_ALIAS=$ORACLE_KEY_ALIAS"
              echo "ORACLE_KEY_PASSWORD=$ORACLE_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
          fi

      - name: Build signed release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"

      - name: Upload B510 FINAL installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Oracle-APK-B510-FINAL-installable
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
