name: One-off patched Analysis build

on:
  push:
    branches:
      - feature/news-module-v1

permissions:
  contents: write

jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[analysis-build]')"
    runs-on: ubuntu-latest
    env:
      ORACLE_KEYSTORE_BASE64: ${{ secrets.ORACLE_KEYSTORE_BASE64 }}
      ORACLE_KEYSTORE_PASSWORD: ${{ secrets.ORACLE_KEYSTORE_PASSWORD }}
      ORACLE_KEY_ALIAS: ${{ secrets.ORACLE_KEY_ALIAS }}
      ORACLE_KEY_PASSWORD: ${{ secrets.ORACLE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/news-module-v1
          fetch-depth: 0
      - name: Remove one-off workflow and commit
        run: |
          rm -f .github/workflows/oneoff-analysis-build.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/oneoff-analysis-build.yml
          git commit -m "chore: remove one-off Analysis build workflow [analysis-build]"
          git push origin HEAD:feature/news-module-v1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Install Android 16 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Build patched release APK
        run: gradle :app:assembleRelease --stacktrace
      - name: Verify APK
        run: |
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
      - name: Upload patched APK
        uses: actions/upload-artifact@v4
        with:
          name: Oracle-Analysis-5M-UI-fix-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
