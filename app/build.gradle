plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'ro.alintudor.oracle'
    compileSdk 36

    defaultConfig {
        applicationId 'ro.alintudor.oracle'
        minSdk 26
        targetSdk 36
        versionCode 10
        versionName '2.1.4'
    }

    signingConfigs {
        release {
            def storeFilePath = System.getenv('ORACLE_KEYSTORE_FILE')
            if (storeFilePath != null && !storeFilePath.isBlank()) {
                storeFile file(storeFilePath)
                storePassword System.getenv('ORACLE_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ORACLE_KEY_ALIAS')
                keyPassword System.getenv('ORACLE_KEY_PASSWORD')
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
                enableV4Signing true
            }
        }
    }

    buildTypes {
        release {
            // Persistent production certificate is preferred whenever CI secrets exist.
            // CI keeps an installable non-production fallback until the production keystore is configured.
            def storeFilePath = System.getenv('ORACLE_KEYSTORE_FILE')
            signingConfig (storeFilePath != null && !storeFilePath.isBlank()) ? signingConfigs.release : signingConfigs.debug
            debuggable false
            minifyEnabled false
        }
    }
}

kotlin { jvmToolchain(17) }
