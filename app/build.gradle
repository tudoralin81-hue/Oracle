plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'ro.alintudor.oracle'
    compileSdk 36

    defaultConfig {
        applicationId 'ro.alintudor.oracle'
        minSdk 26
        targetSdk 36
        versionCode 10
        versionName '2.1.4'
    }

    signingConfigs {
        release {
            def storeFilePath = System.getenv('ORACLE_KEYSTORE_FILE')
            if (storeFilePath == null || storeFilePath.isBlank()) {
                throw new GradleException('Production release signing key is required. Refusing to create an APK with a changing debug signature.')
            }
            storeFile file(storeFilePath)
            storePassword System.getenv('ORACLE_KEYSTORE_PASSWORD')
            keyAlias System.getenv('ORACLE_KEY_ALIAS')
            keyPassword System.getenv('ORACLE_KEY_PASSWORD')
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
            enableV4Signing true
        }
    }

    buildTypes {
        release {
            // Production APKs always use the persistent Oracle release certificate.
            signingConfig signingConfigs.release
            debuggable false
            minifyEnabled false
        }
    }
}

kotlin { jvmToolchain(17) }
