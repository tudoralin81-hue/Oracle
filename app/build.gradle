plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'ro.alintudor.oracle'
    compileSdk 36

    defaultConfig {
        applicationId 'ro.alintudor.oracle'
        minSdk 26
        targetSdk 36
        versionCode 9
        versionName '2.1.3'
    }

    signingConfigs {
        release {
            def storeFilePath = System.getenv('ORACLE_KEYSTORE_FILE')
            if (storeFilePath != null && !storeFilePath.isBlank()) {
                storeFile file(storeFilePath)
            }
            storePassword System.getenv('ORACLE_KEYSTORE_PASSWORD')
            keyAlias System.getenv('ORACLE_KEY_ALIAS')
            keyPassword System.getenv('ORACLE_KEY_PASSWORD')
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
            enableV4Signing true
        }
    }

    buildTypes {
        release {
            // Release builds MUST use the persistent production signing key.
            // CI supplies the keystore and credentials through GitHub Actions secrets.
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}

kotlin { jvmToolchain(17) }
