plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'ro.alintudor.oracle'
    compileSdk 36

    defaultConfig {
        applicationId 'ro.alintudor.oracle'
        minSdk 26
        targetSdk 36
        versionCode 12
        versionName 'V6e'
    }

    signingConfigs {
        release {
            def storeFilePath = System.getenv('ORACLE_KEYSTORE_FILE')
            if (storeFilePath != null && !storeFilePath.isBlank()) {
                storeFile file(storeFilePath)
                storePassword System.getenv('ORACLE_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ORACLE_KEY_ALIAS')
                keyPassword System.getenv('ORACLE_KEY_PASSWORD')
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
                enableV4Signing true
            }
        }
    }

    buildTypes {
        release {
            def storeFilePath = System.getenv('ORACLE_KEYSTORE_FILE')
            if (storeFilePath != null && !storeFilePath.isBlank()) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
            debuggable false
            minifyEnabled false
        }
    }
}

tasks.register('prepareOracleIcon') {
    doLast {
        def input = file('src/main/assets/oracle_icon.b64')
        def output = file("${buildDir}/generated/res/oracle_icon/drawable-nodpi/oracle_icon.webp")
        output.parentFile.mkdirs()
        output.bytes = java.util.Base64.decoder.decode(input.text.trim())
    }
}

android.sourceSets.main.res.srcDir("${buildDir}/generated/res/oracle_icon")
tasks.named('preBuild').configure { dependsOn tasks.named('prepareOracleIcon') }

kotlin { jvmToolchain(17) }
