plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'ro.alintudor.oracle'
    compileSdk 36

    defaultConfig {
        applicationId 'ro.alintudor.oracle'
        minSdk 26
        targetSdk 36
        versionCode 12
        versionName 'V6e'
    }

    signingConfigs {
        release {
            def storeFilePath = System.getenv('ORACLE_KEYSTORE_FILE')
            if (storeFilePath != null && !storeFilePath.isBlank()) {
                storeFile file(storeFilePath)
                storePassword System.getenv('ORACLE_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ORACLE_KEY_ALIAS')
                keyPassword System.getenv('ORACLE_KEY_PASSWORD')
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
                enableV4Signing true
            }
        }
    }

    buildTypes {
        release {
            def storeFilePath = System.getenv('ORACLE_KEYSTORE_FILE')
            if (storeFilePath != null && !storeFilePath.isBlank()) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
            debuggable false
            minifyEnabled false
        }
    }
}

// The approved icon is stored losslessly enough for launcher use as Base64 so
// GitHub text-file updates can carry the exact supplied artwork. Materialize it
// before Android resource processing.
tasks.register('materializeOracleIcon') {
    doLast {
        def source = file('src/main/assets/oracle_icon.b64')
        def targetDir = file('src/main/res/drawable-nodpi')
        targetDir.mkdirs()
        def target = file('src/main/res/drawable-nodpi/oracle_icon_raster.webp')
        target.bytes = source.text.trim().decodeBase64()
    }
}

tasks.named('preBuild').configure { dependsOn('materializeOracleIcon') }

kotlin { jvmToolchain(17) }
