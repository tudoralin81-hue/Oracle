plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'ro.alintudor.oracle'
    compileSdk 36

    defaultConfig {
        applicationId 'ro.alintudor.oracle'
        minSdk 26
        targetSdk 36
        versionCode 8
        versionName '2.1.2'
    }

    buildTypes {
        release {
            // Production signing must use a persistent release key.
            // The current CI fallback is still the debug key until a release keystore is configured.
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }
}

kotlin { jvmToolchain(17) }
